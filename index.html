<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Daily Legends</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a1a">
<meta name="description" content="Daily Legends: o RPG da sua vida real.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Legends">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root{
  /* cor: pedra de castelo à noite (verde-acinzentado do Everpath), pergaminho no texto, vinho dos botões, ouro = XP e moeda */
  --pedra:#151a1a; --painel:#1e2524; --linha:#5c4a2e; --texto:#ece4cc; --fraco:#9c9886; --vinho:#8a2a2e; --ouro:#e7b04a;
  --bom:#7fb35a; --ruim:#d0503f; --raro:#5aa0e0; --epico:#b071e0;
  /* fonte: Cinzel é serifada de inscrição (linha do título do Everpath), medieval e legível; Pixelify Sans é pixel legível pro resto */
  --titulo:'Cinzel', Georgia, serif; --corpo:'Pixelify Sans', system-ui, sans-serif;
  /* layout: herói grande à esquerda no palco do castelo, painel de abas à direita (Dark Souls); no estreito, herói em cima */
  color-scheme: dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
/* cenário numa camada fixa do tamanho da tela: no iPhone, background fixed + cover esticava a imagem pela página inteira (zoom enorme) */
body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; background:var(--pedra) var(--cen, none) center bottom / cover no-repeat; image-rendering:pixelated; }
body{ background:var(--pedra); image-rendering:pixelated; color:var(--texto); font-family:var(--corpo); font-size:15px; line-height:1.35; min-height:100vh; }
img.px{ image-rendering:pixelated; width:16px; height:16px; vertical-align:middle; }
img.vox{ display:block; width:100%; height:auto; image-rendering:auto; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible, label:focus-within{ outline:2px solid var(--ouro); outline-offset:2px; }
[hidden]{ display:none !important; }
.fraco{ color:var(--fraco); font-size:13px; }

/* moldura pixelada */
.moldura{ background:rgba(21,26,26,.9); border:3px solid var(--linha); box-shadow: inset 0 0 0 2px #0009, 0 0 0 2px #0008, 0 8px 0 #0005;
  clip-path: polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px)); }
.btn{ background:var(--vinho); border:0; padding:10px 16px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  box-shadow: inset -3px -3px 0 #0006, inset 3px 3px 0 #ffffff26, 0 0 0 2px #000a; font-weight:600; letter-spacing:.5px; text-shadow:0 2px 0 #0008; }
.btn:hover{ filter:brightness(1.15); } .btn:active{ box-shadow: inset 3px 3px 0 #0006, 0 0 0 2px #000a; transform:translateY(1px); }
.btn.ouro{ background:#b07a1e; } .btn.off{ opacity:.5; }
.btn.pendente{ position:relative; } .btn.pendente::after{ content:''; position:absolute; top:4px; right:4px; width:8px; height:8px; background:var(--ouro); box-shadow:0 0 0 2px #000; }
.bar{ height:10px; background:#0b0e0e; box-shadow: inset 0 0 0 2px #000, 0 0 0 1px var(--linha); flex:1; min-width:40px; position:relative; }
.bar i{ display:block; height:100%; background:linear-gradient(#ffd77a 0 30%, var(--ouro) 30% 75%, #b07a1e 75%); transition:width .4s; }
.bar.vida i{ background:linear-gradient(#ff8a7a 0 30%, var(--ruim) 30% 75%, #8a1f1a 75%); }

/* tela inicial */
#titulo{ min-height:100vh; display:grid; place-items:center; padding:32px 16px; }
#titulo h1{ font-family:var(--titulo); font-weight:400; font-size:clamp(46px, 10vw, 112px); line-height:1; font-weight:900; margin:0 0 24px; text-align:center; color:#dfe8e4; text-shadow:0 4px 0 #0b1010, 0 0 30px #9ab8b080; letter-spacing:2px; }
.menu{ width:min(360px, 100%); padding:24px; display:grid; gap:12px; justify-self:center; }
.menu .btn{ width:100%; font-size:18px; }
.sl2{ display:grid; gap:4px; background:var(--vinho); padding:8px 14px 10px; box-shadow: inset -3px -3px 0 #0006, inset 3px 3px 0 #ffffff26, 0 0 0 2px #000a; text-align:center; font-size:13px; letter-spacing:1px; text-transform:lowercase; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:6px; background:#0b0e0e; box-shadow:0 0 0 2px #0009; margin:8px 0; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:20px; background:var(--texto); box-shadow: inset -2px -2px 0 #9c9886, 0 0 0 2px #000; cursor:pointer; }
input[type=range]::-moz-range-thumb{ width:12px; height:20px; border:0; border-radius:0; background:var(--texto); box-shadow:0 0 0 2px #000; }
.arquivo input{ display:none; }
#tData{ text-align:center; }

/* jogo */
#jogo{ display:grid; grid-template-rows:auto 1fr; min-height:100vh; }
.topo{ display:flex; align-items:center; gap:16px; padding:8px 16px; background:rgba(12,15,15,.88); border-bottom:3px solid var(--linha); flex-wrap:wrap; }
.marca{ font-family:var(--titulo); font-weight:900; font-size:26px; letter-spacing:1px; line-height:1; color:#dfe8e4; margin-right:auto; text-shadow:0 2px 0 #000; }
.stat{ display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; font-size:17px; }
.stat b{ font-weight:600; }
.nivelG{ display:flex; align-items:center; gap:8px; min-width:180px; }
.nivelG .lv{ font-family:var(--titulo); font-weight:700; font-size:24px; line-height:1; color:var(--ouro); }
.nivelG .xpw{ display:grid; gap:2px; flex:1; } .nivelG small{ color:var(--fraco); font-size:12px; }
.ib{ background:none; border:0; padding:6px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:17px; }
.ib img.px{ width:22px; height:22px; }
#btnBau.cheio img{ animation:pula 1s steps(2) infinite; }
@keyframes pula{ 50%{ transform:translateY(-3px); } }
#btnMudo.off{ opacity:.45; }
#btnNuvem{ min-height:40px; padding:6px 12px; font-size:14px; white-space:nowrap; }
#btnNuvem.n-reconectar, #btnNuvem.n-erro{ background:var(--vinho); } #btnNuvem.n-offline{ background:#3a3d3a; } #btnNuvem.n-sync{ opacity:.8; }
#avisoVersao{ position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:40; width:min(420px, calc(100% - 24px)); }
#avisoVersao .btn{ width:100%; background:#b07a1e; }
body.conectando::after{ content:'Conectando ao Google…'; position:fixed; inset:0; display:grid; place-items:center; background:var(--pedra); color:var(--texto); font:16px var(--corpo); z-index:99; }
.topo{ padding-top:max(8px, env(safe-area-inset-top)); padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
#titulo{ padding-top:max(32px, env(safe-area-inset-top)); padding-bottom:max(32px, env(safe-area-inset-bottom)); }
.main{ padding-bottom:max(16px, env(safe-area-inset-bottom)); }
.tConta{ text-align:center; margin:0; }

.main{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:16px; padding:16px; min-height:0; }
.palco{ position:relative; min-height:420px; }
#palco3d{ position:absolute; inset:0; }
#palco3d canvas{ cursor:grab; display:block; }
.placa{ position:absolute; left:8px; bottom:8px; padding:12px 16px; width:min(380px, calc(100% - 16px)); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:end; }
.placa .trocar{ grid-row:1 / span 3; grid-column:2; min-height:40px; padding:6px 12px; font-size:13px; }
.pnome{ font-family:var(--titulo); font-weight:700; font-size:26px; line-height:1; }
.plema{ color:var(--fraco); font-size:13px; margin-bottom:8px; }
.pnv{ display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; } .pnv b{ color:var(--ouro); } .pfr{ font-size:12px; color:var(--fraco); }

.painel{ display:grid; grid-template-rows:auto 1fr; min-height:0; max-height:calc(100vh - 100px); }
#tabs{ display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:4px; padding:8px; background:#0c0f0f; border-bottom:3px solid var(--linha); }
.tab{ background:#1e2524; border:0; padding:8px 2px 6px; display:grid; justify-items:center; gap:4px; font-size:10px; color:var(--fraco); box-shadow: inset 0 0 0 2px #000, inset 3px 3px 0 #ffffff12; min-height:52px; overflow:hidden; }
.tab img{ width:24px; height:24px; image-rendering:pixelated; }
.tab.on{ background:var(--vinho); color:var(--texto); box-shadow: inset 0 0 0 2px #000, inset 3px 3px 0 #ffffff26; }
.tab span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
#conteudo{ padding:16px; overflow-y:auto; min-height:0; }
.sec{ display:flex; align-items:baseline; gap:12px; margin:8px 0 12px; flex-wrap:wrap; }
.sec h3{ font-family:var(--titulo); font-weight:700; font-size:24px; margin:0; line-height:1; margin-right:auto; }
.saldo{ font-size:18px; color:var(--ouro); font-variant-numeric:tabular-nums; }

/* raridade */
.r-comum{ --rc:#8a8676; } .r-raro{ --rc:var(--raro); } .r-epico{ --rc:var(--epico); } .r-lendario{ --rc:var(--ouro); }

/* equipamento */
.equip{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
.equip > *{ min-width:0; }
.slots{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.slot, .cel{ aspect-ratio:1; background:radial-gradient(#2a3231, #141918); border:0; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--rc, #3a3326); padding:6px; position:relative; display:grid; place-items:center; }
.slot{ padding:6px 6px 18px; }
.slot .sl{ position:absolute; bottom:4px; left:0; right:0; font-size:11px; color:var(--fraco); text-align:center; }
.slot.sel, .cel.sel{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro), 0 0 12px #e7b04a55; }
.slot .vazio{ width:40%; aspect-ratio:1; border:2px dashed #3a3326; }
.slot img.vox, .cel img.vox{ width:100%; height:100%; object-fit:contain; }
.cel.nada{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #262b26; }
.cel .eqm{ position:absolute; top:4px; left:4px; background:var(--ouro); color:#1a1408; font-size:10px; font-weight:600; padding:0 4px; }
.inv{ display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:6px; }
.info{ display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center; padding:12px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--rc,#3a3326); align-self:start; }
.info.vazioinfo{ grid-template-columns:1fr; }
.info img.big{ width:96px; height:96px; }
.inome{ font-family:var(--titulo); font-weight:700; font-size:21px; line-height:1; color:var(--rc, var(--texto)); }
.imeta{ color:var(--fraco); font-size:13px; display:flex; gap:10px; margin:4px 0 10px; } .rar{ color:var(--rc); }
.acoes{ display:flex; gap:8px; flex-wrap:wrap; }

/* atributos */
.lista{ display:grid; gap:8px; }
.area{ background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; }
.area summary{ list-style:none; display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"i n v" "b b b"; gap:6px 10px; align-items:center; padding:12px 14px; cursor:pointer; }
.area summary::-webkit-details-marker{ display:none; }
.area .ai{ grid-area:i; width:24px; height:24px; } .anome{ grid-area:n; font-size:17px; font-weight:600; } .anv{ grid-area:v; font-family:var(--titulo); font-weight:700; font-size:20px; color:var(--ouro); line-height:1; }
.abar{ grid-area:b; display:flex; align-items:center; gap:10px; } .afr{ font-size:12px; color:var(--fraco); font-variant-numeric:tabular-nums; white-space:nowrap; }
.alerta{ grid-area:n; justify-self:end; color:var(--ruim); font-size:12px; }
.skills{ display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 14px; }
.skill{ background:#22201a; box-shadow: inset 0 0 0 2px var(--linha); padding:4px 8px; font-size:13px; }

/* missões */
.miss{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; }
.miss .ai{ width:24px; height:24px; } .mn{ font-weight:600; } .mm{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--fraco); }
.ms{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:12px; }
.stars{ display:inline-flex; gap:1px; } .st{ width:14px !important; height:14px !important; }
.pend{ color:var(--fraco); } .falha{ color:var(--ruim); } .sem{ color:var(--texto); font-variant-numeric:tabular-nums; }

/* chefões */
.bosses{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
.boss{ display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; padding:10px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #4a1f1f; position:relative; }
.bimg{ width:110px; height:110px; background:radial-gradient(#3a2222, #120c0c); box-shadow: inset 0 0 0 2px #000; }
.bnome{ font-family:var(--titulo); font-weight:700; font-size:20px; line-height:1; color:#f0c8b8; } .bdesc{ font-size:13px; margin:2px 0 8px; }
.hp{ display:flex; align-items:center; gap:8px; font-size:12px; font-variant-numeric:tabular-nums; } .hp span{ color:var(--ruim); font-weight:600; } .hp b{ font-weight:600; }
.hp .cont{ color:var(--ouro); font-size:16px; }
.bmeta{ font-size:12px; color:var(--fraco); margin-top:2px; }
.fases{ margin:6px 0 0; padding:0; list-style:none; font-size:12px; display:grid; gap:2px; } .fases li::before{ content:'□ '; color:var(--fraco); } .fases li.ok{ color:var(--bom); } .fases li.ok::before{ content:'■ '; }
.brec{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ouro); margin-top:8px; flex-wrap:wrap; }
.boss.morto{ filter:grayscale(.7); } .selo{ position:absolute; top:12px; right:12px; background:var(--vinho); padding:2px 8px; font-size:12px; transform:rotate(4deg); box-shadow:0 0 0 2px #000; }

/* loja */
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.chip{ background:#1e2524; border:0; padding:6px 10px; min-height:36px; font-size:13px; box-shadow: inset 0 0 0 2px #000; }
.chip.on{ background:var(--vinho); }
.lgrid, .hgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); gap:8px; }
.loja, .hcard{ display:grid; gap:4px; justify-items:center; text-align:center; padding:10px 8px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--rc,#2a2620); position:relative; border:0; }
.loja img.vox{ width:84px; height:84px; } .ln{ font-size:13px; font-weight:600; min-height:2.6em; display:grid; place-items:center; } .lr{ font-size:11px; color:var(--rc); }
.loja .btn{ width:100%; min-height:40px; padding:6px; font-size:14px; font-variant-numeric:tabular-nums; }
.tem{ font-size:12px; color:var(--bom); min-height:40px; display:grid; place-items:center; }
.loja.tido{ opacity:.8; }
.loja .prov{ background:none; border:0; padding:0; display:grid; justify-items:center; gap:4px; width:100%; position:relative; }
.loja .prov:hover img.vox{ transform:translateY(-2px); }
.loja.provando{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro), 0 0 14px #e7b04a55; opacity:1; }
.ptag{ position:absolute; top:-4px; right:-2px; background:var(--ouro); color:#1a1408; font-size:10px; font-weight:600; padding:1px 5px; }
.misterio img.vox, .hcard.misterio img{ filter: drop-shadow(0 0 6px #b071e0aa); animation: brilho 2.6s ease-in-out infinite; }
.hcard.misterio img{ filter: drop-shadow(0 0 6px #b071e0aa); }
@keyframes brilho{ 50%{ filter: drop-shadow(0 0 12px #e7b04acc); } }
.misterio .ln, .misterio .hn{ letter-spacing:4px; color:#c9a8f0; }
.tem.trava{ color:var(--fraco); font-size:11px; gap:4px; display:flex; align-items:center; justify-content:center; }
.dica{ margin:-4px 0 10px; }
.cod{ width:100%; background:#0c0f0f; color:var(--texto); border:0; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 3px var(--linha); padding:10px; font:12px/1.4 var(--corpo); word-break:break-all; resize:vertical; }
.gtxt{ padding:0 14px 12px; font-size:14px; line-height:1.5; color:var(--texto); }
.guia .area summary{ grid-template-areas:'n'; grid-template-columns:1fr; } .link{ background:none; border:0; color:var(--ouro); text-decoration:underline; padding:4px; min-height:32px; }
.provabar{ grid-column:1 / -1; display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid #3a3226; font-size:12px; color:var(--ouro); }
.provabar span{ flex:1; } .provabar .btn{ min-height:34px; padding:4px 10px; font-size:13px; }
.hcard img{ width:100%; max-width:120px; aspect-ratio:1; background:radial-gradient(#2a3231, #141918); }
.hcard.bloq img{ filter:brightness(.45) saturate(.6); }
.hcard .cad{ position:absolute; top:40px; left:50%; transform:translateX(-50%); width:28px; height:28px; }
.hcard.ativo{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro); }
.hn{ font-family:var(--titulo); font-weight:700; font-size:17px; line-height:1; } .hl{ font-size:11px; color:var(--fraco); min-height:2.4em; }
.hnv{ position:absolute; top:8px; left:8px; background:var(--ouro); color:#1a1408; font-size:11px; font-weight:600; padding:0 5px; }
.hcard .btn{ width:100%; min-height:40px; padding:6px; font-size:14px; }

/* conquistas */
.cgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:8px; }
.conq{ display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center; padding:10px 12px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; color:var(--fraco); }
.conq .ci{ width:28px; height:28px; } .conq.ok{ color:var(--texto); box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #7a5a1e; } .cn{ font-weight:600; } .cd{ font-size:12px; }
.conq:not(.ok) .ci{ opacity:.5; }

/* diário */
.dia{ background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; padding:10px 14px; margin-bottom:8px; }
.dh{ display:flex; justify-content:space-between; font-family:var(--titulo); font-weight:700; font-size:19px; margin-bottom:4px; } .dh b{ font-weight:400; color:var(--ouro); }
.de{ display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid #2a2620; font-size:14px; }
.de b{ font-variant-numeric:tabular-nums; color:var(--ouro); min-width:3ch; text-align:right; } .neg{ color:var(--ruim) !important; }

/* opções */
.opc{ display:grid; gap:12px; max-width:360px; }
.perigo{ margin-top:18px; padding-top:14px; border-top:2px solid #3a2020; display:grid; gap:8px; } .perigo h3{ color:var(--ruim); margin:0; }
.btn.ruim{ background:#5a1414; box-shadow: inset -3px -3px 0 #0006, inset 3px 3px 0 #ffffff1a, 0 0 0 2px #000a, 0 0 0 4px #8a2a2e; }
.btn.ruim[disabled]{ opacity:.45; filter:grayscale(.6); cursor:not-allowed; }
.zlista{ margin:6px 0 10px; padding-left:20px; display:grid; gap:2px; } .zaviso{ color:var(--ruim); font-weight:700; }
#zerarTxt{ width:100%; font-size:18px; letter-spacing:2px; text-transform:uppercase; padding:10px; background:#0c0f0f; color:var(--texto); border:0; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 3px #8a2a2e; }

/* modal e aviso */
#modal{ position:fixed; inset:0; background:#000b; display:grid; place-items:center; padding:16px; z-index:20; }
#modal .mc{ width:min(440px, 100%); max-height:calc(100vh - 32px); overflow:auto; padding:20px; }
#modal.largo .mc{ width:min(980px, 100%); }
#modal h2{ font-family:var(--titulo); font-weight:700; font-size:30px; margin:0 0 8px; line-height:1; }

/* ===== Voxel v2: bonecos esculpidos em meia resolução (voxel = 0,5 do mundo) ===== */
const VS = 0.5;
// pivôs em coordenadas de voxel (canto), x esquerda(-)/direita(+), y cima, z frente(+)
const PIV = { head:[0,44,0], torso:[0,0,0], armL:[-12.5,41,-0.5], armR:[12.5,41,-0.5], legL:[-4,24,0], legR:[4,24,0] };
// caixa da cabeça
const HX0=-8, HX1=7, HY0=45, HY1=60, HZ0=-7, HZ1=6;

class VModel {
  constructor(){ this.parts = {}; for (const k in PIV) this.parts[k] = new Map(); this.pose = {}; this.hairOrig = new Map(); }
  set(p,x,y,z,c){ if (c) this.parts[p].set(x+','+y+','+z, c); }
  get(p,x,y,z){ return this.parts[p].get(x+','+y+','+z); }
  has(p,x,y,z){ return this.parts[p].has(x+','+y+','+z); }
  del(p,x,y,z){ this.parts[p].delete(x+','+y+','+z); }
  box(p,x0,x1,y0,y1,z0,z1,c){
    for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++) for (let z=z0;z<=z1;z++)

function buildVModel(h, equip, opts){
  const m = new VModel();
  opts = opts || {};
  paintBody(m,h); paintFace(m,h); paintHair(m,h);
  if (ESTILO_NOVO) camadas(m,h);
  const eq = equip || {};
  const order = ['pernas','maos','peito','acess','cabeca','arma'];
  for (const s of order){
    const id = eq[s]; if (!id) continue; const it = ITEM[id]; if (!it) continue;
    const cor = Object.assign({}, it.c, (opts.cor||{})[id]||{});
    P[it.p](m, cor);
  }
  if (!eq.arma && h.arma && WEAPONS[h.arma]) WEAPONS[h.arma](m);
  m.pose.armR = (eq.arma ? ITEM[eq.arma].c.k : h.arma);
  if (ESTILO_NOVO) estilizar(m,h);
  return m;
}

const PERNA_K = 1.6, PERNA_Y0 = 9, PERNA_Y1 = 23;
const PERNA_D = Math.round((PERNA_Y1-PERNA_Y0+1)*PERNA_K) - (PERNA_Y1-PERNA_Y0+1);
function estilizar(m,h){
  // 1) pernas mais compridas: estica a faixa da canela à coxa e sobe o resto
  for (const p in m.parts){
    const novo = new Map();
    m.parts[p].forEach((c,k)=>{ const [x,y,z]=k.split(',').map(Number);
      if (y<PERNA_Y0) novo.set(k,c);
      else if (y>PERNA_Y1) novo.set(x+','+(y+PERNA_D)+','+z,c);
      else { const a = PERNA_Y0 + Math.ceil((y-PERNA_Y0)*PERNA_K), b = PERNA_Y0 + Math.ceil((y+1-PERNA_Y0)*PERNA_K) - 1; for (let ny=a; ny<=b; ny++) novo.set(x+','+ny+','+z,c); } });
    m.parts[p] = novo;
  }
  m.piv = {}; for (const k in PIV) m.piv[k] = k==='torso' ? PIV[k].slice() : [PIV[k][0], PIV[k][1]+PERNA_D, PIV[k][2]];
  // 2) estampa: cada bloquinho com tom próprio (manchas grandes + grão), menos pele e rosto
  const sk = h.skin ? parseInt(h.skin.slice(1),16) : -1, sr=sk>>16, sg=(sk>>8)&255, sb=sk&255;
  const pele = c=>{ if (sk<0) return false; const n=parseInt(c.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255; const l=(r+g+b)/(sr+sg+sb||1); return l>0.6 && l<1.4 && Math.abs(r/(g+1)-sr/(sg+1))<0.12 && Math.abs(g/(b+1)-sg/(sb+1))<0.18; };
  for (const p of ['torso','armL','armR','legL','legR']){
    const map = m.parts[p];
    map.forEach((c,k)=>{ if (c[0]!=='#' || pele(c)) return; const [x,y,z]=k.split(',').map(Number);
      const lf = hash3(Math.floor(x/3)+31, Math.floor(y/3)+7, Math.floor(z/3)+3), hf = hash3(x,y,z);
      const f = (lf-0.5)*0.16 + (hf-0.5)*0.07; map.set(k, shade(c, f)); });
  }
}

let MAT, MAT_SIL;
function initThree(){ MAT = new THREE.MeshLambertMaterial({ vertexColors:true }); }

const FACES = [
  { n:[1,0,0], u:[0,1,0], w:[0,0,1] }, { n:[-1,0,0], u:[0,1,0], w:[0,0,1] },
  { n:[0,1,0], u:[0,0,1], w:[1,0,0] }, { n:[0,-1,0], u:[0,0,1], w:[1,0,0] },
  { n:[0,0,1], u:[1,0,0], w:[0,1,0] }, { n:[0,0,-1], u:[1,0,0], w:[0,1,0] }

FACES.forEach(f=>{ const c=[f.u[1]*f.w[2]-f.u[2]*f.w[1], f.u[2]*f.w[0]-f.u[0]*f.w[2], f.u[0]*f.w[1]-f.u[1]*f.w[0]]; f.flip = (c[0]*f.n[0]+c[1]*f.n[1]+c[2]*f.n[2]) < 0; });
const AOL = (typeof ESTILO_NOVO!=='undefined' && ESTILO_NOVO) ? [0.38, 0.6, 0.82, 1.0] : [0.52, 0.7, 0.86, 1.0];
const colCache = {};
function rgbOf(hex){ if (colCache[hex]) return colCache[hex]; const c=new THREE.Color(hex); return colCache[hex]=[c.r,c.g,c.b]; }

function meshPart(map, occ, pv, sc, sil){
  const pos=[], nor=[], col=[], idx=[];
  const K=(x,y,z)=> x+','+y+','+z;
  map.forEach((c,k)=>{
    const [x,y,z]=k.split(',').map(Number);
    const base = sil ? [0.07,0.065,0.09] : rgbOf(c);
    const j = sil ? 1 : 0.95 + hash3(x,y,z)*0.1;
    for (const f of FACES){
      const nx=x+f.n[0], ny=y+f.n[1], nzz=z+f.n[2];
      if (map.has(K(nx,ny,nzz))) continue;
      const ao=[], v0=pos.length/3;
      const corners = [[-1,-1],[1,-1],[1,1],[-1,1]];
      for (const [su,sw] of corners){
        const s1 = occ.has(K(nx+f.u[0]*su, ny+f.u[1]*su, nzz+f.u[2]*su)) ? 1:0;
        const s2 = occ.has(K(nx+f.w[0]*sw, ny+f.w[1]*sw, nzz+f.w[2]*sw)) ? 1:0;
        const cc = occ.has(K(nx+f.u[0]*su+f.w[0]*sw, ny+f.u[1]*su+f.w[1]*sw, nzz+f.u[2]*su+f.w[2]*sw)) ? 1:0;
        const a = (s1&&s2) ? 0 : 3-(s1+s2+cc); ao.push(a);
        const px = x+0.5 + f.n[0]*0.5 + f.u[0]*0.5*su + f.w[0]*0.5*sw;
        const py = y+0.5 + f.n[1]*0.5 + f.u[1]*0.5*su + f.w[1]*0.5*sw;
        const pz = z+0.5 + f.n[2]*0.5 + f.u[2]*0.5*su + f.w[2]*0.5*sw;
        pos.push((px-pv[0])*sc, (py-pv[1])*sc, (pz-pv[2])*sc); nor.push(f.n[0],f.n[1],f.n[2]);
        const l = AOL[a]*j; col.push(base[0]*l, base[1]*l, base[2]*l);
      }
      const q = (ao[0]+ao[2] < ao[1]+ao[3]) ? [1,2,3,1,3,0] : [0,1,2,0,2,3];
      if (f.flip) idx.push(v0+q[0],v0+q[2],v0+q[1], v0+q[3],v0+q[5],v0+q[4]);
      else idx.push(v0+q[0],v0+q[1],v0+q[2], v0+q[3],v0+q[4],v0+q[5]);
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(pos.length/3 > 65000 ? new THREE.Uint32BufferAttribute(idx,1) : new THREE.Uint16BufferAttribute(idx,1));
  return g;
}

    const pena = new THREE.Mesh(this.fxGeo, this.fxMat['#f2efe6'] || (this.fxMat['#f2efe6'] = new THREE.MeshBasicMaterial({ color:'#f2efe6' }))); pena.scale.set(0.15,0.8,1); pena.position.z = -2.2; g.add(pena);

  animaFx(dt){
    for (let i=this.fx.length-1;i>=0;i--){
      const f = this.fx[i]; f.vida -= dt;
      if (f.vida<=0){ this.fxG.remove(f.m); this.fx.splice(i,1); continue; }
      f.vel.y -= f.grav*dt; f.m.position.addScaledVector(f.vel, dt);
      if (!f.fixo){ f.m.scale.setScalar(f.tam * Math.min(1, f.vida/f.total*1.6)); f.m.rotation.x += f.gira*dt; f.m.rotation.y += f.gira*dt; }
    }
  }
  // enquadra herói + pet inteiros em qualquer ângulo de giro, com qualquer item, em qualquer tela:
  // testa a distância da câmera (busca binária) projetando um cilindro que envolve tudo, e centraliza na faixa livre do palco
  resize(){
    const w = this.el.clientWidth||300, h = this.el.clientHeight||300;
    if (this.renderer.domElement.parentNode){ this.renderer.setSize(w,h,false); this.renderer.domElement.style.width='100%'; this.renderer.domElement.style.height='100%'; }
    const cam = this.camera; cam.aspect = w/h; cam.clearViewOffset();
    const hb = this.hb || { y0:0, y1:32, r:10 }, pb = this.pb;
    const y0 = Math.min(hb.y0, pb ? pb.y0 : 0), y1 = Math.max(hb.y1, pb ? pb.y1 : 0), R = Math.max(hb.r, pb ? pb.r : 0, 8);
    // faixa livre (em NDC, -1..1): margem de 5% e, no layout largo, sem ficar atrás da placa do nome
    const mx = 0.92; let yb = -0.92, yt = 0.92;
    const pl = this.livre ? this.livre(w,h) : null;
    if (pl!=null && typeof pl==='object'){ if (pl.yb!=null) yb = Math.max(yb, pl.yb); if (pl.yt!=null) yt = Math.min(yt, pl.yt); if (yt-yb < 0.5) yt = Math.min(0.92, yb+0.5); }
    else if (pl!=null) yb = Math.max(yb, pl);
    const cy = (y0+y1)/2, pitch = 0.1;
    const pts = []; for (let i=0;i<24;i++){ const a=i/24*Math.PI*2; pts.push([Math.cos(a)*R, y0, Math.sin(a)*R], [Math.cos(a)*R, y1, Math.sin(a)*R]); }
    pts.push([0,y1,0],[0,y0,0]);
    const v = new THREE.Vector3();
    const poe = d=>{ cam.position.set(0, cy + Math.sin(pitch)*d, Math.cos(pitch)*d); cam.lookAt(0, cy, 0); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true); };
    const mede = ()=>{ let ax=0, lo=9, hi=-9; for (const p of pts){ v.set(p[0],p[1],p[2]).project(cam); ax=Math.max(ax,Math.abs(v.x)); lo=Math.min(lo,v.y); hi=Math.max(hi,v.y); } return { ax, lo, hi }; };
    let a = R*1.2+2, z = 4000;
    for (let k=0;k<32;k++){ const d=(a+z)/2; poe(d); const m=mede(); if (m.ax<=mx && (m.hi-m.lo)<=(yt-yb)) z=d; else a=d; }
    poe(z); const m = mede();
    // desloca a imagem pra centralizar o conteúdo na faixa livre (setViewOffset move em pixels; 1 NDC = h/2 px)
    const off = Math.round((((yt+yb)/2) - ((m.hi+m.lo)/2)) * h/2);
    cam.setViewOffset(w, h, 0, off, w, h); cam.updateProjectionMatrix();
    this.fit = { d:z, off, R, y0, y1, yb, yt };
  }
  frame(t){
    const s = (t-this.t0)/1000, dt = Math.min(0.05, Math.max(0, (t-this.ult)/1000)); this.ult = t;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!this.drag && t > this.autoT && !reduce) this.yaw += 0.0035;
    this.root.rotation.y = this.yaw; this.plat.rotation.y = this.yaw;
    // de vez em quando, sozinho e sem som: o herói ou um pet faz a sua graça
    if (!reduce && !this.anim && !this.drag && t > this.proxSozinho && !document.hidden){
      this.proxSozinho = t + 16000 + Math.random()*14000;
      const n = this.pets.length; const k = Math.floor(Math.random()*(n+2));
      if (k<n) this.tocaPet(k, false); else if (this.model) this.tocaHeroi(false);
    }
    const a = this.anim; if (a){ a.ant = a.t; a.t += dt; }
    if (this.model && !reduce){
      const p = this.model.userData.parts, m = this.model;
      const br = Math.sin(s*1.6);
      p.head.rotation.set(br*0.025, 0, Math.sin(s*0.7)*0.03);
      p.torso.position.y = br*0.12;
      p.armL.rotation.set(br*0.05, 0, -0.04 - br*0.02);
      p.armR.rotation.set((this.armBase||0) - br*0.05, 0, 0.04 + br*0.02);
      p.legL.rotation.set(0,0,0); p.legR.rotation.set(0,0,0);
      for (const k of ['head','armL','armR']) p[k].position.y = p[k].userData.base[1] + br*0.12;
      m.position.set(0,0,0); m.rotation.set(0,0,0);
      if (a && a.alvo==='heroi'){ const an = a.def || ANIM_HEROI[a.cl]; an.pose(a.t, p, m, this.armBase||0, this); if (a.t >= an.dur){ this.anim = null; m.position.set(0,0,0); m.rotation.set(0,0,0); m.visible = true; } }
      this.pets.forEach((pt,i)=>{
        const g = pt.g, P = pt.parts;
        for (const k in P) P[k].rotation.set(0,0,0);
        g.position.set(pt.base[0], 0, pt.base[1]); g.rotation.y = pt.base[2]; pt.corpo.position.set(0,0,0); pt.corpo.rotation.set(0,0,0);
        const tp = pt.tipo, ss = s + pt.fase;
        g.position.y = tp==='peixe' ? 1+Math.sin(ss*1.3)*0.5 : (tp==='passaro' ? Math.max(0,Math.sin(ss*3))*0.35 : Math.abs(Math.sin(ss*1.6))*0.15);
        petParado(tp, P, s, pt.fase);
        if (a && a.alvo==='pet' && a.i===i){
          const an = (typeof ANIM_PET_V!=='undefined' && ANIM_PET_V[tp] && ANIM_PET_V[tp][a.v||0]) || ANIM_PET[tp]; const y0 = g.position.y;
          g.position.set(0,0,0); g.rotation.y = 0;
          an.pose(a.t, P, g, this, pt.corpo);
          g.position.x += pt.base[0]; g.position.z += pt.base[1]; g.position.y += y0; g.rotation.y += pt.base[2];
          if (a.t >= an.dur) this.anim = null;
        }
      });
    } else if (a && a.t > 2) this.anim = null;
    this.animaFx(dt);
    this.renderer.render(this.scene, this.camera);
  }
}

/* renderizador de ícones e retratos, com cache */
const Shots = {
  r:null, cache:{},
  init(){
    this.r = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
    this.r.setSize(160,160); this.scene = new THREE.Scene(); addLights(this.scene);
    this.cam = new THREE.OrthographicCamera(-10,10,10,-10,0.1,500);
  },
  shot(key, vm, frame, sil){
    if (this.cache[key]) return this.cache[key];
    if (!this.r) return '';
    const g = buildMesh(vm, { sil }); const b = cellBounds(vm);
    let cx=(b.mn[0]+b.mx[0])/2, cy=(b.mn[1]+b.mx[1])/2, cz=(b.mn[2]+b.mx[2])/2;
    let size = Math.max(b.mx[0]-b.mn[0], b.mx[1]-b.mn[1], b.mx[2]-b.mn[2])*0.62 + 1;
    if (frame==='busto'){ cy = 25.2 + (vm.piv ? (vm.piv.head[1]-PIV.head[1])*VS : 0); size = 10; cx = 0; cz = 0; }
    if (frame==='arma') size = Math.max(b.mx[1]-b.mn[1], b.mx[0]-b.mn[0])*0.42 + 1.5;
    const piv = new THREE.Group(); piv.add(g); g.position.set(-cx,-cy,-cz); piv.rotation.y = frame==='busto' ? 0.42 : -0.6; piv.rotation.x = frame==='busto' ? 0 : 0.18;
    if (frame==='arma'){ piv.rotation.set(0.15,-0.5,-0.72); }
    this.scene.add(piv);
    const c=this.cam; c.left=-size; c.right=size; c.top=size; c.bottom=-size; c.position.set(0,frame==='busto'?3:6,100); c.lookAt(0,0,0); c.updateProjectionMatrix();
    this.r.render(this.scene, c);
    const url = this.r.domElement.toDataURL('image/png');
    this.scene.remove(piv); disposeGroup(g);
    this.cache[key] = url; return url;

  pet(p, extra, sil){ return this.shot('p:'+p.tipo+':'+(p.cor||'')+':'+JSON.stringify(Object.assign({},p.equip||{},extra||{}))+(sil?':s':''), buildPetVModel(p, extra), null, sil); },
  petItem(it){ return this.shot('pi:'+it.id, buildPetItemVModel(it), null); },

};

/* ---------- golpe de cada arma ----------
   famílias com parâmetros; hit = momentos em que a arma acerta (na arena, o chefão sente o golpe) */
function aCima(o){ // golpe de cima pra baixo
  const T=o.t||1.3, h=T*0.4;
  return { dur:T, hit:[h], perto:true, pose(t,p,m,b,st){
    p.armR.rotation.x = kf(t,[[0,b],[h*0.7,o.alto||-2.6],[h,o.baixo||-0.2],[T*0.75,o.baixo||-0.2],[T,b]]);
    if (o.duas){ p.armL.rotation.x = p.armR.rotation.x*0.85; p.armL.rotation.z = kf(t,[[0,-0.04],[h*0.7,0.35],[T,-0.04]]); }
    m.position.y = o.pulo ? kf(t,[[0,0],[h*0.3,-0.5],[h*0.75,o.pulo],[h,0],[T,0]]) : 0;
    m.position.z = kf(t,[[0,0],[h*0.7,-0.4],[h,o.avanco||1.4],[T*0.8,o.avanco||1.4],[T,0]]);
    m.rotation.x = kf(t,[[0,0],[h*0.7,-0.12],[h,0.22],[T*0.8,0.1],[T,0]]);
    p.legL.rotation.x = kf(t,[[0,0],[h,-0.45],[T*0.8,-0.45],[T,0]]); p.legR.rotation.x = kf(t,[[0,0],[h,0.3],[T*0.8,0.3],[T,0]]);
    if (o.rastro && t<h && t>h*0.5 && st.cada(0.025)) st.brilho('ponta', o.rastro, 2);
    if (st.uma(h)){ (o.fx||['corte']).forEach(f=>st.fxArma(f)); }
    if (o.vezes>1) for (let k=1;k<o.vezes;k++){ const hh=h+k*0.28; if (st.uma(hh)) (o.fx||['corte']).forEach(f=>st.fxArma(f)); }
  } };
}
function aEstocada(o){ // estocadas pra frente
  const n=o.n||1, T=0.5+n*0.32;

/* ===== Pixel art: cenário e ícones 8x8 ===== */
function cenario(tema){
  if (tema && tema!=='castelo' && CENARIOS_FN[tema]) return CENARIOS_FN[tema]();
  const W=320, H=180, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const px=(x,y,c)=>{ g.fillStyle=c; g.fillRect(x,y,1,1); };
  // céu em faixas com pontilhado
  const ceu=['#1b2426','#212d2f','#283738','#2f4241','#3a4f4b','#4a5f57','#5d7165'];
  const fx=H*0.62/ceu.length;
  for (let i=0;i<ceu.length;i++){ g.fillStyle=ceu[i]; g.fillRect(0,Math.floor(i*fx),W,Math.ceil(fx)+1);
    if (i>0) for (let x=0;x<W;x++) if ((x+i)%2===0) px(x,Math.floor(i*fx),ceu[i-1]); }
  g.fillStyle=ceu[ceu.length-1]; g.fillRect(0,Math.floor(H*0.62),W,H);
  // lua e estrelas
  for (let i=0;i<40;i++) px(Math.floor(rnd()*W), Math.floor(rnd()*H*0.35), rnd()>0.5?'#8a9a90':'#cfd6c4');
  g.fillStyle='#cfd6c4'; for (let y=-9;y<=9;y++) for (let x=-9;x<=9;x++) if (x*x+y*y<=81) px(258+x,28+y,(x+3)*(x+3)+(y-2)*(y-2)<30?'#b4bca9':'#d9dfcc');
  // nuvens
  const nuvem=(x,y,w,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,3); g.fillRect(x+4,y-2,w-10,2); g.fillRect(x+10,y-4,w-22,2); };
  nuvem(20,40,60,'#33443f'); nuvem(150,26,50,'#2c3b38'); nuvem(220,56,70,'#3e514a');
  // montanhas distantes
  const serra=(base,amp,freq,c,neve)=>{ for (let x=0;x<W;x++){ const h=base-Math.abs(Math.sin(x*freq+base)*amp)-Math.sin(x*freq*2.7)*amp*0.35; g.fillStyle=c; g.fillRect(x,Math.floor(h),1,H); if (neve && h<base-amp*0.75) px(x,Math.floor(h),neve); } };
  serra(108,34,0.031,'#2a3836','#6d7f74'); serra(122,22,0.047,'#223130');
  // castelo
  const pedra='#1a2524', luz='#e7b04a';
  const torre=(x,y,w,h)=>{ g.fillStyle=pedra; g.fillRect(x,y,w,H-y); for (let i=0;i<w;i+=3) g.fillRect(x+i,y-2,2,2); for (let j=y+5;j<y+h;j+=7) if (rnd()>0.35) { g.fillStyle=luz; g.fillRect(x+Math.floor(w/2)-1,j,1,2); } };
  torre(196,70,14,60); torre(214,84,22,50); torre(240,62,12,70); torre(256,88,26,40); torre(286,78,12,50);
  g.fillStyle=pedra; g.fillRect(196,98,102,40);
  for (let i=196;i<298;i+=4) g.fillRect(i,96,2,2);
  g.fillStyle='#8a2a2e'; g.fillRect(243,50,6,8); g.fillStyle=pedra; g.fillRect(242,48,1,14);
  g.fillStyle='#8a2a2e'; g.fillRect(201,60,4,6); g.fillStyle=pedra; g.fillRect(200,58,1,12);
  // colinas e pinheiros
  for (let x=0;x<W;x++){ const h=136+Math.sin(x*0.02)*6+Math.sin(x*0.071)*3; g.fillStyle='#18211f'; g.fillRect(x,Math.floor(h),1,H); }
  const pinheiro=(x,y,s,c)=>{ g.fillStyle=c; for (let i=0;i<s;i++) g.fillRect(x-Math.floor(i/2),y+i,i+1,1); g.fillRect(x,y+s,1,2); };
  for (let i=0;i<46;i++){ const x=Math.floor(rnd()*W); if (x>190&&x<300&&rnd()>0.3) continue; pinheiro(x,128+Math.floor(rnd()*14),10+Math.floor(rnd()*10),rnd()>0.5?'#132019':'#16251d'); }
  // névoa
  for (let y=118;y<150;y++) for (let x=0;x<W;x++) if (((x*7+y*13)%11===0) && rnd()>0.35) px(x,y,'rgba(150,170,155,0.18)');
  g.fillStyle='rgba(120,145,130,0.10)'; g.fillRect(0,128,W,10);
  // chão
  for (let x=0;x<W;x++){ const h=160+Math.sin(x*0.05)*4; g.fillStyle='#101716'; g.fillRect(x,Math.floor(h),1,H); }
  for (let i=0;i<30;i++){ const x=Math.floor(rnd()*W), y=162+Math.floor(rnd()*16); g.fillStyle='#1f2a28'; g.fillRect(x,y,4+Math.floor(rnd()*8),2); }
  return cv.toDataURL();
}

function telaPix(){
  const W=320, H=180, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const px=(x,y,c)=>{ g.fillStyle=c; g.fillRect(x,y,1,1); };
  const faixas=(cores,ate)=>{ const fx=H*ate/cores.length; for (let i=0;i<cores.length;i++){ g.fillStyle=cores[i]; g.fillRect(0,Math.floor(i*fx),W,Math.ceil(fx)+1); if (i>0) for (let x=0;x<W;x++) if ((x+i)%2===0) px(x,Math.floor(i*fx),cores[i-1]); } g.fillStyle=cores[cores.length-1]; g.fillRect(0,Math.floor(H*ate),W,H); };
  const serra=(base,amp,freq,c,topo,lim)=>{ for (let x=0;x<W;x++){ const h=base-Math.abs(Math.sin(x*freq+base)*amp)-Math.sin(x*freq*2.7)*amp*0.35; g.fillStyle=c; g.fillRect(x,Math.floor(h),1,H); if (topo && h<base-amp*(lim||0.7)) { g.fillStyle=topo; g.fillRect(x,Math.floor(h),1,Math.max(1,Math.floor((base-amp*(lim||0.7))-h))); } } };
  const sol=(cx,cy,r,c1,c2)=>{ for (let y=-r;y<=r;y++) for (let x=-r;x<=r;x++) if (x*x+y*y<=r*r) px(cx+x,cy+y, (x*x+y*y)<r*r*0.55? c1 : c2); };
  const chao=(base,amp,c)=>{ for (let x=0;x<W;x++){ const h=base+Math.sin(x*0.05)*amp+Math.sin(x*0.13)*amp*0.4; g.fillStyle=c; g.fillRect(x,Math.floor(h),1,H); } };
  const pinheiro=(x,y,s,c,neve)=>{ g.fillStyle=c; for (let i=0;i<s;i++) g.fillRect(x-Math.floor(i/2),y+i,i+1,1); g.fillRect(x,y+s,1,2); if (neve) for (let i=2;i<s;i+=3) { g.fillStyle=neve; g.fillRect(x-Math.floor(i/2),y+i,Math.ceil(i/2),1); g.fillStyle=c; } };
  return { W,H,g,rnd,px,faixas,serra,sol,chao,pinheiro,url:()=>cv.toDataURL() };

function diaLocal(ms){ const d = ms==null ? new Date() : new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function horaLocal(ms){ const d = ms==null ? new Date() : new Date(ms); const o=-d.getTimezoneOffset(), oh=Math.floor(Math.abs(o)/60), om=Math.abs(o)%60;
  return diaLocal(d.getTime())+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' (UTC'+(o<0?'-':'+')+oh+(om?':'+String(om).padStart(2,'0'):'')+')'; }
// save novo, zerado, com o dia de hoje do aparelho (o build não grava data nenhuma)
function novoSave(){
  const s = JSON.parse(JSON.stringify(SAVE)), h = diaLocal();
  s.hoje = h; (s.log||[]).forEach(e=>{ e.d = h; });
  return s;
}
// momento em que um id foi criado (uid() = prefixo + Date.now() em base 36 + 4 letras; tarefa = 't' + Date.now() em base 36)
function tsDeId(id, pref, semSufixo){
  if (typeof id!=='string' || !id.startsWith(pref)) return null;
  const m = id.slice(pref.length).match(semSufixo ? /^([0-9a-z]{8})$/ : /^([0-9a-z]{8})[0-9a-z]{4}$/); if (!m) return null;
  const t = parseInt(m[1],36); return (t>1.75e12 && t<Date.now()+864e5) ? t : null;
}
// conserta datas no futuro gravadas pela versão que usava a data do servidor (UTC): cada registro volta pro dia local em que foi criado
function consertaDatas(s){
  const hoje = diaLocal(); let n=0;
  const fix = (e, t)=>{ if (!e || !e.d) return; const certo = t ? diaLocal(t) : hoje; if (e.d > certo && (t || e.d > hoje)){ e.d = certo; n++; } };
  (s.log||[]).forEach(e=>fix(e, tsDeId(e.id,'l')));
  (s.tarefas||[]).forEach(t=>fix(t, tsDeId(t.id,'t',true)));
  (s.compras||[]).forEach(c=>{ if (c.d) { const t=tsDeId(c.uid,'c'); if (c.d > (t?diaLocal(t):hoje)){ c.d = t?diaLocal(t):hoje; n++; } } });
  (s.bausAbertos||[]).forEach(b=>fix(b, tsDeId(b.id,'b')));
  if (s.pets){ (s.pets.possui||[]).forEach(p=>fix(p, null)); if (s.pets.desde && s.pets.desde > hoje){ s.pets.desde = hoje; n++; } }
  return n;
}

/* ---------- mesclagem: nada de um lado apaga o progresso do outro ---------- */
const DL_UNIAO_ID = ['log','compras','bausAbertos','bausGanhos','habilidades','derrotados','tarefas'];
const DL_UNIAO_VAL = ['mochila','revelados','aplicados','removidos'];
const DL_ULTIMO = ['herois','pets','config','areas','diarias','extras','chefoes','novidades','agenteErros'];
function vazio(k, v){
  if (v==null) return true;
  if (k==='herois') return !v.ativo && !(v.possui||[]).length;
  if (k==='pets') return !(v.possui||[]).length;
  if (Array.isArray(v)) return v.length===0;
  if (typeof v==='object') return Object.keys(v).length===0;
  return false;
}
function uneId(a, b, k){
  const m=new Map(), ch=chaveDe(k);
  (a||[]).forEach(x=>{ if (x && x[ch]!=null) m.set(x[ch], x); });
  (b||[]).forEach(x=>{ if (!x || x[ch]==null) return; const y=m.get(x[ch]); if (!y) m.set(x[ch], x); else if (k==='tarefas' && (x.em||0)>(y.em||0)) m.set(x[ch], x); });
  return [...m.values()];
}
// local = este aparelho, remoto = planilha. primeiraVez: aparelho que nunca sincronizou cede pro que está na conta.
function mesclar(local, remoto, primeiraVez){
  if (!remoto) return local;
  const L=JSON.parse(JSON.stringify(local)), R=JSON.parse(JSON.stringify(remoto));
  // "Recomeçar do zero": cada recomeço é uma geração nova (zerado = quando). Gerações diferentes não se misturam:
  // vale a mais nova inteira, pra o progresso antigo de outro aparelho ou do Drive não voltar.
  // Exceção: aparelho que nunca sincronizou com conta nenhuma junta o que tem com a conta, como antes.
  const zl=L.zerado||0, zr=R.zerado||0;
  if (zl!==zr){
    if (primeiraVez && !zl && !L.nuvem) L.zerado = zr;
    else return zl>zr ? L : R;
  }
  [L,R].forEach(s=>{ s.mod=s.mod||{}; DL_UNIAO_ID.forEach(k=>garanteIds(s[k], k[0]+':', chaveDe(k))); });
  const out = Object.assign({}, L);
  out.mod = Object.assign({}, L.mod);
  DL_UNIAO_ID.forEach(k=>{ out[k] = uneId(L[k], R[k], k); });
  DL_UNIAO_VAL.forEach(k=>{ out[k] = [...new Set([...(L[k]||[]), ...(R[k]||[])])]; });
  DL_ULTIMO.forEach(k=>{
    const ml = primeiraVez ? 0 : (L.mod[k]||0), mr = R.mod[k]||0;
    let usaR;
    // aparelho novo cede pro que está na conta; depois disso vale o mais recente (lista esvaziada de propósito também vale)
    if (primeiraVez) usaR = !vazio(k, R[k]) || (vazio(k, L[k]) && mr>ml);
    else if (mr===ml) usaR = !vazio(k, R[k]);
    else usaR = mr>ml;
    const venc = usaR ? R : L, perd = usaR ? L : R;
    out[k] = venc[k]; out.mod[k] = Math.max(ml, mr);
    if (k==='herois' && out[k] && perd[k]){ const h=out[k]; h.possui=[...new Set([...(h.possui||[]), ...(perd[k].possui||[])])]; h.equip=Object.assign({}, perd[k].equip, h.equip); h.nomes=Object.assign({}, perd[k].nomes, h.nomes); h.pele=Object.assign({}, perd[k].pele, h.pele); if (!h.ativo) h.ativo=perd[k].ativo||null; }
    if (k==='pets' && out[k] && perd[k]){ const p=out[k]; p.possui=uneId(p.possui, perd[k].possui); if (!p.desde || (perd[k].desde && perd[k].desde<p.desde)) p.desde = perd[k].desde || p.desde; if (!p.ativo) p.ativo=perd[k].ativo||null; }
  });
  out.hoje = [L.hoje, R.hoje].filter(Boolean).sort().pop() || L.hoje;
  out.rev = Math.max(L.rev||0, R.rev||0);
  const rem = new Set(out.removidos||[]);
  if (rem.size) out.log = out.log.filter(e=>!rem.has(e.id));
  out.log.sort((a,b)=> (a.d||'').localeCompare(b.d||''));
  return out;
}

/* ---------- linhas do agente (aba "agente") ---------- */
function linhasAgente(valores){
  if (!valores || !valores.length) return [];
  let cab = valores[0].map(c=>String(c||'').trim().toLowerCase());
  let col = { id:cab.indexOf('id'), quando:cab.indexOf('quando'), tipo:cab.indexOf('tipo'), dados:cab.indexOf('dados'), nota:cab.indexOf('nota') };
  let ini = 1;
  if (col.tipo<0){ col={ id:0, quando:1, tipo:2, dados:3, nota:4 }; ini=0; }
  const out=[];
  for (let i=ini;i<valores.length;i++){
    const r=valores[i]||[], g=j=> j>=0 && r[j]!=null ? String(r[j]).trim() : '';
    const tipo=g(col.tipo).toLowerCase(); if (!tipo) continue;
    const dados=g(col.dados);
    out.push({ id: g(col.id) || ('h'+hashTxt(tipo+'|'+dados+'|'+g(col.quando))), quando:g(col.quando), tipo, dados, linha:i+1 });
  }
  return out;
}
function aplicaAgente(linhas){
  S.aplicados = S.aplicados || []; S.agenteErros = S.agenteErros || [];
  const feitos = new Set(S.aplicados); let mudou=false, novidades=[];
  for (const l of linhas){
    if (feitos.has(l.id)) continue;
    let d=null;
    try { d = l.dados ? JSON.parse(l.dados) : {}; } catch(e){ d = l.dados; }
    try {
      const r = aplicaUma(l, d);
      if (r && r.novidade) novidades.push(r.novidade);
    } catch(e){
      S.agenteErros = S.agenteErros.filter(x=>x.id!==l.id).concat([{ id:l.id, linha:l.linha, erro:String(e && e.message || e) }]).slice(-20);
      S.mod.agenteErros = Date.now();
    }
    S.aplicados.push(l.id); feitos.add(l.id); mudou=true;
  }
  if (novidades.length){ S.novidades = (S.novidades||[]).concat(novidades); S.mod.novidades=Date.now(); }
  return mudou;
}
function obj(d, campos){ if (!d || typeof d!=='object' || Array.isArray(d)) throw new Error('dados precisa ser um JSON {…}'); (campos||[]).forEach(c=>{ if (d[c]==null || d[c]==='') throw new Error('faltou "'+c+'"'); }); return d; }
function areaOk(a){ if (!AREA[a]) throw new Error('área "'+a+'" não existe ('+(areasJogo().length ? 'use: '+areasJogo().map(x=>x.id).join(', ') : 'ainda não há áreas: crie com tipo area')+')'); return a; }
function upsert(lista, item){ const i=lista.findIndex(x=>x.id===item.id); if (i>=0) lista[i]=Object.assign({}, lista[i], item); else lista.push(item); }
function aplicaUma(l, d){
  const agora=Date.now(), hoje=hojeReal(), heroi=S.herois.ativo||null;
  switch (l.tipo){
    case 'registro': { obj(d,['area','txt']); areaOk(d.area); const xp=Number(d.xp||0); if (!isFinite(xp)) throw new Error('xp inválido');
      const e=Object.assign({ d:d.d||hoje, tipo:'extra' }, d, { area:d.area, xp, id:'ag:'+l.id }); if (!e.heroi && heroi) e.heroi=heroi;
      if (d.ouro!=null){ const o=Number(d.ouro); if (!isFinite(o)) throw new Error('ouro inválido (use número, ex.: "ouro":500)'); e.ouro=o; }
      S.log.push(e); if (e.tipo==='diaria' && e.estrelas>0 && festaRecente(e.d)){ const m=S.diarias.find(x=>x.id===e.diaria); Festa.add('missao', (m&&m.nome)||e.txt, { estrelas:e.estrelas }); } return; }
    case 'tarefa': { obj(d,['txt']); const id=d.id||('ag'+hashTxt(l.id)); if (!S.tarefas.some(t=>t.id===id)) S.tarefas.push({ id, d:d.d||hoje, txt:String(d.txt), area:d.area&&AREA[d.area]?d.area:undefined, feita:null, em:agora }); return; }
    case 'tarefa_feita': { obj(d,['id']); const t=S.tarefas.find(x=>x.id===d.id); if (!t) throw new Error('tarefa "'+d.id+'" não existe'); t.feita = d.feita===false ? false : true; t.em=agora;
      S.log=S.log.filter(e=>!(e.tipo==='tarefa'&&e.tarefa===t.id)); if (t.feita){ S.log.push({ id:'ag:'+l.id, d:t.d, area:t.area||null, txt:t.txt, xp:XP_TAREFA, tipo:'tarefa', tarefa:t.id, heroi }); if (festaRecente(t.d)) Festa.add('tarefa', t.txt); } return; }
    case 'area': { obj(d,['id','nome']); const id=String(d.id).trim(); if (!/^[a-z0-9_-]{1,24}$/.test(id)) throw new Error('id da área: só letras minúsculas, números, - ou _ (ex.: "saude")');
      const ico = ICOS_AREA.includes(d.ico) ? d.ico : 'star'; const novo=!AREA[id]; upsert(S.areas, { id, nome:String(d.nome).slice(0,24), ico }); S.mod.areas=agora; return novo ? { novidade:'Atributo novo: '+d.nome } : null; }
    case 'area_remover': { obj(d,['id']); S.areas=S.areas.filter(x=>x.id!==d.id); S.mod.areas=agora; return; }
    case 'diaria': { obj(d,['id','area','nome']); areaOk(d.area); upsert(S.diarias, d); S.mod.diarias=agora; return; }
    case 'diaria_remover': { obj(d,['id']); S.diarias=S.diarias.filter(x=>x.id!==d.id); S.mod.diarias=agora; return; }
    case 'extra': { obj(d,['id','area','nome']); areaOk(d.area); upsert(S.extras, d); S.mod.extras=agora; return; }
    case 'chefao': { obj(d,['id','nome','meta','area']); areaOk(d.area); const novo=!S.chefoes.some(c=>c.id===d.id); upsert(S.chefoes, d); S.mod.chefoes=agora; return novo ? { novidade:'Chefão novo: '+d.nome } : null; }
    case 'chefao_remover': { obj(d,['id']); S.chefoes=S.chefoes.filter(x=>x.id!==d.id); S.mod.chefoes=agora; return; }
    case 'chefao_derrotado': { obj(d,['id']); if (!S.derrotados.some(x=>x.id===d.id)){ const c=S.chefoes.find(x=>x.id===d.id); S.derrotados.push({ id:d.id, d:d.d||hoje });
      S.log.push({ id:'ag:'+l.id, d:d.d||hoje, area:(c&&c.area)||null, txt:'Chefão derrotado: '+((c&&c.nome)||d.id), xp:d.xp!=null?Number(d.xp):300, tipo:'chefao', heroi }); if (festaRecente(d.d)) Festa.add('chefao', (c&&c.nome)||d.id, { id:d.id, xp:d.xp!=null?Number(d.xp):300 }); return { novidade:'Chefão derrotado: '+((c&&c.nome)||d.id) }; } return; }
    case 'habilidade': { const h = obj(d,['nome','area']); areaOk(h.area); S.habilidades.push({ id:'ag:'+l.id, area:h.area, nome:String(h.nome), d:h.d||hoje }); return { novidade:'Habilidade nova: '+h.nome }; }
    case 'bau': { S.bausGanhos.push({ id:'ag:'+l.id, d:(d&&d.d)||hoje }); return { novidade:'Novo baú pra abrir' }; }
    case 'novidade': { const t = typeof d==='string' ? d : obj(d,['txt']).txt; return { novidade:String(t) }; }
    case 'save_importar': { obj(d,['log']); importaSave(d, true); return; }
    default: throw new Error('tipo "'+l.tipo+'" desconhecido');
  }
}

/* ---------- importar save antigo (.json, código DL1/DL2 ou linha do agente) ---------- */
function decodificaCodigo(txt){
  const t=String(txt||'').trim(); const m=t.match(/^DL([12]):([A-Za-z0-9+/=\s]+)$/); if (!m) throw new Error('código inválido');
  return JSON.parse(decodeURIComponent(escape(atob(m[2].replace(/\s+/g,'')))));
}
function importaSave(d, silencioso){
  if (d.jogo==='zaza-quest'||d.jogo==='saga-diaria') d.jogo='daily-legends';
  if (!d.log && !d.herois) throw new Error('não é um save do Daily Legends');
  const base = { jogo:'daily-legends', log:[], compras:[], mochila:[], bausAbertos:[], habilidades:[], derrotados:[], tarefas:[] };
  const imp = Object.assign(base, JSON.parse(JSON.stringify(d)), { jogo:'daily-legends' });
  imp.zerado = S.zerado || 0; delete imp.ignorarAgente; // save importado entra na geração atual (não desfaz um recomeço)
  if (imp.bausGanhos==null){ imp.bausGanhos=[]; const n=(imp.baus||0)+(imp.bausAbertos||[]).length; for (let i=0;i<n;i++) imp.bausGanhos.push({ id:'leg'+i, d:imp.hoje||hojeReal() }); }
  const agora=Date.now(); imp.mod={};
  DL_ULTIMO.forEach(k=>{ if (!vazio(k, imp[k])) imp.mod[k]=agora+1; });
  rastreia();
  S = mesclar(S, imp, false);
  normaliza(); rastreia(true); Nuvem.mudou();
  if (!silencioso){ aplicaConfig(); entrar(); toast('Save importado e juntado ao seu progresso'); }
}

/* ---------- rastreio de mudanças (data por campo, pra mesclar entre aparelhos) ---------- */
let DL_SNAP = {};
function rastreia(soFoto){
  S.mod = S.mod || {};
  DL_ULTIMO.forEach(k=>{ const v=JSON.stringify(S[k]===undefined?null:S[k]); if (!soFoto && DL_SNAP[k]!==undefined && DL_SNAP[k]!==v) S.mod[k]=Date.now(); DL_SNAP[k]=v; });
}

/* ---------- Nuvem ---------- */

  mudou(){
    rastreia(); S.rev=(S.rev||0)+1; this.salvarLocal(); lsSet('dl.pendente', true);
    if (this.conta()){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.sincronizar(), 4000); }
    this.pinta();
  },

  /* ----- login por redirecionamento ----- */
  redirectUri(){ const u=new URL('./', location.href); return u.origin + u.pathname; },
  irParaGoogle(silencioso, trocarConta){
    if (!this.configurado()){ modal(`<p>O login com Google ainda não foi configurado neste site.</p><p class="fraco">Quem publicou o jogo precisa colar o Client ID no arquivo config.js (guia, parte 2). Enquanto isso o jogo salva só neste aparelho.</p><div class="acoes"><button class="btn ouro" data-fecha="1">Entendi</button></div>`,'Falta configurar'); return; }
    if (!navigator.onLine){ toast('Sem internet agora. O jogo continua salvando no aparelho.'); return; }
    const st = uid('s'); const conta=this.conta();
    lsSet(DL_LS.oauth, { st, silencioso:!!silencioso, em:Date.now() });
    lsSet(DL_LS.tent, { em:Date.now(), silencioso:!!silencioso });
    if (typeof S!=='undefined') this.salvarLocal();
    const p = new URLSearchParams({ client_id:DL_CFG.googleClientId, redirect_uri:this.redirectUri(), response_type:'token', scope:DL_ESCOPOS, include_granted_scopes:'true', state:st });
    if (silencioso) p.set('prompt','none');
    else if (trocarConta || !conta) p.set('prompt','select_account');
    if (conta && conta.email && !trocarConta) p.set('login_hint', conta.email);
    // navegação na mesma janela (nada de popup): no iPhone instalado, abre a tela do Google e volta pro app
    location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + p.toString());
  },
  // roda antes de tudo: lê a resposta do Google no #fragmento
  lerRetorno(){
    const h = location.hash || '';
    if (!/(^#|&)(state|access_token|error)=/.test(h)) return null;
    const q = new URLSearchParams(h.slice(1));
    history.replaceState(null, '', location.pathname + location.search);
    const esp = lsGet(DL_LS.oauth); lsSet(DL_LS.oauth, null);
    if (!esp || esp.st !== q.get('state')) return { erro:'state' };
    if (q.get('error')) return { erro:q.get('error'), silencioso:esp.silencioso };
    const escopo = q.get('scope') || '';
    if (escopo && !escopo.includes('drive.file')) return { erro:'escopo' };
    lsSet(DL_LS.token, { access_token:q.get('access_token'), exp:Date.now() + (Number(q.get('expires_in'))||3600)*1000 - 120000 });
    lsSet(DL_LS.tent, null);
    return { ok:true, silencioso:esp.silencioso };
  },
  // renovação silenciosa: só tenta de novo depois de 3 min, e não insiste se o Google pediu interação
  podeRenovarSozinho(){

    const c=this.conta(); if (!c || this.token()) return false;
    const t=lsGet(DL_LS.tent); if (t && Date.now()-t.em < 3*60*1000) return false;

  /* ----- API ----- */
  async api(url, op){
    const tk=this.token(); if (!tk){ const e=new Error('token'); e.token=true; throw e; }
    op=op||{}; op.headers=Object.assign({ Authorization:'Bearer '+tk }, op.body&&typeof op.body==='string'?{ 'Content-Type':'application/json' }:{}, op.headers||{});
    const ab = new AbortController(), tm = setTimeout(()=>ab.abort(), 25000); op.signal = ab.signal;
    let r; try { r = await fetch(url, op); } catch(e){ throw new Error(e.name==='AbortError' ? 'o Google demorou demais pra responder' : 'sem conexão com o Google'); } finally { clearTimeout(tm); }
    if (r.status===401){ lsSet(DL_LS.token,null); const e=new Error('token'); e.token=true; throw e; }
    if (!r.ok){ let t=''; try{ t=await r.text(); }catch(_){} throw new Error('Google '+r.status+': '+t.slice(0,200)); }

    lsSet(DL_LS.plan, { id, email:conta&&conta.email, criada });
    return id;
  },
  async montaAbas(id){
    const SH='https://sheets.googleapis.com/v4/spreadsheets/'+id;
    const info = await this.api(SH+'?fields=sheets.properties');
    const primeira = info.sheets[0].properties.sheetId;
    const r = await this.api(SH+':batchUpdate', { method:'POST', body:JSON.stringify({ requests:[
      { updateSheetProperties:{ properties:{ sheetId:primeira, title:ABA.leia }, fields:'title' } },
      { addSheet:{ properties:{ title:ABA.resumo } } },
      { addSheet:{ properties:{ title:ABA.agente, gridProperties:{ frozenRowCount:1 } } } },
      { addSheet:{ properties:{ title:ABA.save } } }
    ] }) });
    const ids = r.replies.slice(1).map(x=>x.addSheet.properties.sheetId);
    await this.api(SH+':batchUpdate', { method:'POST', body:JSON.stringify({ requests:[
      { addProtectedRange:{ protectedRange:{ range:{ sheetId:ids[2] }, description:'Save do jogo: não edite (o jogo reescreve)', warningOnly:true } } },
      { addProtectedRange:{ protectedRange:{ range:{ sheetId:ids[0] }, description:'Resumo: o jogo reescreve a cada sincronização', warningOnly:true } } }
    ] }) });
    await this.api(SH+'/values:batchUpdate', { method:'POST', body:JSON.stringify({ valueInputOption:'RAW', data:[
      { range:`'${ABA.leia}'!A1`, values:LEIA_ME.map(l=>[l]) },
      { range:`'${ABA.agente}'!A1:E1`, values:[['id','quando','tipo','dados','nota']] }
    ] }) });
  },

  /* ----- sincronizar: puxa, junta, aplica o agente, escreve ----- */
  async sincronizar(motivo){
    if (!this.conta()) return;
    if (this.ocupado){ this.denovo=true; return; }
    if (!navigator.onLine){ this.estado='offline'; this.pinta(); return; }
    if (!this.token()){ this.estado='reconectar'; this.pinta(); return; }
    this.ocupado=true; this.estado='sync'; this.pinta();
    try {
      if (!this.conta().email) await this.pegaEmail();
      const id = await this.achaOuCriaPlanilha();
      const SH='https://sheets.googleapis.com/v4/spreadsheets/'+id;
      const lido = await this.api(SH+`/values:batchGet?ranges=${encodeURIComponent(`'${ABA.save}'!A1:A2000`)}&ranges=${encodeURIComponent(`'${ABA.agente}'!A1:F5000`)}&majorDimension=ROWS`);
      const vs = (lido.valueRanges[0].values||[]), va = (lido.valueRanges[1].values||[]);
      this.partesAntes = vs.length;
      let remoto=null;
      if (vs.length>2){ try { remoto = JSON.parse(vs.slice(2).map(r=>r[0]||'').join('')); } catch(e){ throw new Error('o save da planilha está corrompido (aba save foi editada?)'); } }
      const antes = JSON.stringify(S);
      rastreia();
      const primeiraVez = !lsGet(DL_LS.sinc);
      if (remoto) S = mesclar(S, remoto, primeiraVez);
      normaliza(); rastreia(true);
      const linhasAg = linhasAgente(va);
      // depois de "Recomeçar do zero": tudo o que já estava na aba agente fica como aplicado e não volta (ex.: ouro de teste)
      if (S.ignorarAgente){ S.aplicados = [...new Set([...(S.aplicados||[]), ...linhasAg.map(l=>l.id)])]; S.agenteErros=[]; delete S.ignorarAgente; S.mod.agenteErros=Date.now(); }
      const novasAg = aplicaAgente(linhasAg);
      S.nuvem = true;
      normaliza(); rastreia(true);
      const mudouAqui = JSON.stringify(S)!==antes;
      // escreve save (uma chamada só, com sobra em branco pra apagar pedaços antigos) e resumo
      const txt = JSON.stringify(Object.assign({}, S, { salvoEm:new Date().toISOString() }));
      const partes=[]; for (let i=0;i<txt.length;i+=PEDACO) partes.push([txt.slice(i,i+PEDACO)]);
      const linhas = [['NÃO EDITE ESTA ABA. Save do Daily Legends (o jogo reescreve). O agente escreve só na aba "agente".'], [JSON.stringify({ v:2, rev:S.rev||0, em:new Date().toISOString(), partes:partes.length })], ...partes];
      while (linhas.length < this.partesAntes) linhas.push(['']);
      const res = linhasResumo(); while (res.length<400) res.push(['','','','','','']);
      const dados = [
        { range:`'${ABA.save}'!A1:A${linhas.length}`, values:linhas },
        { range:`'${ABA.resumo}'!A1:F400`, values:res.slice(0,400).map(r=>{ const x=r.slice(0,6).map(v=>v==null?'':String(v)); while (x.length<6) x.push(''); return x; }) }
      ];
      // leia-me desatualizado (planilha criada por versão antiga): reescreve com as instruções novas
      const leiaChave = id+':'+LEIA_VER;
      if (lsGet('dl.leiaVer')!==leiaChave){ const lm=LEIA_ME.map(l=>[l]); while (lm.length<90) lm.push(['']); dados.push({ range:`'${ABA.leia}'!A1:A${lm.length}`, values:lm }); }
      await this.api(SH+'/values:batchUpdate', { method:'POST', body:JSON.stringify({ valueInputOption:'RAW', data:dados }) });
      lsSet('dl.leiaVer', leiaChave);
      this.salvarLocal(); lsSet(DL_LS.sinc, Date.now()); lsSet('dl.pendente', false); lsSet('dl.precisaEntrar', null);
      this.ultimoPull=Date.now(); this.estado='ok'; this.erro='';
      if (!S.herois.ativo && !$('#jogo').hidden && typeof cria!=='undefined' && !cria){ aplicaConfig(); topo(); toast('O jogo foi recomeçado do zero.'); entrar(); }
      else if ((mudouAqui || novasAg) && !$('#jogo').hidden && typeof cria!=='undefined' && !cria){ aplicaConfig(); atualizaPalco(); topo(); render(); if (S.novidades && S.novidades.length && $('#modal').hidden) entrar(); }
      else if (!$('#titulo').hidden){ $('#btnComecar').textContent = S.herois.ativo ? 'Continuar' : 'Começar'; $('#tData').textContent='Atualizado em '+fmtD(S.hoje); }
    } catch(e){
      if (e.token){ this.estado='reconectar'; }
      else { this.estado='erro'; this.erro=String(e.message||e); console.warn(e); }
    } finally {
      this.ocupado=false; this.pinta();
      if (this.denovo){ this.denovo=false; setTimeout(()=>this.sincronizar(), 1500); }
    }
  },

  /* ----- botão de status ----- */
  pinta(){
    const b=document.getElementById('btnNuvem'); if (!b) return;
    if (!this.conta()) this.estado='local';
    else if (this.estado==='local') this.estado = this.token() ? 'ok' : 'reconectar';
    const pend = lsGet('dl.pendente');
    const T = { local:['Entrar','Salvo só neste aparelho. Toque pra entrar com Google.'], sync:['Salvando…','Sincronizando com o Google Drive'], ok:[pend?'Na nuvem •':'Na nuvem','Salvo no Google Drive'],
      offline:['Sem rede','Sem internet: salvo no aparelho, sobe quando voltar'], reconectar:['Reconectar','Toque pra reconectar com o Google. Nada se perde: está salvo no aparelho.'], erro:['Erro ☁','Não deu pra sincronizar: '+this.erro] }[this.estado];
    b.textContent=T[0]; b.title=T[1]; b.className='btn ouro nuvem n-'+this.estado+(pend&&this.estado!=='sync'?' pendente':'');
    const c=this.conta(), txt = c ? ('Conta: '+(c.email||'Google')) : (this.configurado() ? 'Entre com Google pra guardar seu jogo no seu Drive.' : 'Login com Google ainda não configurado: salvando só neste aparelho.');
    document.querySelectorAll('.tConta').forEach(t=>t.textContent=txt);
    const be=document.getElementById('btnEntrarT'); if (be) be.hidden = !!this.conta();
  },
  tocar(){
    if (this.estado==='local') return this.irParaGoogle(false);
    if (this.estado==='reconectar') return this.irParaGoogle(false);
    if (this.estado==='erro') { modal(`<p>Não deu pra sincronizar com o Google Drive.</p><p class="fraco">${esc(this.erro)}</p><p class="fraco">Seu progresso está salvo neste aparelho.</p><div class="acoes"><button class="btn" data-fecha="1">Fechar</button><button class="btn ouro" data-acao="sincronizar">Tentar de novo</button></div>`,'Nuvem'); return; }
    this.sincronizar('botao');
  },

  /* ----- início ----- */
  iniciar(retorno){
    if (retorno){
      if (retorno.ok){ lsSet('dl.precisaEntrar', null); if (!this.conta()) lsSet(DL_LS.conta, { email:'' }); }
      else if (retorno.erro==='escopo'){ setTimeout(()=>modal(`<p>Pra guardar o jogo no seu Drive, marque a caixinha de permissão do <b>Google Drive</b> na tela do Google.</p><p class="fraco">O jogo só enxerga os arquivos que ele mesmo cria (a pasta Daily Legends).</p><div class="acoes"><button class="btn" data-fecha="1">Agora não</button><button class="btn ouro" data-acao="entrarGoogle">Tentar de novo</button></div>`,'Falta uma permissão'), 300); }
      else if (retorno.silencioso && /interaction_required|login_required|consent_required|account_selection_required/.test(retorno.erro)) lsSet('dl.precisaEntrar', true);
      else if (retorno.erro==='access_denied') setTimeout(()=>toast('Login cancelado. O jogo continua salvando no aparelho.'), 300);
      else if (retorno.erro && retorno.erro!=='state') setTimeout(()=>toast('Login do Google: '+retorno.erro,'ruim'), 300);
    }
    this.pinta();
    if (this.conta()){ if (this.token()) this.sincronizar('abrir'); else { this.estado='reconectar'; this.pinta(); } }
    window.addEventListener('online', ()=>{ if (this.conta()) this.sincronizar('online'); else this.pinta(); });
    window.addEventListener('offline', ()=>{ if (this.conta()){ this.estado='offline'; this.pinta(); } });
    const guarda=()=>{ if (typeof S!=='undefined'){ rastreia(); this.salvarLocal(); } };
    window.addEventListener('pagehide', guarda);
    document.addEventListener('visibilitychange', ()=>{
      if (document.hidden){ guarda(); if (this.conta() && this.token() && lsGet('dl.pendente')) this.sincronizar('saindo'); return; }
      if (!this.conta()) return;
      if (this.token()){ if (Date.now()-this.ultimoPull > 5*60*1000 || lsGet('dl.pendente')) this.sincronizar('voltou'); }
      else if (this.podeRenovarSozinho() && $('#modal').hidden && !(typeof cria!=='undefined' && cria)) this.irParaGoogle(true);
    });
    // guarda mudanças que não passaram por marcaSujo (ex.: volume)
    setInterval(()=>{ if (typeof S==='undefined') return; const a=JSON.stringify(S.config); if (a!==DL_SNAP.config){ this.mudou(); } }, 15000);
  }
};

/* ---------- aba resumo (pro agente ler sem abrir o JSON) ---------- */
function linhasResumo(){
  const c=calc(), g=nivelDe(c.xpTotal), h=heroAtivo(), R=[];
  R.push(['Daily Legends: resumo pro agente. O jogo reescreve esta aba a cada sincronização; não edite. Pra mudar algo, escreva na aba "agente" (veja leia-me).']);
  R.push(['atualizado em', horaLocal(), 'dia do jogo', S.hoje, 'recomeçou do zero em', S.zerado ? horaLocal(S.zerado) : 'nunca']);
  R.push(['herói', h ? nomeH(h.id) : '(ainda não criado)', 'classe', h ? h.nome : '', 'nível do herói', h ? nivelDe(c.heroi[h.id]||0).n : '']);
  R.push(['nível geral', g.n, 'XP total', c.xpTotal, 'ouro', c.ouro]);
  R.push(['sequência (dias)', c.seq, 'baús fechados', S.baus, 'pets', (S.pets.possui||[]).map(p=>p.nome+' ('+p.tipo+(p.real?', real':'')+')').join(', ')]);
  R.push([]); R.push(['ÁREAS', 'id', 'nível', 'XP', 'último dia com XP']); if (!areasJogo().length) R.push(['(nenhuma ainda: crie com tipo area)']);
  areasJogo().forEach(a=>R.push([a.nome, a.id, nivelDe(c.area[a.id]||0).n, c.area[a.id]||0, c.ultima[a.id]||'']));
  R.push([]); R.push(['DIÁRIAS', 'id', 'área', 'nome', 'mínima', '3 estrelas']);
  S.diarias.forEach(m=>R.push(['', m.id, m.area, m.nome+(m.semanal?` (${m.semanal}x/semana)`:''), m.minima||'', m.tres||'']));
  R.push([]); R.push(['EXTRAS', 'id', 'área', 'nome', 'xp']);
  S.extras.forEach(m=>R.push(['', m.id, m.area, m.nome, m.xp||'']));
  R.push([]); R.push(['CHEFÕES', 'id', 'área', 'nome', 'meta', 'progresso']);
  S.chefoes.forEach(b=>{ const morto=S.derrotados.some(x=>x.id===b.id); const pr = b.tipo==='valor' ? `${b.atual}/${b.alvo}` : b.tipo==='fases' ? (b.fases||[]).filter(f=>f.ok).length+'/'+(b.fases||[]).length+' fases' : b.tipo==='data' ? 'até '+b.data : ''; R.push(['', b.id, b.area, b.nome, b.meta, (morto?'DERROTADO ':'')+pr]); });
  R.push([]); R.push(['TAREFAS', 'id', 'dia', 'texto', 'status']);
  S.tarefas.filter(t=>t.d>=addDias(S.hoje,-7)).forEach(t=>R.push(['', t.id, t.d, t.txt, t.feita===true?'feita':t.feita===false?'não feita':'aberta']));
  R.push([]); R.push(['HABILIDADES', 'área', 'nome', 'desde']);
  S.habilidades.forEach(x=>R.push(['', x.area, x.nome, x.d||'']));
  R.push([]); R.push(['LINHAS DO AGENTE', 'aplicadas', (S.aplicados||[]).length, 'última', (S.aplicados||[]).slice(-1)[0]||'']);
  (S.agenteErros||[]).forEach(e=>R.push(['ERRO', e.id, 'linha '+(e.linha||''), e.erro]));
  R.push([]); R.push(['ÚLTIMOS REGISTROS', 'dia', 'área', 'texto', 'xp', 'estrelas']);
  S.log.slice(-60).reverse().forEach(e=>R.push(['', e.d, e.area, e.txt, e.xp||0, e.estrelas!=null?e.estrelas:'']));
  return R;
}

    if (!('serviceWorker' in navigator) || !(location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) return;
    navigator.serviceWorker.register('sw.js').then(reg=>{
      this.reg=reg;
      if (reg.waiting && navigator.serviceWorker.controller) this.mostra();
      reg.addEventListener('updatefound', ()=>{ const w=reg.installing; w && w.addEventListener('statechange', ()=>{ if (w.state==='installed' && navigator.serviceWorker.controller) this.mostra(); }); });
      document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) reg.update().catch(()=>{}); });
      setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if (this.recarregando) return; this.recarregando=true; location.reload(); });
  },
  mostra(){ const a=document.getElementById('avisoVersao'); if (a) a.hidden=false; },
  atualizar(){
    if (typeof S!=='undefined'){ rastreia(); Nuvem.salvarLocal(); }
    const w=this.reg && this.reg.waiting;
    if (w) w.postMessage({ tipo:'atualizar' }); else location.reload();
  }
};

const dt = s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const iso = d=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

// pet e tarefa sem área: o XP soma no nível geral, sem área nenhuma
const areaPet = ()=> AREA.casa ? 'casa' : null;
function calc(){
  const area={}, ultima={}; areasJogo().forEach(a=>{ area[a.id]=0; });
  let ganho=0; const heroi={}; const diasDiaria=new Set(); const porDia={};
  for (const e of S.log){
    area[e.area] = (area[e.area]||0) + (e.xp||0);
    ganho += (e.ouro!=null ? e.ouro : (e.xp||0));
    if (e.heroi) heroi[e.heroi] = (heroi[e.heroi]||0) + (e.xp||0);
    if ((e.xp||0)>0 && (!ultima[e.area] || e.d>ultima[e.area])) ultima[e.area]=e.d;
    if (e.tipo==='diaria' && e.estrelas>0) diasDiaria.add(e.d);
    (porDia[e.d] = porDia[e.d] || []).push(e);
  }
  if (S.pets && S.pets.desde && S.pets.possui.length){
    for (let d=S.pets.desde, n=0; d<=S.hoje && n<2000; d=addDias(d,1), n++){
      area[areaPet()] = (area[areaPet()]||0) + XP_PET_DIA; ganho += XP_PET_DIA;
      (porDia[d] = porDia[d] || []).push({ d, area:areaPet(), txt:'Companheiro ao seu lado', xp:XP_PET_DIA, tipo:'petDia' });
    }
  }
  const gasto = S.compras.reduce((s,c)=>s+c.preco,0);
  const xpTotal = Object.values(area).reduce((s,v)=>s+Math.max(0,v),0);
  // sequência = trilha do dia (ver trilhaDia)
  const tr = trilhaDia(porDia);
  return { area, ultima, ouro: ganho-gasto, xpTotal, heroi, seq: tr.pos, melhor: tr.melhor, trilha: tr, porDia, diasDiaria };
}

/* ---------- trilha (sequência com checkpoints) ----------
   Passo do dia: pelo menos 60% das diárias fixas (semanais ficam fora) feitas, versão mínima vale.
   Dia sem passo: volta pro último marco alcançado (não pro zero). Hoje ainda aberto nunca quebra.
   Marco alcançado pela 1ª vez = 1 baú (id trilha:N, não repete se a trilha voltar e passar de novo). */
const TRILHA_PCT = 0.6;
const MARCOS_BASE = [3,7,14,30,60,100,150,200,250,300,365];
function marcoN(i){ return i<MARCOS_BASE.length ? MARCOS_BASE[i] : 365 + 100*(i-MARCOS_BASE.length+1); }
function marcoAte(pos){ let m=0; for (let i=0; marcoN(i)<=pos; i++) m=marcoN(i); return m; }
function marcoDepois(pos){ let i=0; while (marcoN(i)<=pos) i++; return marcoN(i); }
function percorre(unidades, ehPasso, aberta){
  // unidades: lista em ordem (dias ou semanas); aberta: a última ainda pode ser feita (não quebra)
  let pos=0, melhor=0; const hist=[]; const marcos=[];
  unidades.forEach((u,i)=>{
    const ok = ehPasso(u), ultima = i===unidades.length-1;
    if (ok){ pos++; if (pos>melhor) melhor=pos; if (MARCOS_BASE.includes(pos) || (pos>365 && marcoAte(pos)===pos)) marcos.push(pos); hist.push({ u, st:'ok', pos }); }
    else if (ultima && aberta) hist.push({ u, st:'aberto', pos });
    else { const volta=marcoAte(pos); hist.push({ u, st:'quebra', de:pos, pos:volta }); pos=volta; }
  });
  return { pos, melhor, hist, marcos:[...new Set(marcos)] };
}
function inicioJogo(){ const ds=S.log.map(e=>e.d).filter(Boolean).sort(); return ds[0] || S.hoje; }
function diasDoJogo(){ const r=[]; for (let d=inicioJogo(), n=0; d<=S.hoje && n<3000; d=addDias(d,1), n++) r.push(d); return r; }
function fixasDia(){ return S.diarias.filter(m=>!m.semanal); }
function precisaDia(){ const n=fixasDia().length; return n ? Math.ceil(n*TRILHA_PCT) : 0; }
function feitasNoDia(es){ const ids=new Set(fixasDia().map(m=>m.id)); return new Set((es||[]).filter(e=>e.tipo==='diaria' && e.estrelas>0 && ids.has(e.diaria)).map(e=>e.diaria)).size; }
function trilhaDia(porDia){
  const precisa=precisaDia(); if (!precisa) return Object.assign(percorre([], ()=>false, true), { precisa:0, feitasHoje:0 });
  const r = percorre(diasDoJogo(), d=>feitasNoDia(porDia[d])>=precisa, true);
  return Object.assign(r, { precisa, feitasHoje: feitasNoDia(porDia[S.hoje]) });
}
function trilhaDiaria(m){
  const feito = new Set(S.log.filter(e=>e.diaria===m.id && e.estrelas>0).map(e=>e.d));
  if (!m.semanal) return Object.assign(percorre(diasDoJogo(), d=>feito.has(d), true), { unidade:'dia' });
  const sems=[]; for (let w=semanaDe(inicioJogo()); w<=S.hoje; w=addDias(w,7)) sems.push(w);
  const conta = w=>[...feito].filter(d=>d>=w && d<=addDias(w,6)).length;
  // semana em que o jogo começou pela metade: só conta se bateu a meta (não quebra)
  if (sems.length>1 && conta(sems[0])<m.semanal) sems.shift();
  return Object.assign(percorre(sems, w=>conta(w)>=m.semanal, true), { unidade:'semana', estaSemana: conta(semanaDe(S.hoje)) });
}
function checaMarcos(c){

}
// desenho da trilha: do último marco até o próximo, uma pedra por passo
function trilhaHTML(t, rotulo){
  const ini=marcoAte(t.pos), fim=marcoDepois(t.pos), aberto = t.hist.length && t.hist[t.hist.length-1].st==='aberto';

  }
  const falta = fim - t.pos;
  return `<div class="trilha"><div class="tcab">${ico('flame','st')}<b>${t.pos}</b><span>${rotulo}</span><span class="fraco">${falta} até o baú do marco ${fim}</span></div>
    <div class="tcaminho">${ini?`<span class="pedra base" title="Marco ${ini}">${ico('mapa','pm')}<i>${ini}</i></span>`:''}${pedras}</div>
    <div class="fraco tnota">${ini?`Falhou um ${t.unidade==='semana'?'semana':'dia'}? Volta pro marco ${ini}, não pro zero.`:`Falhou antes do marco 3? Volta pro começo.`} Recorde: ${t.melhor}.</div></div>`;
}
function abreTrilha(id){
  if (id==='dia'){
    const c=calc(), t=c.trilha;

/* ---------- festa: som + animação a cada tarefa, missão e chefão ----------
   tarefa = sino (ding) + "+XP" subindo; missão (diária) = fanfarra curta + faixa; chefão = fanfarra épica + faixa grande + tremida.
   Vários do mesmo tipo de uma vez (ex.: o agente mandou 4 diárias) viram uma festa só. */
const Festa = {
  fila:[], ocupado:false,
  add(tipo, txt, o){ this.fila.push(Object.assign({ tipo, txt }, o||{})); if (!this.ocupado) setTimeout(()=>this.prox(), 60); },
  prox(){
    if (this.ocupado || !this.fila.length) return;
    if ($('#jogo').hidden){ return; } // volta a tocar quando o jogo abrir (entrar chama prox)
    const f=this.fila.shift(); const juntos=[f];
    if (f.tipo!=='chefao') while (this.fila.length && this.fila[0].tipo===f.tipo) juntos.push(this.fila.shift());
    this.ocupado=true; const dur = this.toca(f.tipo, juntos);
    setTimeout(()=>{ this.ocupado=false; this.prox(); }, dur);
  },
  toca(tipo, js){
    const n=js.length, f=js[0];
    if (tipo==='tarefa'){
      Som.sfx('ding'); if (n>1) setTimeout(()=>Som.sfx('ding'), 180);
      this.sobe(`+${n*XP_TAREFA*(f.mult||1)} XP`, f.x, f.y); this.faisca(f.x, f.y, 10);
      return 650;
    }
    if (tipo==='missao'){
      Som.sfx('missao'); if (stage) stage.tocaHeroi(false);
      const est = n===1 && f.estrelas ? estrelas(f.estrelas) : '';
      this.faixa(n>1 ? `${n} missões concluídas` : 'Missão concluída', n>1 ? js.map(x=>x.txt).join(' · ') : f.txt, est, 'missao');
      this.confete(28); return 2100;
    }
    if (tipo==='chefao'){
      const b = f.id && S.chefoes.find(x=>x.id===f.id);
      const festa = ()=>{ Som.sfx('chefao'); this.faixa('Chefão derrotado!', f.txt, `<span class="fxp">+${f.xp||300} XP</span>`, 'chefao');
        document.body.classList.add('treme'); setTimeout(()=>document.body.classList.remove('treme'), 600); this.confete(70); setTimeout(()=>this.confete(50), 900); };
      if (stage && b && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
        if (ehMovel()) abreFolha(false); stage.abreArena(b); arenaUI(true, b); stage.onDesmonta = festa;
        setTimeout(()=>stage.derrota(b, ()=>{ stage.fechaArena(); arenaUI(false); }), 700); return 7500;
      }
      festa(); return 3600;
    }
    return 0;
  },
  camada(){ let c=$('#festa'); if (!c){ c=document.createElement('div'); c.id='festa'; c.setAttribute('aria-live','polite'); document.body.appendChild(c); } return c; },
  centro(){ const p=$('#palco3d'); const r=p ? p.getBoundingClientRect() : { left:0, top:0, width:innerWidth, height:innerHeight*0.5 }; return [r.left+r.width/2, r.top+Math.min(r.height*0.45, innerHeight*0.4)]; },
  sobe(txt, x, y){ if (x==null) [x,y]=this.centro(); const e=document.createElement('div'); e.className='fsobe'; e.textContent=txt; e.style.left=x+'px'; e.style.top=y+'px'; this.camada().appendChild(e); setTimeout(()=>e.remove(), 1200); },
  faisca(x, y, n){ if (x==null) [x,y]=this.centro(); const c=this.camada(); for (let i=0;i<n;i++){ const e=document.createElement('i'); e.className='ffai'; const a=i/n*Math.PI*2, d=26+Math.random()*22;
    e.style.left=x+'px'; e.style.top=y+'px'; e.style.setProperty('--dx', Math.cos(a)*d+'px'); e.style.setProperty('--dy', Math.sin(a)*d+'px'); c.appendChild(e); setTimeout(()=>e.remove(), 700); } },
  faixa(tit, sub, extra, cls){ const e=document.createElement('div'); e.className='ffaixa '+cls; e.innerHTML=`<b>${esc(tit)}</b>${sub?`<span>${esc(sub)}</span>`:''}${extra||''}`; this.camada().appendChild(e); setTimeout(()=>e.classList.add('sai'), cls==='chefao'?2900:1600); setTimeout(()=>e.remove(), cls==='chefao'?3500:2100); },
  confete(n){ const c=this.camada(), cores=['#e7b04a','#ffd77a','#ece4cc','#d0503f','#3ac08a','#3a9ad0']; for (let i=0;i<n;i++){ const e=document.createElement('i'); e.className='fconf';
    e.style.left=(Math.random()*100)+'vw'; e.style.background=cores[i%cores.length]; e.style.setProperty('--dx', (Math.random()*80-40)+'px'); e.style.animationDelay=(Math.random()*0.35)+'s'; e.style.animationDuration=(1.3+Math.random()*0.9)+'s'; c.appendChild(e); setTimeout(()=>e.remove(), 2800); } }
};

function abreArena(id, vitoria){
  const b=S.chefoes.find(x=>x.id===id); if (!b || !stage) { if (!stage) toast('O 3D não abriu neste aparelho.'); return; }

function petBox(){
  const el=$('#petbox'); let q=null, p=null;
  for (const x of petsJuntos().filter(x=>x.real)){
    p=x;
    if (!cuidouHoje(p,'alimentar') && !petDispensado[p.id+':alimentar']) q=['alimentar', p.tipo==='peixe' ? `Já deu comida pro ${esc(p.nome)} hoje?` : `Já alimentou ${esc(p.nome)} hoje?`];
    else if (p.tipo==='cachorro' && !cuidouHoje(p,'passear') && !petDispensado[p.id+':passear']) q=['passear', `Já passeou com ${esc(p.nome)} hoje?`];

function cuidar(petId, acao){
