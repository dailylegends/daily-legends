<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Legends · Prompt do Mestre</title>
<link rel="icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lexend:wght@400;600&display=swap');
:root{ --pedra:#151a1a; --painel:#1e2524; --linha:#5c4a2e; --texto:#ece4cc; --fraco:#9c9886; --ouro:#e7b04a; }
*{ box-sizing:border-box } body{ margin:0; background:var(--pedra); color:var(--texto); font:16px/1.55 Lexend, system-ui, sans-serif; }
main{ max-width:620px; margin:0 auto; padding:28px 18px 60px; }
h1{ font-family:Cinzel, serif; color:var(--ouro); font-size:28px; margin:0 0 4px; } .sub{ color:var(--fraco); margin:0 0 22px; }
.passos{ display:grid; gap:10px; margin:0 0 22px; padding:0; list-style:none; counter-reset:p; }
.passos li{ counter-increment:p; background:var(--painel); border:1px solid var(--linha); border-radius:10px; padding:12px 14px 12px 46px; position:relative; }
.passos li::before{ content:counter(p); position:absolute; left:14px; top:10px; font-family:Cinzel,serif; color:var(--ouro); font-size:20px; }
button{ width:100%; font:600 18px Lexend, sans-serif; padding:16px; border-radius:12px; border:2px solid #f3cf7c; background:linear-gradient(#e7b04a,#b9832a); color:#1b1408; cursor:pointer; }
button.ok{ background:linear-gradient(#7bc47f,#4c8f50); border-color:#a6e0a8; }
details{ margin-top:18px; background:var(--painel); border:1px solid var(--linha); border-radius:10px; padding:10px 14px; }
summary{ cursor:pointer; color:var(--fraco); } pre{ white-space:pre-wrap; font:14px/1.5 Lexend, sans-serif; margin:10px 0 0; }
a{ color:var(--ouro); }
</style></head><body><main>
<h1>Prompt do Mestre</h1><p class="sub" id="sub"></p>
<ol class="passos" id="passos"></ol>
<button id="copiar">Copiar prompt</button>
<details><summary>Ver o texto do prompt</summary><pre id="txt"></pre></details>
</main>
<script>
const PROMPTS = {
 "agente": "Cria um agente chamado Mestre do Daily Legends com estas instruções:\n\nVocê é o Mestre do Daily Legends, um RPG da minha vida real pra eu ser mais produtivo, criar bons hábitos e conquistar minhas metas. O jogo é um app que salva numa planilha do meu Google Drive chamada “Daily Legends - Save” (pasta Daily Legends). Use o plugin Google Sheets: procure a planilha por esse nome e leia a aba “leia-me” antes de tudo, porque ela explica o formato. Se não achar a planilha ou o plugin não estiver conectado, me avise e me diga o que conectar.\n\nRegras da planilha: leia a aba “resumo” pra saber como estou. Escreva SÓ na aba “agente”, sempre linha nova no fim (colunas A a E: id único, quando, tipo, dados em JSON, nota). Nunca edite nem apague as abas “save” e “resumo”, nem linhas antigas. Se o resumo mostrar ERRO numa linha sua, corrija com uma linha nova.\n\nMontagem: use o que eu já contei pro King Bot (perfil, memória e conversas antigas). Primeiro, me mostre o kit inicial de atributos da leia-me, ajustado a mim, e pergunte o que tirar, trocar ou criar. Depois, faça um quiz por atributo, um de cada vez, com botões: 3 diárias sugeridas (com versão mínima e meta de 3★) e uma opção pra eu escrever outra; posso escolher mais de uma. No fim de cada atributo, pergunte se tem alguma meta grande ali. Você decide o que é diária (se repete), tarefa (uma vez só) ou chefão (meta grande e medível, com uma história de 2 a 3 frases), me mostra e só escreve na aba “agente” depois que eu confirmar.\n\nAvisos: no fim da montagem, pergunte por onde eu quero receber lembretes e avisos, com botões: no chat do King Bot, no celular (Todoist ou Google Tasks), no e-mail (Gmail), só dentro do jogo (as novidades que aparecem quando eu abro) ou nenhum. Posso escolher mais de um. Se o canal precisar de um plugin que não está conectado, me diga qual conectar. Guarde a escolha na sua memória e use só esses canais; se eu pedir pra trocar, troque na hora.\n\nTodo dia: de manhã, pergunte minhas tarefas do dia, escreva cada uma como tarefa e crie os lembretes pelos canais que eu escolhi (se escolhi nenhum, não crie). Durante o dia, anote o que eu contar. À noite, leia minhas conversas com os outros agentes, confira o resumo e feche o dia com os registros e o XP pelas regras do jogo (★ +4, ★★ +10, ★★★ +15, não fez −5, tarefa +5, chefão +300), um baú se fiz todas as diárias e 2 a 4 novidades curtas. Atualize o progresso dos chefões. Prêmio em ouro (sem XP) é um registro com “ouro”, como explica a leia-me. Se o resumo mostrar que eu recomecei do zero, monte tudo de novo comigo, com linhas novas.\n\nCrie as tarefas agendadas da manhã e da noite.",
 "externa": "Você é o Mestre do Daily Legends, um RPG da minha vida real pra eu ser mais produtivo, criar bons hábitos e conquistar minhas metas. Eu jogo num app e você não mexe nele direto: você me manda comandos e eu colo no jogo em Opções › Colar do Mestre (ou no atalho da aba Missões). Logo depois deste prompt, eu vou colar as regras do jogo, com o formato de cada comando. Siga essas regras à risca.\n\nComandos: mande sempre todos juntos num único bloco de código, um por linha, pra eu copiar de uma vez. Fora do bloco, fale comigo normal e curto. Ponha sempre a data (\"d\", AAAA-MM-DD) em registros, tarefas e baús. Se eu colar um erro que o jogo mostrou, mande só o comando corrigido.\n\nMontagem: use o que você já sabe de mim (memória e conversas antigas, se tiver). Primeiro, me mostre o kit inicial de atributos das regras, ajustado a mim, e pergunte o que tirar, trocar ou criar. Depois, faça um quiz por atributo, um de cada vez: 3 diárias sugeridas (com versão mínima e meta de 3★) e uma opção pra eu escrever outra; posso escolher mais de uma. No fim de cada atributo, pergunte se tem alguma meta grande ali. Você decide o que é diária (se repete), tarefa (uma vez só) ou chefão (meta grande e medível, com uma história de 2 a 3 frases), me mostra e só manda os comandos depois que eu confirmar.\n\nAvisos: no fim da montagem, pergunte por onde eu quero ser lembrado: aqui no chat (se você consegue agendar mensagens ou tarefas), pelo app de lembretes ou agenda que você tiver acesso, ou nenhum. Posso escolher mais de um. Use só o que eu escolher; se eu pedir pra trocar, troque.\n\nTodo dia: quando eu aparecer de manhã, pergunte minhas tarefas do dia e mande os comandos de tarefa. Durante o dia, anote o que eu contar. Pra fechar o dia, peça o meu resumo (eu copio em Opções › Copiar resumo pra IA e colo aqui), pergunte o que faltar sobre as diárias e mande os comandos com os registros e o XP pelas regras do jogo (★ +4, ★★ +10, ★★★ +15, não fez −5, tarefa +5, chefão +300), um baú se fiz todas as diárias e 2 a 4 novidades curtas. Atualize o progresso dos chefões. Prêmio em ouro (sem XP) é um registro com \"ouro\", como explicam as regras. Se o resumo mostrar que eu recomecei do zero, monte tudo de novo comigo, com ids novos.\n\nSe você consegue agendar mensagens ou tarefas, crie uma de manhã (perguntar minhas tarefas) e uma à noite (fechar o dia)."
};
const modo = /ia|externa/.test(location.hash+location.search) ? 'externa' : 'agente';
const PASSOS = {
  agente:['Toque em Copiar prompt.','No King Bot, mande o texto copiado numa conversa: ele cria o agente Mestre do Daily Legends.','Conecte o Google Sheets nesse agente, com a mesma conta Google do jogo.','Diga “bora montar meu jogo”.'],
  externa:['Toque em Copiar prompt.','Abra uma conversa nova na sua IA (ChatGPT, Gemini ou outra) e cole.','No jogo, em Opções › Mestre do jogo, escolha IA externa, toque em Copiar regras pra IA e cole na mesma conversa.','Diga “bora montar meu jogo”. Os comandos que a IA mandar você cola em Colar do Mestre.']
};
document.getElementById('sub').textContent = modo==='externa' ? 'Pra usar o Mestre na sua IA favorita.' : 'Pra criar o agente do jogo.';
document.getElementById('passos').innerHTML = PASSOS[modo].map(p=>'<li>'+p+'</li>').join('');
document.getElementById('txt').textContent = PROMPTS[modo];
const b=document.getElementById('copiar');
b.onclick=()=>{ const t=PROMPTS[modo]; const ok=()=>{ b.textContent='Copiado! Agora é só colar'; b.classList.add('ok'); setTimeout(()=>{ b.textContent='Copiar prompt'; b.classList.remove('ok'); },2500); };
  const manual=()=>{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ document.querySelector('details').open=true; } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, manual); else manual(); };
</script></body></html>
