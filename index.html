  let slots = SLOTS.map(([s,nome])=>{
    const it = eq[s] && ITEM[eq[s]];
    return `<button class="slot ${filtroSlot===s?'sel':''} ${it?'r-'+it.rar:''}" data-slot="${s}">${it?itemImg(it):'<span class="vazio"></span>'}<span class="sl">${nome}</span></button>`;
  }).join('');
  const mochila = S.mochila.filter(id=>ITEM[id] && (!filtroSlot || ITEM[id].slot===filtroSlot));
  const celulas = mochila.map(id=>{ const it=ITEM[id], on=eq[it.slot]===id; return `<button class="cel r-${it.rar} ${selItem===id?'sel':''} ${on?'on':''}" data-item="${id}" title="${esc(it.nome)}">${itemImg(it)}${on?'<span class="eqm">E</span>':''}</button>`; });
  const minimo = Math.max(12, Math.ceil(celulas.length/6)*6);
  for (let i=celulas.length;i<minimo;i++) celulas.push('<span class="cel nada"></span>');
  let info;
  const it = selItem && ITEM[selItem];
  if (it){
    const on = eq[it.slot]===it.id;
    info = `<div class="info r-${it.rar}">${itemImg(it,'big')}<div class="inf"><div class="inome">${esc(it.nome)}</div>
      <div class="imeta"><span class="rar">${RAR[it.rar]}</span> <span>${SLOTS.find(x=>x[0]===it.slot)[1]}</span></div>
      <div class="acoes">${on?`<button class="btn" data-acao="remover" data-id="${it.id}">Remover</button>`:`<button class="btn ouro" data-acao="equipar" data-id="${it.id}">Equipar</button>`}</div></div></div>`;
  } else if (!S.mochila.length){
    info = `<div class="info vazioinfo"><div class="inf"><div class="inome">Mochila vazia</div><div class="imeta">Itens vêm da loja e dos baús.</div><div class="acoes"><button class="btn ouro" data-ir="loja">Ir pra loja</button></div></div></div>`;
  } else info = `<div class="info vazioinfo"><div class="inf"><div class="imeta">Toque num item da mochila.</div></div></div>`;
  return `<div class="equip"><div class="slots">${slots}</div>${info}</div>
    <div class="sec"><h3>Mochila</h3>${filtroSlot?`<button class="chip" data-slot="${filtroSlot}">Mostrar tudo</button>`:''}</div>
    <div class="inv">${celulas.join('')}</div>`;
}

function vAtrib(){
  const c=calc();
  if (!areasJogo().length) return `<div class="sec"><h3>Atributos</h3></div><p class="fraco">Você ainda não tem atributos. Eles são as áreas da sua vida que você quer evoluir (saúde, estudos, trabalho, o que fizer sentido pra você). O agente do jogo cria os seus depois de conversar com você.</p>`;
  return `<div class="lista">` + areasJogo().map(a=>{
    const xp=c.area[a.id]||0, lv=nivelDe(xp), skills=S.habilidades.filter(h=>h.area===a.id);
    const parado = c.ultima[a.id] ? diasEntre(c.ultima[a.id], S.hoje) : null, pq=proxQueda(c, a.id);
    const alerta = parado!=null && parado>=5 ? `<span class="alerta">${parado} dias parado${pq?` · cai ${pq.em<=1?'amanhã':'em '+pq.em+' dias'}`:''}</span>` : '';
    return `<details class="area"><summary>${ico(icoArea(a.id),'ai')}<span class="anome">${a.nome}</span>${alerta}<span class="anv">Nv ${lv.n}</span>
      <span class="abar">${barra(lv.r,lv.p,'xp')}<span class="afr">${num(lv.r)}/${num(lv.p)} XP</span></span></summary>
      <div class="skills">${skills.length? skills.map(s=>`<span class="skill">${esc(s.nome)}</span>`).join('') : '<span class="fraco">Nenhuma habilidade ainda.</span>'}</div></details>`;
  }).join('') + `</div>`;
}

function semanaDe(s){ const d=dt(s); const w=(d.getDay()+6)%7; return addDias(s,-w); }
function vMissoes(){
  const hoje=S.hoje, ini=semanaDe(hoje);
  const doDia = S.log.filter(e=>e.d===hoje);
  const linhas = S.diarias.map(m=>{
    let st;
    if (m.semanal){
      const n = S.log.filter(e=>e.diaria===m.id && e.estrelas>0 && e.d>=ini && e.d<=hoje).length;
      const e = doDia.find(e=>e.diaria===m.id);
      st = `${e&&e.estrelas?estrelas(e.estrelas):''}<span class="sem">${n}/${m.semanal} na semana</span>`;
    } else {
      const e = doDia.find(e=>e.diaria===m.id);
      st = !e ? `<span class="pend">Pendente</span>${estrelas(0)}` : e.estrelas>0 ? estrelas(e.estrelas) : `<span class="falha">${ico('x','st')} ${e.xp} XP</span>`;
    }
    const tm=trilhaDiaria(m);
    st += `<button class="chama" data-trilha="${m.id}" aria-label="Trilha de ${esc(m.nome)}: ${tm.pos}">${ico('flame','st')}${tm.pos}</button>`;
    return `<div class="miss">${ico(icoArea(m.area),'ai')}<div class="mt"><div class="mn">${esc(m.nome)}</div>
      <div class="mm">${m.minima?`<span>Mín.: ${esc(m.minima)}</span>`:''}${m.tres?`<span>3★: ${esc(m.tres)}</span>`:''}</div></div><div class="ms">${st}</div></div>`;
  }).join('');
  const extras = (S.extras||[]).map(x=>{ const n=S.log.filter(e=>e.extra===x.id && e.d>=ini).length; 
    return `<div class="miss">${ico(icoArea(x.area),'ai')}<div class="mt"><div class="mn">${esc(x.nome)}</div><div class="mm"><span>+${x.xp} XP por lote</span></div></div><div class="ms"><span class="sem">${n} na semana</span></div></div>`; }).join('');
  const tarefas = (S.tarefas||[]).filter(t=>t.d===hoje).map(t=>`<div class="miss tarefa ${t.feita===true?'feita':t.feita===false?'nfeita':''}">${ico('scroll','ai')}<div class="mt"><div class="mn">${esc(t.txt)}</div><div class="mm"><span>${t.feita===true?`Feita, +${XP_TAREFA} XP`:t.feita===false?'Não feita':'Pendente'}</span></div></div>
</div>`).join('');
  const reais = (S.pets ? S.pets.possui.filter(p=>p.real) : []);
  const cuidados = reais.map(p=>{ const acoes = p.tipo==='cachorro' ? ['alimentar','passear'] : ['alimentar'];
    return acoes.map(a=>{ const ok=cuidouHoje(p,a); return `<div class="miss">${ico('heart','ai')}<div class="mt"><div class="mn">${a==='passear'?'Passear com':'Alimentar'} ${esc(p.nome)}</div><div class="mm"><span>+${XP_PET_CUIDADO} XP por dia</span></div></div><div class="ms">${ok?estrelas(2):`<button class="btn mini ouro" data-cuidar="${a}" data-pet="${p.id}">Feito</button>`}</div></div>`; }).join(''); }).join('');
  const blocoT = `<div class="sec"><h3>Tarefas de hoje</h3><span class="fraco">+${XP_TAREFA} XP cada</span></div>
    <div class="lista">${tarefas || '<p class="fraco">Nenhuma tarefa pra hoje ainda. Conte pro seu Mestre no chat que ele anota.</p>'}</div>`;
  const blocoP = cuidados ? `<div class="sec"><h3>Cuidados com os pets</h3></div><div class="lista">${cuidados}</div>` : '';
  const ct=calc().trilha;
  const blocoTr = ct.precisa ? `<button class="trilhaBtn" data-trilha="dia" aria-label="Ver trilha do dia">${trilhaHTML(ct,'dias seguidos')}<span class="fraco tnota">Hoje: ${ct.feitasHoje}/${ct.precisa} diárias pro passo. Toque numa ${ico('flame','st')} pra ver a trilha de cada diária.</span></button>` : '';
  return blocoTr + blocoT + `<div class="sec"><h3>${DSEM[dt(hoje).getDay()]}, ${fmtD(hoje)}</h3><span class="fraco">${ico('star','st')}+4 &nbsp;${ico('star','st')}${ico('star','st')}+10 &nbsp;${ico('star','st')}${ico('star','st')}${ico('star','st')}+15 &nbsp;${ico('x','st')}−5</span></div>
    <div class="lista">${linhas || '<p class="fraco">Suas diárias aparecem aqui quando você montar o jogo com o agente.</p>'}</div>${extras?`<div class="sec"><h3>Missões extras</h3></div><div class="lista">${extras}</div>`:''}${blocoP}`;
}

function vChefoes(){
  const card = b=>{
    const morto = S.derrotados.find(d=>d.id===b.id);
    let corpo='';
    if (b.tipo==='valor'){
      const hp = Math.max(0,b.alvo-b.atual), tot=b.alvo-b.base;
      const f = v=> b.moeda ? 'R$ '+num(v) : num(v);
      corpo = `<div class="hp"><span>HP</span>${barra(hp,tot,'vida')}<b>${f(hp)}</b></div><div class="bmeta">${f(b.atual)} de ${f(b.alvo)}</div>`;
    } else if (b.tipo==='fases'){
      const ok=b.fases.filter(f=>f.ok).length;
      corpo = `<div class="hp"><span>HP</span>${barra(b.fases.length-ok,b.fases.length,'vida')}<b>${b.fases.length-ok}/${b.fases.length}</b></div>
        <ul class="fases">${b.fases.map(f=>`<li class="${f.ok?'ok':''}">${esc(f.n)}</li>`).join('')}</ul>`;
    } else if (b.tipo==='data'){
      const falta = diasEntre(S.hoje, b.data);
      corpo = `<div class="hp"><span>Luta</span><b class="cont">${falta>0?`em ${falta} dias`:falta===0?'hoje':'passou'}</b></div><div class="bmeta">${fmtD(b.data)}</div>`;
    }
    return `<div class="boss ${morto?'morto':''}"><div class="bwrap" tabindex="0" aria-label="História de ${esc(b.nome)}"><button class="bimgBtn" data-arena="${esc(b.id)}" aria-label="Ver ${esc(b.nome)} na arena"><img class="bimg" src="${Shots.boss(b)}" alt=""><span class="bver">${morto?'Reviver a vitória':'Ver na arena'}</span></button>${b.historia?`<div class="balao" role="tooltip">${esc(b.historia)}</div>`:''}</div><div class="bt">
      <div class="bnome">${esc(b.nome)}</div><div class="bdesc">${esc(b.meta)}</div>${corpo}
      <div class="brec">${ico(icoArea(b.area),'st')} +300 XP${b.nota?`<span class="fraco">${esc(b.nota)}</span>`:''}</div>
      ${morto?`<div class="selo">Derrotado ${fmtD(morto.d)}</div>`:''}</div></div>`;
  };
  if (!S.chefoes.length) return `<div class="sec"><h3>Chefões</h3></div><p class="fraco">Nenhum chefão ainda. Conte suas metas grandes pro agente do jogo: cada uma vira um chefão com história própria.</p>`;
  return `<div class="bosses">${S.chefoes.map(card).join('')}</div>`;
}

function vLoja(){
  const c=calc();
  const fil = [...SLOTS, ['pets','Pets'], ['petitens','Itens de pet']];
  const chips = fil.map(([s,n])=>`<button class="chip ${filtroLoja===s?'on':''}" data-floja="${s}">${n}</button>`).join('');
  let itens;
  if (filtroLoja==='pets'){
    itens = [...PETS].sort((a,b)=>a.preco-b.preco).map(pt=>{ const n=S.pets.possui.filter(p=>p.tipo===pt.tipo).length, conf=confirmando==='p:'+pt.tipo;
      return `<div class="loja"><img class="vox" src="${Shots.pet({tipo:pt.tipo})}" alt=""><div class="ln">${pt.nome}</div><div class="lr">${n?`Você tem ${n}`:'Companheiro'}</div>
        <button class="btn ${conf?'ouro':''} ${c.ouro<pt.preco?'off':''}" data-adotar="${pt.tipo}">${conf?'Confirmar':`${ico('coin','st')} ${num(pt.preco)}`}</button></div>`; }).join('');
  } else if (filtroLoja==='petitens'){
    itens = [...PET_ITENS].sort((a,b)=>a.preco-b.preco).map(it=>{ const tem=S.mochila.includes(it.id), conf=confirmando==='i:'+it.id, provando=provaPet[it.slot]===it.id;
      const btn = tem ? `<span class="tem">Na mochila</span>` : `<button class="btn ${conf?'ouro':''} ${c.ouro<it.preco?'off':''}" data-comprarpet="${it.id}">${conf?'Confirmar':`${ico('coin','st')} ${num(it.preco)}`}</button>`;
      return `<div class="loja r-${it.rar} ${tem?'tido':''} ${provando?'provando':''}"><button class="prov" data-provarpet="${it.id}" title="Provar no pet"><img class="vox" src="${Shots.petItem(it)}" alt=""><div class="ln">${esc(it.nome)}</div>${provando?'<span class="ptag">Provando</span>':''}</button><div class="lr">${RAR[it.rar]} · ${it.slot==='pcabeca'?'Cabeça':'Pescoço'}</div>${btn}</div>`; }).join('');
  } else {
    itens = ITENS.filter(i=>!i.fora && i.slot===filtroLoja).sort((a,b)=>a.preco-b.preco).map(it=>{
      const tem=S.mochila.includes(it.id), pode=c.ouro>=it.preco, conf=confirmando==='i:'+it.id;
      if (!revelado(it)){
        return `<div class="loja r-lendario misterio"><button class="prov" data-misterio="${it.id}" aria-label="Item lendário misterioso">${itemImg(it,'',true)}<div class="ln">???</div></button><div class="lr">Lendário</div>
          <span class="tem trava">${ico('lock','st')} Revela com ${num(it.preco)}</span></div>`;
      }
      const provando = prova[it.slot]===it.id;
      const btn = tem ? `<span class="tem">Na mochila</span>` : `<button class="btn ${conf?'ouro':''} ${!pode?'off':''}" data-comprar="${it.id}">${conf?`Confirmar`:`${ico('coin','st')} ${num(it.preco)}`}</button>`;
      return `<div class="loja r-${it.rar} ${tem?'tido':''} ${provando?'provando':''}"><button class="prov" data-provar="${it.id}" title="Provar no herói">${itemImg(it)}<div class="ln">${esc(it.nome)}</div>${provando?'<span class="ptag">Provando</span>':''}</button><div class="lr">${RAR[it.rar]}</div>${btn}</div>`;
    }).join('');
  }
  const np = Object.keys(prova).length + Object.keys(provaPet).length;
  const dica = filtroLoja==='pets' ? 'Ter pet ao seu lado dá +'+XP_PET_DIA+' XP por dia. Até '+MAX_PETS_JUNTOS+' pets ficam com você ao mesmo tempo. A cor você escolhe na adoção e não muda depois.' : (np ? `Provando ${np} ${np>1?'itens':'item'}. <button class="link" data-acao="tirarProva">Tirar tudo</button>` : (filtroLoja==='petitens' ? 'Toque num item pra provar no seu pet.' : 'Toque num item pra provar no herói antes de comprar.'));
  return `<div class="sec"><h3>Loja</h3><span class="saldo">${ico('coin','st')} ${num(c.ouro)}</span></div>
    <div class="chips">${chips}</div><p class="fraco dica">${dica}</p><div class="lgrid">${itens}</div>`;
}

function vHerois(){
  const c=calc();
  const cards = HEROIS.map(h=>{
    const tem=S.herois.possui.includes(h.id), ativo=S.herois.ativo===h.id, preco=h.preco||PRECO_HEROI, conf=confirmando==='h:'+h.id;
    const lv=nivelDe(c.heroi[h.id]||0);
    if (!heroiRevelado(h)) return `<div class="hcard bloq r-lendario misterio"><img src="${Shots.hero(h,{},true)}" alt="">${ico('lock','cad')}<div class="hn">???</div><div class="hl">Lendário</div><span class="tem trava">Revela com ${num(preco)}</span></div>`;
    let btn;
    if (ativo) btn = `<span class="tem">Em campo</span>`;
    else if (tem) btn = `<button class="btn" data-usar="${h.id}">Usar</button>`;
    else btn = `<button class="btn ${conf?'ouro':''} ${c.ouro<preco?'off':''}" data-heroi="${h.id}">${conf?'Confirmar':`${ico('coin','st')} ${num(preco)}`}</button>`;
    return `<div class="hcard ${ativo?'ativo':''} ${tem?'':'bloq'} ${h.lendario?'r-lendario':''}"><img src="${Shots.hero(tem?heroiV(h.id):h, S.herois.equip[h.id]||{})}" alt="">
      ${tem?`<span class="hnv">Nv ${lv.n}</span>`:ico('lock','cad')}<div class="hn">${esc(tem?nomeH(h.id):h.nome)}</div><div class="hl">${tem&&nomeH(h.id)!==h.nome?esc(h.nome)+'. ':''}${esc(h.lema)}</div>${btn}${tem?`<button class="link" data-renomear="${h.id}">Renomear</button>`:''}${tem&&temPele(h)?`<button class="link" data-pelede="${h.id}">Tom de pele</button>`:''}</div>`;
  }).join('');
  const meusItens = PET_ITENS.filter(i=>S.mochila.includes(i.id));
  const nJ = petsJuntos().length;
  const pets = S.pets.possui.map(p=>{ const ativo=(S.pets.juntos||[]).includes(p.id);
    const itens = meusItens.map(it=>{ const on=(p.equip||{})[it.slot]===it.id; return `<button class="pit ${on?'on':''}" data-peteq="${it.id}" data-pet="${p.id}" title="${esc(it.nome)}"><img src="${Shots.petItem(it)}" alt="${esc(it.nome)}"></button>`; }).join('');

  return `<div class="sec"><h3>Heróis</h3><span class="fraco">${S.herois.possui.length} de ${HEROIS.length}</span></div><div class="hgrid">${cards}</div>

function vDiario(){
  const c=calc(); const dias=Object.keys(c.porDia).sort().reverse();
  if (!dias.length) return `<p class="fraco">Nada registrado ainda.</p>`;
  return dias.map(d=>{
    const es=c.porDia[d], tot=es.reduce((s,e)=>s+(e.xp||0),0);
    return `<div class="dia"><div class="dh"><span>${DSEM[dt(d).getDay()]}, ${fmtD(d)}</span><b class="${tot<0?'neg':''}">${tot>=0?'+':''}${tot} XP</b></div>
      ${es.map(e=>`<div class="de">${ico(icoArea(e.area),'st')}<span class="dt">${esc(e.txt)}</span>${e.estrelas?estrelas(e.estrelas):''}<b class="${(e.xp||0)<0||(e.ouro||0)<0?'neg':''}">${e.xp?((e.xp>0?'+':'')+e.xp):''}${e.ouro!=null&&e.ouro!==(e.xp||0)?` ${e.ouro>0?'+':''}${num(e.ouro)} ouro`:''}</b></div>`).join('')}</div>`;
  }).join('');
}

/* ---------- ações ---------- */
function equipar(id){ const it=ITEM[id]; eqAtivo()[it.slot]=id; Som.sfx('equipar'); marcaSujo(); atualizaPalco(); render(); toast(it.nome+' equipado'); }
function remover(id){ const it=ITEM[id]; delete eqAtivo()[it.slot]; Som.sfx('clique'); marcaSujo(); atualizaPalco(); render(); }
function comprar(id){
  const it=ITEM[id], c=calc();
  if (c.ouro<it.preco){ Som.sfx('erro'); toast(`Falta ${num(it.preco-c.ouro)} de ouro`, 'ruim'); return; }
  if (confirmando!=='i:'+id){ confirmando='i:'+id; Som.sfx('clique'); render(); return; }
  confirmando=null; S.compras.push({ uid:uid('c'), tipo:'item', id, preco:it.preco, d:S.hoje }); S.mochila.push(id);
  const vestido = prova[it.slot]===id;
  if (vestido){ eqAtivo()[it.slot]=id; delete prova[it.slot]; }
  Som.sfx('moeda'); marcaSujo(); render(); if (vestido) atualizaPalco(); toast(it.nome+(vestido?' comprado e equipado':' na mochila'));
}
function comprarHeroi(id){
  const h=HEROI[id], preco=h.preco||PRECO_HEROI, c=calc();
  if (c.ouro<preco){ Som.sfx('erro'); toast(`Falta ${num(preco-c.ouro)} de ouro`, 'ruim'); return; }
  if (confirmando!=='h:'+id){ confirmando='h:'+id; Som.sfx('clique'); render(); return; }
  confirmando=null; S.compras.push({ uid:uid('c'), tipo:'heroi', id, preco, d:S.hoje }); S.herois.possui.push(id); S.herois.equip[id]={};
  Som.sfx('nivel'); marcaSujo(); render(); toast(h.nome+' entrou pro time'); pedeNome('heroi', id);
}
function provar(id){
  const it=ITEM[id];
  if (prova[it.slot]===id){ delete prova[it.slot]; Som.sfx('clique'); }
  else { prova[it.slot]=id; Som.sfx('equipar'); }
  atualizaPalco(); render();
  if (prova[it.slot]===id && window.innerWidth<=860){ const pl=document.querySelector('.palco'); pl && pl.scrollIntoView({ behavior:'smooth', block:'start' }); }
}
function tirarProva(){ prova={}; provaPet={}; Som.sfx('clique'); atualizaPalco(); render(); }
function usarHeroi(id){ prova={}; S.herois.ativo=id; Som.sfx('equipar'); marcaSujo(); selItem=null; atualizaPalco(); render(); toast(nomeH(id)+' em campo'); }

function abrirBau(){
  if (S.baus<=0){ Som.sfx('erro'); toast('Nenhum baú fechado. Chegue no próximo marco da trilha.'); return; }
  const peso={comum:60,raro:28,epico:10,lendario:2};
  const pool=ITENS.filter(i=>!i.fora && !S.mochila.includes(i.id));
  let premio;
  if (pool.length){ let tot=pool.reduce((s,i)=>s+peso[i.rar],0), r=Math.random()*tot; premio=pool.find(i=>(r-=peso[i.rar])<0)||pool[0]; S.mochila.push(premio.id); S.bausAbertos.push({ id:uid('b'), d:S.hoje, item:premio.id }); }
  else { S.log.push({ id:uid('l'), d:S.hoje, area:'fin', txt:'Baú: 100 de ouro', xp:0, ouro:100, tipo:'bau' }); S.bausAbertos.push({ id:uid('b'), d:S.hoje, ouro:100 }); }
  S.baus = Math.max(0, S.bausGanhos.length - S.bausAbertos.length);
  Som.sfx('bau'); marcaSujo(); topo();
  modal(`<div class="bau">${premio?`${itemImg(premio,'big')}<div class="inome r-${premio.rar}">${esc(premio.nome)}</div><div class="rar">${RAR[premio.rar]}</div>`:`${ico('coin','big')}<div class="inome">100 de ouro</div>`}
    <div class="acoes">${premio?`<button class="btn ouro" data-acao="equipar" data-id="${premio.id}" data-fecha="1">Equipar agora</button>`:''}<button class="btn" data-fecha="1">Guardar</button></div></div>`, 'Baú aberto');
  render();
}

  const dados = JSON.stringify(Object.assign({}, S, { salvoEm:new Date().toISOString() }), null, 1);

// código do save: só o que muda dentro do jogo (compras, roupas, nomes, pets, opções, cuidados e tarefas marcadas)
function codigoSave(){
  return 'DL2:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
}
let tituloNovidades = null;
function copiarTexto(txt, msg){
  const ok=()=>{ Som.sfx('moeda'); toast(msg||'Copiado.'); };
  const manual=()=>modal(`<p class="fraco">Não deu pra copiar sozinho. Segure no texto, selecione tudo e copie.</p><textarea id="codSave" class="cod" readonly rows="8">${esc(txt)}</textarea><div class="acoes"><button class="btn" data-fecha="1">Fechar</button><button class="btn ouro" data-acao="copiar">Tentar copiar</button></div>`, 'Copiar');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, manual); else manual();
}
function copiarCodigo(){
  const t=$('#codSave'); if (!t) return;
  const ok=()=>{ Som.sfx('moeda'); toast('Código copiado.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(ok, ()=>{ t.select(); try { document.execCommand('copy'); ok(); } catch(e){ toast('Selecione o texto e copie'); } });
  else { t.select(); try { document.execCommand('copy'); ok(); } catch(e){ toast('Selecione o texto e copie'); } }
}
function carregar(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{ const t=String(fr.result).trim(); const d = /^DL[12]:/.test(t) ? decodificaCodigo(t) : JSON.parse(t); if (!['daily-legends','saga-diaria','zaza-quest'].includes(d.jogo)) throw 0; importaSave(d); } catch(e){ Som.sfx('erro'); toast('Esse arquivo não é um save do Daily Legends','ruim'); } };
  fr.readAsText(file);
}

function escolha(){ cria = { passo:'heroi', faixa:Som.faixa }; passoCria(); }
function swatches(tipo, sel){ return `<div class="sw">${PET[tipo].cores.map(c=>`<button type="button" class="swc ${sel===c?'on':''}" style="background:${c}" data-cor="${c}" aria-label="Cor ${c}"></button>`).join('')}<label class="swc livre" title="Outra cor"><input type="color" value="${sel||PET[tipo].cores[0]}" data-corlivre="1" aria-label="Outra cor"></label></div>`; }
function passoCria(){

    modal(`<div class="conf"><img id="pelePrev" src="${Shots.heroFull(heroiV(c.heroi,c.pele),{})}" alt=""><div><p><b>${esc(h.nome)}</b>, ${esc(h.lema.toLowerCase())}.</p><p class="fraco">Tom de pele (dá pra trocar depois):</p>${tonsHTML(c.pele,'data-pele')}<p class="fraco">Tem certeza? O herói principal não troca depois. Dá pra comprar outros com ouro.</p>
      <div class="acoes"><button class="btn" data-cria="heroi">Voltar</button><button class="btn ouro" data-cria="nome">Confirmar</button></div></div></div>`, 'Seu herói principal');

    modal(`<p>Você tem algum desses bichos na vida real?</p><p class="fraco">Se tiver, ele vem com você de graça e cuidar dele de verdade dá XP. Tem mais de um? Escolha um agora, os outros você adota com ouro.</p>

    modal(`<form class="campo" data-form="cria-pet"><div class="petprev"><img id="petPrev" src="${Shots.pet({tipo:c.pet, cor:c.petCor})}" alt=""></div>

function fimCria(){
  const c=cria, id=c.heroi;
  S.herois.possui=[id]; S.herois.ativo=id; S.herois.equip[id]={}; S.herois.nomes=S.herois.nomes||{}; if (c.nome) S.herois.nomes[id]=c.nome; S.herois.pele=S.herois.pele||{}; if (c.pele && c.pele!==HEROI[id].skin) S.herois.pele[id]=c.pele;
  if (c.pet){ S.pets.possui=[{ id:'pet1', tipo:c.pet, cor:c.petCor||PET[c.pet].cores[0], nome:c.petNome||PET[c.pet].nome, real:true, gratis:true, equip:{}, d:S.hoje }]; S.pets.ativo='pet1'; S.pets.juntos=['pet1']; S.pets.desde=S.hoje; }
  S.config.faixa=c.faixa; cria=null;
  Som.sfx('nivel'); marcaSujo(); fechaModal(); $('#modal').classList.remove('largo'); entrar(); toast(`${nomeH(id)} pronto pra jornada.`);
}
/* ---------- pets ---------- */
function adotar(tipo){
  const pt=PET[tipo], c=calc();
  if (c.ouro<pt.preco){ Som.sfx('erro'); toast(`Falta ${num(pt.preco-c.ouro)} de ouro`, 'ruim'); return; }
  if (confirmando!=='p:'+tipo){ confirmando='p:'+tipo; Som.sfx('clique'); render(); return; }
  confirmando=null; cria={ adocao:true, pet:tipo, petCor:pt.cores[0], petNome:'' };
  modal(`<form class="campo" data-form="adotar"><div class="petprev"><img id="petPrev" src="${Shots.pet({tipo})}" alt=""></div>
    <label for="petNome">Nome</label><input id="petNome" maxlength="16" placeholder="Nome" autocomplete="off">
    <label>Cor</label>${swatches(tipo, pt.cores[0])}<p class="fraco">A cor é escolhida uma vez só e não muda depois.</p>
    <label class="chk"><input type="checkbox" id="petReal"> Tenho esse bicho na vida real</label>
    <div class="acoes"><button type="button" class="btn" data-fecha="1">Cancelar</button><button class="btn ouro">Adotar por ${num(pt.preco)}</button></div></form>`, 'Adotar '+pt.nome.toLowerCase());
}
function fimAdocao(){
  const c=cria, pt=PET[c.pet], cal=calc(); if (cal.ouro<pt.preco){ toast('Ouro insuficiente','ruim'); return; }
  const id='pet'+(S.pets.possui.length+1)+'_'+Date.now().toString(36).slice(-3);
  S.pets.possui.push({ id, tipo:c.pet, cor:c.petCor, nome:($('#petNome').value.trim()||pt.nome), real:$('#petReal').checked, equip:{}, d:S.hoje });
  S.compras.push({ uid:uid('c'), tipo:'pet', id:c.pet, preco:pt.preco, d:S.hoje });
  if (!S.pets.desde) S.pets.desde=S.hoje; arrumaJuntos(); if (S.pets.juntos.length<MAX_PETS_JUNTOS) S.pets.juntos.push(id); arrumaJuntos();
  cria=null; Som.sfx('nivel'); marcaSujo(); fechaModal(); atualizaPalco(); render(); toast(`${S.pets.possui.at(-1).nome} chegou!`);
}
function pedeNome(tipo, id){
  const atual = tipo==='heroi' ? nomeH(id) : S.pets.possui.find(p=>p.id===id).nome;
  modal(`<form class="campo" data-form="nome" data-tipo="${tipo}" data-id="${id}"><label for="nomeNovo">Nome</label><input id="nomeNovo" maxlength="18" value="${esc(atual)}" autocomplete="off">
    <div class="acoes"><button type="button" class="btn" data-fecha="1">Cancelar</button><button class="btn ouro">Salvar nome</button></div></form>`, tipo==='heroi'?'Nome do herói':'Nome do pet');
  setTimeout(()=>{ const i=$('#nomeNovo'); i && i.select(); }, 50);
}
function comprarPetItem(id){
  const it=PET_ITEM[id], c=calc();
  if (c.ouro<it.preco){ Som.sfx('erro'); toast(`Falta ${num(it.preco-c.ouro)} de ouro`, 'ruim'); return; }
  if (confirmando!=='i:'+id){ confirmando='i:'+id; Som.sfx('clique'); render(); return; }
  confirmando=null; S.compras.push({ uid:uid('c'), tipo:'item', id, preco:it.preco, d:S.hoje }); S.mochila.push(id);
  const p=petAtivo(), vestido = p && provaPet[it.slot]===id;
  if (vestido){ p.equip=p.equip||{}; p.equip[it.slot]=id; delete provaPet[it.slot]; }
  Som.sfx('moeda'); marcaSujo(); render(); if (vestido) atualizaPalco(); toast(it.nome+(vestido?' comprado e equipado':' na mochila'));
}
function marcaTarefa(id, feita){
  const t=S.tarefas.find(x=>x.id===id); if (!t) return;
  t.feita = (t.feita===feita) ? null : feita; t.em = Date.now();
  S.log.forEach(e=>{ if (e.tipo==='tarefa' && e.tarefa===id && e.id) S.removidos.push(e.id); });
  S.log = S.log.filter(e=>!(e.tipo==='tarefa' && e.tarefa===id));
  if (t.feita===true) S.log.push({ id:uid('l'), d:t.d, area:t.area||null, txt:t.txt, xp:XP_TAREFA, tipo:'tarefa', tarefa:id, heroi:S.herois.ativo });
  const bt=document.querySelector(`[data-tarefa="${id}"][data-st="1"]`), rb=bt&&bt.getBoundingClientRect();
  if (t.feita===true) Festa.add('tarefa', t.txt, rb ? { x:rb.left+rb.width/2, y:rb.top } : {}); else Som.sfx('clique');
  marcaSujo(); render(); topo();
}
function normaliza(){
  S.herois.nomes = S.herois.nomes || {}; S.herois.pele = S.herois.pele || {}; S.pets = S.pets || { possui:[], ativo:null }; arrumaJuntos(); S.tarefas = S.tarefas || []; S.revelados = S.revelados || [];
  S.config = S.config || {}; if (S.config.faixa==null) S.config.faixa=0; if (!S.config.cenario) S.config.cenario='castelo';
  S.hoje = hojeReal(); // o dia do jogo é sempre o dia do aparelho (antes só andava pra frente e ficava preso no dia do servidor, em UTC)
  consertaDatas(S); // registros gravados com o dia errado (futuro) voltam pro dia local em que foram feitos
  ['log','compras','mochila','bausAbertos','habilidades','derrotados','diarias','extras','chefoes','novidades','revelados'].forEach(k=>{ if (!Array.isArray(S[k])) S[k]=[]; });
  // save de antes das áreas personalizadas: fica só com as áreas antigas que ele já usava
  if (!Array.isArray(S.areas)){ const u=areasUsadas(S); S.areas = AREAS_LEGADO.filter(a=>u.has(a.id)).map(a=>Object.assign({}, a)); }
  S.removidos = S.removidos || []; S.aplicados = S.aplicados || []; S.agenteErros = S.agenteErros || []; S.mod = S.mod || {};
  if (!Array.isArray(S.bausGanhos)){ S.bausGanhos=[]; const n=(S.baus||0)+S.bausAbertos.length; for (let i=0;i<n;i++) S.bausGanhos.push({ id:'leg'+i, d:S.hoje }); }
  ['log','compras','bausAbertos','bausGanhos','habilidades','derrotados','tarefas'].forEach(k=>garanteIds(S[k], k[0]+':', chaveDe(k)));
  S.baus = Math.max(0, S.bausGanhos.length - S.bausAbertos.length);
}

/* ---------- fluxo ---------- */
function entrar(){
  normaliza();
  $('#titulo').hidden=true; $('#jogo').hidden=false;
  if (!stage && threeOk){ try { stage = new Stage($('#palco3d'));
    // layout largo: a placa do nome fica por cima do palco; o herói é enquadrado acima dela
    stage.livre = (w,h)=>{
      if (ehMovel()){ const c=$('#palco3d').getBoundingClientRect(), r={}; const baixo = folha ? $('.painel') : $('#placa'), pb=baixo.getBoundingClientRect();
        if (pb.height) r.yb = 1 - 2*((pb.top-c.top)-6)/h; if (!folha){ let fundo = 0; const px=$('#petbox'), hc=document.querySelector('#humorBtn .hcol'); [px && !px.hidden ? px : null, hc].forEach(e=>{ if (!e) return; const q=e.getBoundingClientRect(); if (q.height) fundo = Math.max(fundo, q.bottom-c.top); }); if (fundo) r.yt = 1 - 2*(fundo+6)/h; } return r; }
      const pl=$('#placa'); if (!pl || getComputedStyle(pl).position!=='absolute') return null; const c=$('#palco3d').getBoundingClientRect(), p=pl.getBoundingClientRect();
      if (!p.height || p.right-c.left < w*0.3) return null; return 1 - 2*((p.top-c.top)-8)/h; };
    stage.onAcerta = ()=>Som.sfx('golpe');
    stage.onToque = (a)=>{ Som.tocar(); if (a.tipo==='heroi') Som.heroi(a.classe, a.sexo, a.raca); else Som.pet(a.pet); };
    stage.setPlataforma((S.config&&S.config.cenario)||'castelo'); stage.resize(); } catch(e){ $('#palco3d').innerHTML='<p class="fraco">Não deu pra abrir o 3D neste aparelho.</p>'; } }
  if (!S.herois.ativo){ escolha(); return; }
  atualizaPalco(); render(); setTimeout(()=>Festa.prox(), 400); HumorBtn.entrar(); setTimeout(()=>Falas.abre(), 1400);
  if (S.novidades && S.novidades.length){
    Som.sfx('nivel');
    modal(`<ul class="novs">${S.novidades.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><div class="acoes"><button class="btn ouro" data-fecha="1">Bora</button></div>`, tituloNovidades || 'Enquanto você dormia'); tituloNovidades=null;
    S.novidades=[]; marcaSujo();
  }
}

function liga(){
  normaliza();
  $('#tIcoOuro').src=pix('coin'); $('#tIcoSeq').src=pix('flame'); $('#tIcoBau').src=pix('chest'); $('#tIcoNota').src=pix('note');
  $('#tabs').innerHTML = ABAS.map(([id,n,i])=>`<button class="tab" data-aba="${id}" title="${n}">${ico(i)}<span>${n}</span></button>`).join('');
  aplicaConfig();
  $('#tData').textContent = 'Atualizado em '+fmtD(S.hoje);
  pintaMenu();
  rastreia(true);

  document.addEventListener('click', e=>{
    if (e.target.closest('[data-hfala]')){ Leitura.toque(); return; }
    const t=e.target.closest('button, [data-ir], summary'); if (!t) return;
    const d=t.dataset;
    if (d.hpag){ Som.sfx('clique'); Leitura.abre('dia', d.hpag); return; }
    if (d.hresumo){ Som.sfx('clique'); Leitura.abre('mes', d.hresumo); if (aba==='diario') setTimeout(()=>{ const ch=document.querySelector('.hchamada'); if (ch && ch.dataset.hresumo===d.hresumo) ch.remove(); }, 0); return; }
    if (d.hcap){ capVendo=d.hcap; Som.sfx('aba'); render(); return; }
    if (d.hvai){ Leitura.vai(+d.hvai); return; }
    if (d.hpular){ Leitura.pular(); return; }
    if (t.id==='btnComecar'){ Som.tocar(); Som.sfx('aba'); entrar(); return; }
    if (t.id==='btnGuiaT'){ Som.tocar(); Som.sfx('aba'); abreGuia(); return; }
    if (t.id==='btnConfigT'){ Som.tocar(); Som.sfx('aba'); abreConfig(); return; }
    if (t.id==='btnZerarT'){ Som.tocar(); Som.sfx('erro'); zerarPasso1(); return; }
    if (d.acao==='escolher'){ fechaModal(); escolha(); return; }
    if (d.criaHeroi){ cria.heroi=d.criaHeroi; cria.passo='confirma'; Som.sfx('clique'); passoCria(); return; }
    if (d.cria){ if (d.cria==='fim'){ fimCria(); return; } if (d.cria==='nome' && $('#criaNome')) {} cria.passo=d.cria; Som.sfx('clique'); passoCria(); return; }
    if (d.criaPet){ if (d.criaPet==='nenhum'){ cria.pet=null; cria.passo='musica'; } else { if (cria.pet!==d.criaPet) cria.petCor=PET[d.criaPet].cores[0]; cria.pet=d.criaPet; cria.passo='petcor'; } Som.sfx('clique'); passoCria(); return; }
    if (d.criaFaixa!=null){ cria.faixa=+d.criaFaixa; Som.tocar(); Som.trocar(cria.faixa); document.querySelectorAll('.faixa').forEach(b=>b.classList.toggle('on', b.dataset.criaFaixa===d.criaFaixa)); return; }
    if (d.cor){ cria.petCor=d.cor; document.querySelectorAll('.swc').forEach(b=>b.classList.toggle('on', b.dataset.cor===d.cor)); $('#petPrev').src=Shots.pet({tipo:cria.pet, cor:d.cor}); Som.sfx('clique'); return; }
    if (d.pele){ trocaPele(d.pele); return; }
    if (d.pelede){ Som.sfx('clique'); abrePele(d.pelede); return; }
    if (d.arena){ Som.sfx('clique'); abreArena(d.arena); return; }
    if (t.id==='btnSaiArena'){ Som.sfx('clique'); stage && stage.fechaArena(); arenaUI(false); return; }
    if (d.trilha){ Som.sfx('clique'); abreTrilha(d.trilha); return; }
    if (t.id==='minimapa'){ Som.sfx('aba'); aba='diario'; capVendo=null; confirmando=null; render(); $('#conteudo').scrollTop=0; if (ehMovel()) abreFolha(true); return; }
    if (t.id==='btnTrilha'){ Som.sfx('clique'); abreTrilha('dia'); return; }
    if (d.cuidar){ cuidar(d.pet, d.cuidar); return; }
    if (d.dispensar){ petDispensado[d.pet+':'+d.dispensar]=true; petBox(); return; }
    if (d.adotar){ adotar(d.adotar); return; }
    if (d.comprarpet){ comprarPetItem(d.comprarpet); return; }
    if (d.provarpet){ if (!petAtivo()){ Som.sfx('erro'); toast('Adote um pet primeiro pra provar'); return; } const it=PET_ITEM[d.provarpet]; if (provaPet[it.slot]===it.id) delete provaPet[it.slot]; else provaPet[it.slot]=it.id; Som.sfx('equipar'); atualizaPalco(); render(); return; }
    if (d.levar){ arrumaJuntos(); if (S.pets.juntos.length>=MAX_PETS_JUNTOS){ Som.sfx('erro'); toast(`Cabem ${MAX_PETS_JUNTOS} pets com você. Deixe um em casa primeiro.`); return; } S.pets.juntos.push(d.levar); arrumaJuntos(); provaPet={}; Som.sfx('equipar'); marcaSujo(); atualizaPalco(); render(); return; }
    if (d.deixar){ arrumaJuntos(); S.pets.juntos=S.pets.juntos.filter(x=>x!==d.deixar); arrumaJuntos(); provaPet={}; Som.sfx('clique'); marcaSujo(); atualizaPalco(); render(); return; }
    if (d.peteq){ const p=S.pets.possui.find(x=>x.id===d.pet), it=PET_ITEM[d.peteq]; p.equip=p.equip||{}; if (p.equip[it.slot]===it.id) delete p.equip[it.slot]; else p.equip[it.slot]=it.id; Som.sfx('equipar'); marcaSujo(); atualizaPalco(); render(); return; }
    if (d.renomear){ pedeNome('heroi', d.renomear); return; }
    if (d.renomearpet){ pedeNome('pet', d.renomearpet); return; }
    if (d.fecha && !d.acao){ Som.sfx('clique'); fechaModal(); return; }
    if (d.aba==='menu'){ Som.sfx('aba'); vaiMenu(); return; }
    if (d.aba && ehMovel() && folha && d.aba===aba){ abreFolha(false); Som.sfx('aba'); return; }
    if (d.aba){ const saiu = aba==='loja' && d.aba!=='loja' && Object.keys(prova).length; aba=d.aba; confirmando=null; if (saiu){ prova={}; atualizaPalco(); } Som.sfx('aba'); render(); $('#conteudo').scrollTop=0; if (ehMovel()) abreFolha(true); return; }
    if (d.slot){ filtroSlot = filtroSlot===d.slot ? null : d.slot; const id=eqAtivo()[d.slot]; selItem = id || null; Som.sfx('clique'); render(); return; }
    if (d.item){ selItem=d.item; Som.sfx('clique'); render(); return; }
    if (d.floja2) filtroLoja=d.floja2;
    if (d.ir){ const saiu = aba==='loja' && d.ir!=='loja' && Object.keys(prova).length; aba=d.ir; if (saiu){ prova={}; atualizaPalco(); } Som.sfx('aba'); render(); $('#conteudo').scrollTop=0; if (ehMovel()) abreFolha(true); return; }
    if (d.floja){ filtroLoja=d.floja; confirmando=null; Som.sfx('clique'); render(); return; }
    if (d.comprar){ comprar(d.comprar); return; }
    if (d.provar){ provar(d.provar); return; }
    if (d.misterio){ const it=ITEM[d.misterio]; Som.sfx('erro'); toast(`Lendário misterioso. Junte ${num(it.preco)} de ouro pra revelar.`); return; }
    if (d.acao==='tirarProva'){ tirarProva(); return; }
    if (d.heroi){ comprarHeroi(d.heroi); return; }
    if (d.usar){ usarHeroi(d.usar); return; }
    if (d.primeiro){ const id=d.primeiro; S.herois.possui=[id]; S.herois.ativo=id; S.herois.equip[id]={}; Som.sfx('nivel'); marcaSujo(); fechaModal(); $('#modal').classList.remove('largo'); entrar(); toast(HEROI[id].nome+' escolhido.'); return; }
    if (t.id==='btnBau'){ abrirBau(); return; }
    if (t.id==='btnMudo' || d.acao==='mudo'){ Som.tocar(); Som.mudo=!Som.mudo; S.config.mudo=Som.mudo; marcaSujo(); topo(); refazConfig(); return; }
    if (t.id==='btnNuvem'){ Nuvem.tocar(); return; }
    if (t.id==='btnFechaFolha'){ abreFolha(false); Som.sfx('aba'); return; }
    if (t.id==='btnEntrarT' || d.acao==='entrarGoogle'){ fechaModal(); Nuvem.irParaGoogle(false); return; }
    if (d.acao==='sincronizar'){ fechaModal(); Nuvem.sincronizar('botao'); toast('Sincronizando…'); return; }
    if (d.acao==='sairConta'){ Nuvem.sair(); if (!$('#jogo').hidden) render(); refazConfig(); return; }
    if (t.id==='avisoVersaoBtn'){ Versao.atualizar(); return; }
    if (d.acao==='colarCodigo'){ modal(`<form class="campo" data-form="codigo"><label for="codImp">Cole o código do save (começa com DL1 ou DL2)</label><textarea id="codImp" class="cod" rows="5"></textarea><div class="acoes"><button type="button" class="btn" data-fecha="1">Cancelar</button><button class="btn ouro">Importar</button></div></form>`,'Importar save'); return; }
    if (d.acao==='copiarPrompt'){ copiarTexto(PROMPTS.agente, 'Prompt copiado. Mande pro King Bot pra criar o agente.'); return; }
    if (d.acao==='salvar'){ salvar(); return; }
    if (d.acao==='testarSom'){ Som.tocar(); Som.sfx('moeda'); setTimeout(()=>{ const e=Som.estado; toast(e==='running' ? (Som.mudo ? 'Som ligado (música mutada)' : 'Som ligado. Sem som? Suba o volume do aparelho.') : 'Som travado ('+e+'). Toque de novo.', e==='running'?'':'ruim'); }, 450); return; }
    if (d.acao==='baixarCopia'){ baixarCopia(); toast('Cópia baixada.'); return; }
    if (d.acao==='zerar1'){ Som.sfx('erro'); zerarPasso1(); return; }
    if (d.acao==='zerar2'){ Som.sfx('erro'); zerarPasso2(); return; }
    if (d.acao==='equipar'){ equipar(d.id); if (d.fecha) fechaModal(); return; }
    if (d.acao==='remover'){ remover(d.id); return; }
    if (d.acao==='copiar'){ copiarCodigo(); return; }
    if (d.acao==='titulo'){ vaiMenu(); return; }
  });
  document.addEventListener('input', e=>{
    const t=e.target;
    if (t.id==='zerarTxt'){ const b=$('#zerarOk'); if (b) b.disabled = semAcento(t.value)!==semAcento(PALAVRA_ZERAR); return; }
    if (t.dataset.corlivre && cria){ cria.petCor=t.value; document.querySelectorAll('.swc').forEach(b=>b.classList.remove('on')); t.parentElement.classList.add('on'); $('#petPrev').src=Shots.pet({tipo:cria.pet, cor:t.value}); return; }
    if (t.dataset.vol || t.id==='volM' || t.id==='volS'){
      const k = t.dataset.vol || (t.id==='volM'?'musica':'som'); Som[k]=parseFloat(t.value); S.config[k]=Som[k];
      if (k==='som') Som.sfx('clique');
    }
  });
  document.addEventListener('change', e=>{
    const t=e.target; if (!t.dataset || !t.dataset.sel) return;
    if (t.dataset.sel==='faixa'){ Som.tocar(); Som.trocar(+t.value); S.config.faixa=+t.value; marcaSujo(); aplicaCenario(); }
    if (t.dataset.sel==='cenario'){ S.config.cenario=t.value; Som.sfx('clique'); marcaSujo(); aplicaCenario(); }
    t.blur();
  });
  document.addEventListener('submit', e=>{
    const f=e.target; e.preventDefault(); const k=f.dataset.form;
    if (k==='cria-nome'){ cria.nome=$('#criaNome').value.trim(); cria.passo='pet'; Som.sfx('clique'); passoCria(); }
    if (k==='cria-pet'){ cria.petNome=$('#petNome').value.trim()||PET[cria.pet].nome; cria.passo='musica'; Som.sfx('clique'); passoCria(); }
    if (k==='adotar') fimAdocao();
    if (k==='nome'){ const v=$('#nomeNovo').value.trim(); if (v){ if (f.dataset.tipo==='heroi') S.herois.nomes[f.dataset.id]=v; else S.pets.possui.find(p=>p.id===f.dataset.id).nome=v; marcaSujo(); } fechaModal(); atualizaPalco(); render(); }
    if (k==='zerar'){ if (semAcento($('#zerarTxt').value)!==semAcento(PALAVRA_ZERAR)){ Som.sfx('erro'); toast('Digite '+PALAVRA_ZERAR+' pra confirmar','ruim'); return; } zerarJogo(); return; }
    if (k==='codigo'){ try { const d=decodificaCodigo($('#codImp').value); fechaModal(); importaSave(d); } catch(err){ Som.sfx('erro'); toast('Código inválido','ruim'); } return; }
  });
  document.addEventListener('change', e=>{ const t=e.target; if (t.dataset.acao==='carregar' || t.id==='arqTitulo'){ if (t.files[0]) carregar(t.files[0]); t.value=''; } });
  // virada do dia com o app aberto (ou voltando do fundo): meia-noite do aparelho, não do servidor
  const viraDia = ()=>{
    if (S.hoje===hojeReal()) return;
    normaliza(); petDispensado={}; $('#tData').textContent='Atualizado em '+fmtD(S.hoje);
    if (!$('#jogo').hidden && S.herois.ativo && !cria){ const f=document.activeElement, digitando = f && /INPUT|TEXTAREA/.test(f.tagName); atualizaPalco(); topo(); if (!digitando) render(); }
  };
  setInterval(viraDia, 30000);
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) viraDia(); });
  window.addEventListener('pageshow', viraDia);
  $('#modal').addEventListener('click', e=>{ if (e.target.id==='modal' && S.herois.ativo && !(cria && !cria.adocao)) fechaModal(); });
  document.addEventListener('keydown', e=>{ if (e.key==='Escape' && S.herois.ativo) fechaModal(); });
}

window.addEventListener('DOMContentLoaded', ()=>{
  const ret = Nuvem.lerRetorno();
  // token vencido e a pessoa já entrou antes: renova em silêncio antes de abrir (volta em ~1 s)
  if (!ret && Nuvem.podeRenovarSozinho()){ document.body.classList.add('conectando'); Nuvem.irParaGoogle(true); return; }
  try { initThree(); Shots.init(); threeOk=true; } catch(e){ threeOk=false; }
  if (!threeOk){ Shots.shot = ()=> ''; }
  liga();
  Nuvem.iniciar(ret);
  Versao.iniciar();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
});
