const Falas = {
  fila:[], i:0,
  sorteia(lista, x, n){ const t = lista[Math.floor(Math.random()*lista.length)]; return t.replace('{x}', x).replace('{n}', n); },
  nomeDiaria(e){ const m = (S.diarias||[]).find(x=>x.id===e.diaria); return (m && m.nome) || e.txt || e.diaria; },
  // monta o que o herói tem pra falar hoje, do mais importante pro menos
  monta(){
    const hoje = hojeReal(), ontem = addDias(hoje, -1), out = [];
    const mestre = Object.values(S.falas||{}).filter(f=>f.d===hoje).sort((a,b)=>(a.em||0)-(b.em||0));
    mestre.forEach(f=>out.push(f.txt));
    const di = S.log.filter(e=>e.tipo==='diaria' && e.d===ontem);
    const falhou = di.filter(e=>!(e.estrelas>0)), fez = di.filter(e=>e.estrelas>0);
    if (falhou.length > 2) out.push(this.sorteia(FALAS.varias, '', falhou.length));
    else falhou.forEach(e=>out.push(this.sorteia(FALAS.falhou, this.nomeDiaria(e))));
    if (fez.length && !falhou.length && fez.length >= 3) out.push(this.sorteia(FALAS.tudo));
    else if (fez.length){ const e = fez.slice().sort((a,b)=>(b.estrelas||0)-(a.estrelas||0))[0]; out.push(this.sorteia(FALAS.fez, this.nomeDiaria(e))); }
    (S.tarefas||[]).filter(t=>t.d===ontem && t.feita!==true).slice(0,1).forEach(t=>out.push(this.sorteia(FALAS.tarefa, t.txt)));
    (S.tarefas||[]).filter(t=>t.d===ontem && t.feita===true).slice(0,1).forEach(t=>out.push(this.sorteia(FALAS.tarefaFeita, t.txt)));
    (S.derrotados||[]).filter(x=>x.d===ontem || x.d===hoje).forEach(x=>{ const c=(S.chefoes||[]).find(b=>b.id===x.id); out.push(this.sorteia(FALAS.chefao, (c&&c.nome)||x.id)); });
    const hm = humorAtual(); if (hm && hm.hoje && FALAS.humor[hm.emo]) out.push(this.sorteia(FALAS.humor[hm.emo]));
    const fezHoje = S.log.filter(e=>e.tipo==='diaria' && e.d===hoje && e.estrelas>0);
    if (fezHoje.length) out.push(this.sorteia(FALAS.hojeFez, this.nomeDiaria(fezHoje[fezHoje.length-1])));

(function(){
  const P = Stage.prototype, V = new THREE.Vector3();
  // balão de texto (HTML por cima do palco), preso acima da cabeça do herói
  P.falar = function(txt, fim){
    let el = this.falaEl;
    if (!el){ el = this.falaEl = document.createElement('div'); el.className = 'falabalao'; this.el.appendChild(el);
      el.addEventListener('pointerdown', e=>{ e.stopPropagation(); this.falaT = Math.min(this.falaT, 0.25); }); }
    el.textContent = ''; el.hidden = false; el.classList.remove('sai'); void el.offsetWidth; el.classList.add('entra');
    this.falaTxt = String(txt); this.falaN = 0; this.falaT = 2.6 + this.falaTxt.length*0.055; this.falaFim = fim || null; this.sorriso = 0;
  };
  P.falaPasso = function(dt, a){
    const el = this.falaEl; if (!el || el.hidden) return;
    const ocupado = this.cena || this.arena;
    if (ocupado){ el.style.visibility = 'hidden'; return; } el.style.visibility = '';
    // texto vai aparecendo letra por letra, depois conta o tempo
    if (this.falaN < this.falaTxt.length){ this.falaN = Math.min(this.falaTxt.length, this.falaN + dt*38); el.textContent = this.falaTxt.slice(0, Math.ceil(this.falaN)); }
    else { this.falaT -= dt; if (this.falaT <= 0){ el.classList.remove('entra'); el.classList.add('sai'); const f = this.falaFim; this.falaFim = null; setTimeout(()=>{ if (el.classList.contains('sai')) el.hidden = true; }, 220); if (f) f(); } }
    // posição: acima da cabeça, na tela
    const hb = this.hb || { y1:32 }; V.set(0, hb.y1 - 1.5, 0).project(this.camera);
    const w = this.el.clientWidth, h = this.el.clientHeight;
    const x = (V.x*0.5+0.5)*w, y = (-V.y*0.5+0.5)*h;
    el.style.left = Math.max(8, Math.min(w - el.offsetWidth - 8, x - el.offsetWidth*0.5)) + 'px';
    el.style.top = Math.max(6, y - el.offsetHeight - 4) + 'px';
    el.style.setProperty('--rabo', Math.max(14, Math.min(el.offsetWidth-14, x - parseFloat(el.style.left))) + 'px');
  };
  const pose1 = P.poseHeroi;
  P.poseHeroi = function(s, dt, a){
    pose1.call(this, s, dt, a);
    this.falaPasso(dt, a);
    // falando: esconde o balão de emoji
    if (this.balao && this.falaEl && !this.falaEl.hidden) this.balao.visible = false;
  };
})();

// momento em que um id foi criado (uid() = prefixo + Date.now() em base 36 + 4 letras; tarefa = 't' + Date.now() em base 36)
function tsDeId(id, pref, semSufixo){
  if (typeof id!=='string' || !id.startsWith(pref)) return null;
  const m = id.slice(pref.length).match(semSufixo ? /^([0-9a-z]{8})$/ : /^([0-9a-z]{8})[0-9a-z]{4}$/); if (!m) return null;

function consertaDatas(s){

  const fix = (e, t)=>{ if (!e || !e.d) return; const certo = t ? diaLocal(t) : hoje; if (e.d > certo && (t || e.d > hoje)){ e.d = certo; n++; } };

/* ---------- mesclagem: nada de um lado apaga o progresso do outro ---------- */
const DL_UNIAO_ID = ['log','compras','bausAbertos','bausGanhos','habilidades','derrotados','tarefas'];
const DL_UNIAO_VAL = ['mochila','revelados','aplicados','removidos'];
const DL_ULTIMO = ['herois','pets','config','areas','diarias','extras','chefoes','novidades','agenteErros'];
function vazio(k, v){
  if (v==null) return true;
  if (k==='herois') return !v.ativo && !(v.possui||[]).length;
  if (k==='pets') return !(v.possui||[]).length;
  if (Array.isArray(v)) return v.length===0;
  if (typeof v==='object') return Object.keys(v).length===0;
  return false;
}
function uneId(a, b, k){
  const m=new Map(), ch=chaveDe(k);
  (a||[]).forEach(x=>{ if (x && x[ch]!=null) m.set(x[ch], x); });
  (b||[]).forEach(x=>{ if (!x || x[ch]==null) return; const y=m.get(x[ch]); if (!y) m.set(x[ch], x); else if (k==='tarefas' && (x.em||0)>(y.em||0)) m.set(x[ch], x); });

// local = este aparelho, remoto = planilha. primeiraVez: aparelho que nunca sincronizou cede pro que está na conta.
function mesclar(local, remoto, primeiraVez){
  if (!remoto) return local;
  const L=JSON.parse(JSON.stringify(local)), R=JSON.parse(JSON.stringify(remoto));
  // "Recomeçar do zero": cada recomeço é uma geração nova (zerado = quando). Gerações diferentes não se misturam:
  // vale a mais nova inteira, pra o progresso antigo de outro aparelho ou do Drive não voltar.
  // Exceção: aparelho que nunca sincronizou com conta nenhuma junta o que tem com a conta, como antes.
  const zl=L.zerado||0, zr=R.zerado||0;
  if (zl!==zr){
    if (primeiraVez && !zl && !L.nuvem) L.zerado = zr;
    else return zl>zr ? L : R;
  }
  [L,R].forEach(s=>{ s.mod=s.mod||{}; DL_UNIAO_ID.forEach(k=>garanteIds(s[k], k[0]+':', chaveDe(k))); });
  const out = Object.assign({}, L);
  out.mod = Object.assign({}, L.mod);
  DL_UNIAO_ID.forEach(k=>{ out[k] = uneId(L[k], R[k], k); });
  DL_UNIAO_VAL.forEach(k=>{ out[k] = [...new Set([...(L[k]||[]), ...(R[k]||[])])]; });
  DL_ULTIMO.forEach(k=>{
    const ml = primeiraVez ? 0 : (L.mod[k]||0), mr = R.mod[k]||0;
    let usaR;
    // aparelho novo cede pro que está na conta; depois disso vale o mais recente (lista esvaziada de propósito também vale)
    if (primeiraVez) usaR = !vazio(k, R[k]) || (vazio(k, L[k]) && mr>ml);
    else if (mr===ml) usaR = !vazio(k, R[k]);
    else usaR = mr>ml;
    const venc = usaR ? R : L, perd = usaR ? L : R;
    out[k] = venc[k]; out.mod[k] = Math.max(ml, mr);
    if (k==='herois' && out[k] && perd[k]){ const h=out[k]; h.possui=[...new Set([...(h.possui||[]), ...(perd[k].possui||[])])]; h.equip=Object.assign({}, perd[k].equip, h.equip); h.nomes=Object.assign({}, perd[k].nomes, h.nomes); h.pele=Object.assign({}, perd[k].pele, h.pele); if (!h.ativo) h.ativo=perd[k].ativo||null; }
    if (k==='pets' && out[k] && perd[k]){ const p=out[k]; p.possui=uneId(p.possui, perd[k].possui); if (!p.desde || (perd[k].desde && perd[k].desde<p.desde)) p.desde = perd[k].desde || p.desde; if (!p.ativo) p.ativo=perd[k].ativo||null; }
  });
  // páginas da história escritas pelo Mestre: por dia/mês, vale a mais nova
  out.capitulos = Object.assign({}, L.capitulos||{}); Object.entries(R.capitulos||{}).forEach(([k,v])=>{ const a=out.capitulos[k]; if (!a || (v&&v.em||0)>(a.em||0)) out.capitulos[k]=v; });
  out.falas = Object.assign({}, R.falas||{}, L.falas||{});
  // humor do dia (vem do agente): por dia, vale o mais novo
  out.humor = Object.assign({}, L.humor||{}); Object.entries(R.humor||{}).forEach(([k,v])=>{ const a=out.humor[k]; if (!a || (v&&v.em||0)>(a.em||0)) out.humor[k]=v; });
  out.hoje = [L.hoje, R.hoje].filter(Boolean).sort().pop() || L.hoje;
  out.rev = Math.max(L.rev||0, R.rev||0);
  const rem = new Set(out.removidos||[]);
  if (rem.size) out.log = out.log.filter(e=>!rem.has(e.id));
  out.log.sort((a,b)=> (a.d||'').localeCompare(b.d||''));
  return out;
}

    const dados=g(col.dados);

function aplicaAgente(linhas){

    try {

    } catch(e){
      S.agenteErros = S.agenteErros.filter(x=>x.id!==l.id).concat([{ id:l.id, linha:l.linha, erro:String(e && e.message || e) }]).slice(-20);

    }

  }

}
function obj(d, campos){ if (!d || typeof d!=='object' || Array.isArray(d)) throw new Error('dados precisa ser um JSON {…}'); (campos||[]).forEach(c=>{ if (d[c]==null || d[c]==='') throw new Error('faltou "'+c+'"'); }); return d; }

      const e=Object.assign({ d:d.d||hoje, tipo:'extra' }, d, { area:d.area, xp, id:'ag:'+l.id }); if (!e.heroi && heroi) e.heroi=heroi;
      if (d.ouro!=null){ const o=Number(d.ouro); if (!isFinite(o)) throw new Error('ouro inválido (use número, ex.: "ouro":500)'); e.ouro=o; }
      // uma diária vale uma vez por dia: registro novo da mesma diária no mesmo dia substitui o anterior (não soma)
      let jaFeita=false; if (e.tipo==='diaria' && e.diaria){ S.removidos = S.removidos || []; S.log = S.log.filter(x=>{ if (x.tipo==='diaria' && x.diaria===e.diaria && x.d===e.d){ if (x.estrelas>0) jaFeita=true; if (x.id) S.removidos.push(x.id); return false; } return true; }); }
      S.log.push(e); if (e.tipo==='diaria' && e.estrelas>0 && !jaFeita && festaRecente(e.d)){ const m=S.diarias.find(x=>x.id===e.diaria); Festa.add('missao', (m&&m.nome)||e.txt, { estrelas:e.estrelas }); } return; }
    case 'tarefa': { obj(d,['txt']); const id=d.id||('ag'+hashTxt(l.id)), dia=d.d||hoje; if (!S.tarefas.some(t=>t.id===id || (t.d===dia && normTxt(t.txt)===normTxt(d.txt)))) S.tarefas.push({ id, d:d.d||hoje, txt:String(d.txt), area:d.area&&AREA[d.area]?d.area:undefined, feita:null, em:agora }); return; }
    case 'tarefa_feita': { obj(d,['id']); const t=S.tarefas.find(x=>x.id===d.id); if (!t) throw new Error('tarefa "'+d.id+'" não existe'); t.feita = d.feita===false ? false : true; t.em=agora;
      S.log=S.log.filter(e=>!(e.tipo==='tarefa'&&e.tarefa===t.id)); if (t.feita){ S.log.push({ id:'ag:'+l.id, d:t.d, area:t.area||null, txt:t.txt, xp:XP_TAREFA, tipo:'tarefa', tarefa:t.id, heroi }); if (festaRecente(t.d)) Festa.add('tarefa', t.txt); } return; }
    case 'area': { obj(d,['id','nome']); const id=String(d.id).trim(); if (!/^[a-z0-9_-]{1,24}$/.test(id)) throw new Error('id da área: só letras minúsculas, números, - ou _ (ex.: "saude")');
      const ico = ICOS_AREA.includes(d.ico) ? d.ico : 'star'; const novo=!AREA[id]; upsert(S.areas, { id, nome:String(d.nome).slice(0,24), ico }); S.mod.areas=agora; return novo ? { novidade:'Atributo novo: '+d.nome } : null; }
    case 'area_remover': { obj(d,['id']); S.areas=S.areas.filter(x=>x.id!==d.id); S.mod.areas=agora; return; }
    case 'diaria': { obj(d,['id','area','nome']); areaOk(d.area); upsert(S.diarias, d); S.mod.diarias=agora; return; }
    case 'diaria_remover': { obj(d,['id']); S.diarias=S.diarias.filter(x=>x.id!==d.id); S.mod.diarias=agora; return; }
    case 'extra': { obj(d,['id','area','nome']); areaOk(d.area); upsert(S.extras, d); S.mod.extras=agora; return; }
    case 'chefao': { obj(d,['id','nome','meta','area']); areaOk(d.area); const novo=!S.chefoes.some(c=>c.id===d.id); upsert(S.chefoes, d); S.mod.chefoes=agora; return novo ? { novidade:'Chefão novo: '+d.nome } : null; }
    case 'chefao_remover': { obj(d,['id']); S.chefoes=S.chefoes.filter(x=>x.id!==d.id); S.mod.chefoes=agora; return; }
    case 'chefao_derrotado': { obj(d,['id']); if (!S.derrotados.some(x=>x.id===d.id)){ const c=S.chefoes.find(x=>x.id===d.id); S.derrotados.push({ id:d.id, d:d.d||hoje });
      S.log.push({ id:'ag:'+l.id, d:d.d||hoje, area:(c&&c.area)||null, txt:'Chefão derrotado: '+((c&&c.nome)||d.id), xp:d.xp!=null?Number(d.xp):300, tipo:'chefao', heroi }); if (festaRecente(d.d)) Festa.add('chefao', (c&&c.nome)||d.id, { id:d.id, xp:d.xp!=null?Number(d.xp):300 }); return { novidade:'Chefão derrotado: '+((c&&c.nome)||d.id) }; } return; }
    case 'habilidade': { const h = obj(d,['nome','area']); areaOk(h.area); S.habilidades.push(Object.assign({ id:'ag:'+l.id, area:h.area, nome:String(h.nome), d:h.d||hoje }, h.inicial?{inicial:true}:{})); return { novidade:'Habilidade nova: '+h.nome }; }
    case 'bau': { S.bausGanhos.push({ id:'ag:'+l.id, d:(d&&d.d)||hoje }); return { novidade:'Novo baú pra abrir' }; }
    case 'novidade': { const t = typeof d==='string' ? d : obj(d,['txt']).txt; return { novidade:String(t) }; }
    case 'capitulo': { obj(d,['texto']); const k = d.mes ? String(d.mes).slice(0,7) : (d.d||hoje); if (!/^\d{4}-\d{2}(-\d{2})?$/.test(k)) throw new Error('use "d":"AAAA-MM-DD" (página do dia) ou "mes":"AAAA-MM" (resumo do mês)');
      S.capitulos = S.capitulos || {}; S.capitulos[k] = { titulo: d.titulo ? String(d.titulo).slice(0,60) : '', texto: String(d.texto).slice(0,1200), em: agora }; return; }
    case 'humor': { obj(d); const dia=d.d||hoje; if (!/^\d{4}-\d{2}-\d{2}$/.test(dia)) throw new Error('use "d":"AAAA-MM-DD"');
      const num=(k)=>{ if (d[k]==null || d[k]==='') return null; const n=Number(d[k]); if (!isFinite(n) || n<-3 || n>3) throw new Error('"'+k+'" vai de -3 a 3'); return Math.round(n); };
      const en=num('energia'), af=num('afeto'), emo=d.emocao!=null && d.emocao!=='' ? String(d.emocao).toLowerCase() : null;
      if (emo && !EMOCOES[emo]) throw new Error('emocao "'+emo+'" não existe (use: '+Object.keys(EMOCOES).join(', ')+')');
      if (en==null && af==null && !emo) throw new Error('mande "energia", "afeto" ou "emocao"');
      S.humor = S.humor || {}; S.humor[dia] = Object.assign({ em: agora }, en!=null?{energia:en}:{}, af!=null?{afeto:af}:{}, emo?{emocao:emo}:{}); return; }
    case 'fala': { obj(d,['txt']); const dia=d.d||hoje; if (!/^\d{4}-\d{2}-\d{2}$/.test(dia)) throw new Error('use "d":"AAAA-MM-DD"');
      S.falas = S.falas || {}; S.falas['ag:'+l.id] = { d:dia, txt:String(d.txt).slice(0,140), em:agora };
      Object.keys(S.falas).forEach(k=>{ if (S.falas[k].d < addDias(hoje,-14)) delete S.falas[k]; }); return; }
    case 'save_importar': { obj(d,['log']); importaSave(d, true); return; }
    default: throw new Error('tipo "'+l.tipo+'" desconhecido');
  }
}

/* ---------- importar save antigo (.json, código DL1/DL2 ou linha do agente) ---------- */
function decodificaCodigo(txt){
  const t=String(txt||'').trim(); const m=t.match(/^DL([12]):([A-Za-z0-9+/=\s]+)$/); if (!m) throw new Error('código inválido');
  return JSON.parse(decodeURIComponent(escape(atob(m[2].replace(/\s+/g,'')))));
}
function importaSave(d, silencioso){
  if (d.jogo==='zaza-quest'||d.jogo==='saga-diaria') d.jogo='daily-legends';
  if (!d.log && !d.herois) throw new Error('não é um save do Daily Legends');
  const base = { jogo:'daily-legends', log:[], compras:[], mochila:[], bausAbertos:[], habilidades:[], derrotados:[], tarefas:[] };
  const imp = Object.assign(base, JSON.parse(JSON.stringify(d)), { jogo:'daily-legends' });
  imp.zerado = S.zerado || 0; delete imp.ignorarAgente; // save importado entra na geração atual (não desfaz um recomeço)
  if (imp.bausGanhos==null){ imp.bausGanhos=[]; const n=(imp.baus||0)+(imp.bausAbertos||[]).length; for (let i=0;i<n;i++) imp.bausGanhos.push({ id:'leg'+i, d:imp.hoje||hojeReal() }); }
  const agora=Date.now(); imp.mod={};
  DL_ULTIMO.forEach(k=>{ if (!vazio(k, imp[k])) imp.mod[k]=agora+1; });
  rastreia();
  S = mesclar(S, imp, false);
  normaliza(); rastreia(true); Nuvem.mudou();
  if (!silencioso){ aplicaConfig(); entrar(); toast('Save importado e juntado ao seu progresso'); }
}

/* ---------- rastreio de mudanças (data por campo, pra mesclar entre aparelhos) ---------- */
let DL_SNAP = {};
function rastreia(soFoto){
  S.mod = S.mod || {};
  DL_ULTIMO.forEach(k=>{ const v=JSON.stringify(S[k]===undefined?null:S[k]); if (!soFoto && DL_SNAP[k]!==undefined && DL_SNAP[k]!==v) S.mod[k]=Date.now(); DL_SNAP[k]=v; });
}

/* ---------- Nuvem ---------- */
const Nuvem = {

  mudou(){
    rastreia(); S.rev=(S.rev||0)+1; this.salvarLocal(); lsSet('dl.pendente', true);

  /* ----- login por redirecionamento ----- */

  irParaGoogle(silencioso, trocarConta){
    if (!this.configurado()){ modal(`<p>O login com Google ainda não foi configurado neste site.</p><p class="fraco">Quem publicou o jogo precisa colar o Client ID no arquivo config.js (guia, parte 2). Enquanto isso o jogo salva só neste aparelho.</p><div class="acoes"><button class="btn ouro" data-fecha="1">Entendi</button></div>`,'Falta configurar'); return; }
    if (!navigator.onLine){ toast('Sem internet agora. O jogo continua salvando no aparelho.'); return; }
    const st = uid('s'); const conta=this.conta();
    lsSet(DL_LS.oauth, { st, silencioso:!!silencioso, em:Date.now() });
    lsSet(DL_LS.tent, { em:Date.now(), silencioso:!!silencioso });
    if (typeof S!=='undefined') this.salvarLocal();
    const p = new URLSearchParams({ client_id:DL_CFG.googleClientId, redirect_uri:this.redirectUri(), response_type:'token', scope:DL_ESCOPOS, include_granted_scopes:'true', state:st });
    if (silencioso) p.set('prompt','none');

    if (conta && conta.email && !trocarConta) p.set('login_hint', conta.email);

  },
  // roda antes de tudo: lê a resposta do Google no #fragmento
  lerRetorno(){
    const h = location.hash || '';
    if (!/(^#|&)(state|access_token|error)=/.test(h)) return null;
    const q = new URLSearchParams(h.slice(1));
    history.replaceState(null, '', location.pathname + location.search);
    const esp = lsGet(DL_LS.oauth); lsSet(DL_LS.oauth, null);
    if (!esp || esp.st !== q.get('state')) return { erro:'state' };
    if (q.get('error')) return { erro:q.get('error'), silencioso:esp.silencioso };
    const escopo = q.get('scope') || '';
    if (escopo && !escopo.includes('drive.file')) return { erro:'escopo' };
    lsSet(DL_LS.token, { access_token:q.get('access_token'), exp:Date.now() + (Number(q.get('expires_in'))||3600)*1000 - 120000 });
    lsSet(DL_LS.tent, null);
    return { ok:true, silencioso:esp.silencioso };
  },
  // renovação silenciosa: só tenta de novo depois de 3 min, e não insiste se o Google pediu interação
  podeRenovarSozinho(){

    const c=this.conta(); if (!c || this.token()) return false;
    const t=lsGet(DL_LS.tent); if (t && Date.now()-t.em < 3*60*1000) return false;

  sair(){ lsSet(DL_LS.token,null); lsSet(DL_LS.conta,null); lsSet(DL_LS.plan,null); lsSet(DL_LS.sinc,null); lsSet('dl.precisaEntrar',null); this.estado='local'; this.pinta(); toast('Saiu da conta. O progresso continua neste aparelho.'); },

  /* ----- API ----- */
  async api(url, op){
    const tk=this.token(); if (!tk){ const e=new Error('token'); e.token=true; throw e; }
    op=op||{}; op.headers=Object.assign({ Authorization:'Bearer '+tk }, op.body&&typeof op.body==='string'?{ 'Content-Type':'application/json' }:{}, op.headers||{});
    const ab = new AbortController(), tm = setTimeout(()=>ab.abort(), 25000); op.signal = ab.signal;
    let r; try { r = await fetch(url, op); } catch(e){ throw new Error(e.name==='AbortError' ? 'o Google demorou demais pra responder' : 'sem conexão com o Google'); } finally { clearTimeout(tm); }
    if (r.status===401){ lsSet(DL_LS.token,null); const e=new Error('token'); e.token=true; throw e; }
    if (!r.ok){ let t=''; try{ t=await r.text(); }catch(_){} throw new Error('Google '+r.status+': '+t.slice(0,200)); }
    return r.status===204 ? null : r.json();
  },
  async pegaEmail(){
    const u = await this.api('https://openidconnect.googleapis.com/v1/userinfo');
    lsSet(DL_LS.conta, { email:u.email||'', nome:u.given_name||u.name||'' });
  },
  async achaOuCriaPlanilha(){
    const salvo=lsGet(DL_LS.plan); const conta=this.conta();
    if (salvo && salvo.email===(conta&&conta.email)) return salvo.id;
    const D='https://www.googleapis.com/drive/v3/files';
    const q=encodeURIComponent, nm=t=>String(t).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const ach = await this.api(`${D}?q=${q(`name='${nm(DL_CFG.nomePlanilha)}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`)}&fields=files(id,name,createdTime)&orderBy=createdTime&spaces=drive`);
    let id = ach.files && ach.files[0] && ach.files[0].id, criada=false;
    if (!id){
      const pastas = await this.api(`${D}?q=${q(`name='${nm(DL_CFG.nomePasta)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)&spaces=drive`);
      let pasta = pastas.files && pastas.files[0] && pastas.files[0].id;

      id = (await this.api(D+'?fields=id', { method:'POST', body:JSON.stringify({ name:DL_CFG.nomePlanilha, mimeType:'application/vnd.google-apps.spreadsheet', parents:[pasta], description:'Save do Daily Legends. O jogo escreve nas abas save e resumo; o agente do King Bot escreve só na aba agente.' }) })).id;

  async montaAbas(id){

    const info = await this.api(SH+'?fields=sheets.properties');
    const primeira = info.sheets[0].properties.sheetId;
    const r = await this.api(SH+':batchUpdate', { method:'POST', body:JSON.stringify({ requests:[
      { updateSheetProperties:{ properties:{ sheetId:primeira, title:ABA.leia }, fields:'title' } },
      { addSheet:{ properties:{ title:ABA.resumo } } },
      { addSheet:{ properties:{ title:ABA.agente, gridProperties:{ frozenRowCount:1 } } } },
      { addSheet:{ properties:{ title:ABA.save } } }
    ] }) });
    const ids = r.replies.slice(1).map(x=>x.addSheet.properties.sheetId);
    await this.api(SH+':batchUpdate', { method:'POST', body:JSON.stringify({ requests:[
      { addProtectedRange:{ protectedRange:{ range:{ sheetId:ids[2] }, description:'Save do jogo: não edite (o jogo reescreve)', warningOnly:true } } },
      { addProtectedRange:{ protectedRange:{ range:{ sheetId:ids[0] }, description:'Resumo: o jogo reescreve a cada sincronização', warningOnly:true } } }
    ] }) });
    await this.api(SH+'/values:batchUpdate', { method:'POST', body:JSON.stringify({ valueInputOption:'RAW', data:[
      { range:`'${ABA.leia}'!A1`, values:LEIA_ME.map(l=>[l]) },
      { range:`'${ABA.agente}'!A1:E1`, values:[['id','quando','tipo','dados','nota']] }
    ] }) });

  /* ----- sincronizar: puxa, junta, aplica o agente, escreve ----- */
  async sincronizar(motivo){
    if (!this.conta()) return;
    if (this.ocupado){ this.denovo=true; return; }
    if (!navigator.onLine){ this.estado='offline'; this.pinta(); return; }
    if (!this.token()){ this.estado='reconectar'; this.pinta(); return; }
    this.ocupado=true; this.estado='sync'; this.pinta();
    try {
      if (!this.conta().email) await this.pegaEmail();
      const id = await this.achaOuCriaPlanilha();
      const SH='https://sheets.googleapis.com/v4/spreadsheets/'+id;
      const lido = await this.api(SH+`/values:batchGet?ranges=${encodeURIComponent(`'${ABA.save}'!A1:A2000`)}&ranges=${encodeURIComponent(`'${ABA.agente}'!A1:F5000`)}&majorDimension=ROWS`);
      const vs = (lido.valueRanges[0].values||[]), va = (lido.valueRanges[1].values||[]);
      this.partesAntes = vs.length;
      let remoto=null;
      if (vs.length>2){ try { remoto = JSON.parse(vs.slice(2).map(r=>r[0]||'').join('')); } catch(e){ throw new Error('o save da planilha está corrompido (aba save foi editada?)'); } }
      const antes = JSON.stringify(S);
      rastreia();
      const primeiraVez = !lsGet(DL_LS.sinc);
      if (remoto) S = mesclar(S, remoto, primeiraVez);
      normaliza(); rastreia(true);
      const linhasAg = linhasAgente(va);
      // depois de "Recomeçar do zero": tudo o que já estava na aba agente fica como aplicado e não volta (ex.: ouro de teste)
      if (S.ignorarAgente){ S.aplicados = [...new Set([...(S.aplicados||[]), ...linhasAg.map(l=>l.id)])]; S.agenteErros=[]; delete S.ignorarAgente; S.mod.agenteErros=Date.now(); }
      const novasAg = aplicaAgente(linhasAg);
      S.nuvem = true;
      normaliza(); rastreia(true);
      const mudouAqui = JSON.stringify(S)!==antes;
      // escreve save (uma chamada só, com sobra em branco pra apagar pedaços antigos) e resumo
      const txt = JSON.stringify(Object.assign({}, S, { salvoEm:new Date().toISOString() }));
      const partes=[]; for (let i=0;i<txt.length;i+=PEDACO) partes.push([txt.slice(i,i+PEDACO)]);
      const linhas = [['NÃO EDITE ESTA ABA. Save do Daily Legends (o jogo reescreve). O agente escreve só na aba "agente".'], [JSON.stringify({ v:2, rev:S.rev||0, em:new Date().toISOString(), partes:partes.length })], ...partes];
      while (linhas.length < this.partesAntes) linhas.push(['']);
      const res = linhasResumo(); while (res.length<400) res.push(['','','','','','']);
      const dados = [
        { range:`'${ABA.save}'!A1:A${linhas.length}`, values:linhas },
        { range:`'${ABA.resumo}'!A1:F400`, values:res.slice(0,400).map(r=>{ const x=r.slice(0,6).map(v=>v==null?'':String(v)); while (x.length<6) x.push(''); return x; }) }
      ];
      // leia-me desatualizado (planilha criada por versão antiga): reescreve com as instruções novas
      const leiaChave = id+':'+LEIA_VER;
      if (lsGet('dl.leiaVer')!==leiaChave){ const lm=LEIA_ME.map(l=>[l]); while (lm.length<90) lm.push(['']); dados.push({ range:`'${ABA.leia}'!A1:A${lm.length}`, values:lm }); }
      await this.api(SH+'/values:batchUpdate', { method:'POST', body:JSON.stringify({ valueInputOption:'RAW', data:dados }) });
      lsSet('dl.leiaVer', leiaChave);
      this.salvarLocal(); lsSet(DL_LS.sinc, Date.now()); lsSet('dl.pendente', false); lsSet('dl.precisaEntrar', null);
      this.ultimoPull=Date.now(); this.estado='ok'; this.erro='';
      if (!S.herois.ativo && !$('#jogo').hidden && typeof cria!=='undefined' && !cria){ aplicaConfig(); topo(); toast('O jogo foi recomeçado do zero.'); entrar(); }
      else if ((mudouAqui || novasAg) && !$('#jogo').hidden && typeof cria!=='undefined' && !cria){ aplicaConfig(); atualizaPalco(); topo(); render(); if (S.novidades && S.novidades.length && $('#modal').hidden) entrar(); }
      else if (!$('#titulo').hidden){ pintaMenu(); refazConfig(); }
    } catch(e){
      if (e.token){ this.estado='reconectar'; }
      else { this.estado='erro'; this.erro=String(e.message||e); console.warn(e); }
    } finally {
      this.ocupado=false; this.pinta();
      if (this.denovo){ this.denovo=false; setTimeout(()=>this.sincronizar(), 1500); }
    }
  },

  /* ----- botão de status ----- */
  pinta(){
    const b=document.getElementById('btnNuvem'); if (!b) return;
    if (!this.conta()) this.estado='local';
    else if (this.estado==='local') this.estado = this.token() ? 'ok' : 'reconectar';
    const pend = lsGet('dl.pendente');
    const T = { local:['Entrar','Salvo só neste aparelho. Toque pra entrar com Google.'], sync:['Salvando…','Sincronizando com o Google Drive'], ok:[pend?'Na nuvem •':'Na nuvem','Salvo no Google Drive'],
      offline:['Sem rede','Sem internet: salvo no aparelho, sobe quando voltar'], reconectar:['Reconectar','Toque pra reconectar com o Google. Nada se perde: está salvo no aparelho.'], erro:['Erro ☁','Não deu pra sincronizar: '+this.erro] }[this.estado];
    b.textContent=T[0]; b.title=T[1]; b.className='btn ouro nuvem n-'+this.estado+(pend&&this.estado!=='sync'?' pendente':'');
    const c=this.conta(), txt = c ? ('Conta: '+(c.email||'Google')) : (this.configurado() ? 'Entre com Google pra guardar seu jogo no seu Drive.' : 'Login com Google ainda não configurado: salvando só neste aparelho.');
    document.querySelectorAll('.tConta').forEach(t=>t.textContent=txt);
    const be=document.getElementById('btnEntrarT'); if (be) be.hidden = !!this.conta();
  },
  tocar(){
    if (this.estado==='local') return this.irParaGoogle(false);
    if (this.estado==='reconectar') return this.irParaGoogle(false);
    if (this.estado==='erro') { modal(`<p>Não deu pra sincronizar com o Google Drive.</p><p class="fraco">${esc(this.erro)}</p><p class="fraco">Seu progresso está salvo neste aparelho.</p><div class="acoes"><button class="btn" data-fecha="1">Fechar</button><button class="btn ouro" data-acao="sincronizar">Tentar de novo</button></div>`,'Nuvem'); return; }
    this.sincronizar('botao');
  },

  /* ----- início ----- */
  iniciar(retorno){
    if (retorno){
      if (retorno.ok){ lsSet('dl.precisaEntrar', null); if (!this.conta()) lsSet(DL_LS.conta, { email:'' }); }
      else if (retorno.erro==='escopo'){ setTimeout(()=>modal(`<p>Pra guardar o jogo no seu Drive, marque a caixinha de permissão do <b>Google Drive</b> na tela do Google.</p><p class="fraco">O jogo só enxerga os arquivos que ele mesmo cria (a pasta Daily Legends).</p><div class="acoes"><button class="btn" data-fecha="1">Agora não</button><button class="btn ouro" data-acao="entrarGoogle">Tentar de novo</button></div>`,'Falta uma permissão'), 300); }
      else if (retorno.silencioso && /interaction_required|login_required|consent_required|account_selection_required/.test(retorno.erro)) lsSet('dl.precisaEntrar', true);
      else if (retorno.erro==='access_denied') setTimeout(()=>toast('Login cancelado. O jogo continua salvando no aparelho.'), 300);
      else if (retorno.erro && retorno.erro!=='state') setTimeout(()=>toast('Login do Google: '+retorno.erro,'ruim'), 300);
    }
    this.pinta();
    if (this.conta()){ if (this.token()) this.sincronizar('abrir'); else { this.estado='reconectar'; this.pinta(); } }
    window.addEventListener('online', ()=>{ if (this.conta()) this.sincronizar('online'); else this.pinta(); });
    window.addEventListener('offline', ()=>{ if (this.conta()){ this.estado='offline'; this.pinta(); } });
    const guarda=()=>{ if (typeof S!=='undefined'){ rastreia(); this.salvarLocal(); } };
    window.addEventListener('pagehide', guarda);
    document.addEventListener('visibilitychange', ()=>{
      if (document.hidden){ guarda(); if (this.conta() && this.token() && lsGet('dl.pendente')) this.sincronizar('saindo'); return; }
      if (!this.conta()) return;
      if (this.token()){ if (Date.now()-this.ultimoPull > 5*60*1000 || lsGet('dl.pendente')) this.sincronizar('voltou'); }
      else if (this.podeRenovarSozinho() && $('#modal').hidden && !(typeof cria!=='undefined' && cria)) this.irParaGoogle(true);
    });
    // guarda mudanças que não passaram por marcaSujo (ex.: volume)
    setInterval(()=>{ if (typeof S==='undefined') return; const a=JSON.stringify(S.config); if (a!==DL_SNAP.config){ this.mudou(); } }, 15000);
  }
};

/* ---------- aba resumo (pro agente ler sem abrir o JSON) ---------- */
function linhasResumo(){
  const c=calc(), g=nivelDe(c.xpTotal), h=heroAtivo(), R=[];
  R.push(['Daily Legends: resumo pro agente. O jogo reescreve esta aba a cada sincronização; não edite. Pra mudar algo, escreva na aba "agente" (veja leia-me).']);
  R.push(['atualizado em', horaLocal(), 'dia do jogo', S.hoje, 'recomeçou do zero em', S.zerado ? horaLocal(S.zerado) : 'nunca']);
  R.push(['herói', h ? nomeH(h.id) : '(ainda não criado)', 'classe', h ? h.nome : '', 'nível do herói', h ? nivelDe(c.heroi[h.id]||0).n : '']);
  R.push(['nível geral', g.n, 'XP total', c.xpTotal, 'ouro', c.ouro]);
  R.push(['sequência (dias)', c.seq, 'baús fechados', S.baus, 'pets', (S.pets.possui||[]).map(p=>p.nome+' ('+p.tipo+(p.real?', real':'')+')').join(', ')]);
  R.push([]); R.push(['ÁREAS', 'id', 'nível', 'XP', 'último dia com XP', 'cai de nível em']); if (!areasJogo().length) R.push(['(nenhuma ainda: crie com tipo area)']);
  areasJogo().forEach(a=>{ const pq=proxQueda(c, a.id); R.push([a.nome, a.id, nivelDe(c.area[a.id]||0).n, c.area[a.id]||0, c.ultima[a.id]||'', pq ? pq.em+' dia(s)' : '']); });
  R.push([]); R.push(['DIÁRIAS', 'id', 'área', 'nome', 'mínima', '3 estrelas']);
  S.diarias.forEach(m=>R.push(['', m.id, m.area, m.nome+(m.semanal?` (${m.semanal}x/semana)`:''), m.minima||'', m.tres||'']));
  R.push([]); R.push(['EXTRAS', 'id', 'área', 'nome', 'xp']);
  S.extras.forEach(m=>R.push(['', m.id, m.area, m.nome, m.xp||'']));
  R.push([]); R.push(['CHEFÕES', 'id', 'área', 'nome', 'meta', 'progresso']);
  S.chefoes.forEach(b=>{ const morto=S.derrotados.some(x=>x.id===b.id); const pr = b.tipo==='valor' ? `${b.atual}/${b.alvo}` : b.tipo==='fases' ? (b.fases||[]).filter(f=>f.ok).length+'/'+(b.fases||[]).length+' fases' : b.tipo==='data' ? 'até '+b.data : ''; R.push(['', b.id, b.area, b.nome, b.meta, (morto?'DERROTADO ':'')+pr]); });
  R.push([]); R.push(['TAREFAS', 'id', 'dia', 'texto', 'status']);
  S.tarefas.filter(t=>t.d>=addDias(S.hoje,-7)).forEach(t=>R.push(['', t.id, t.d, t.txt, t.feita===true?'feita':t.feita===false?'não feita':'aberta']));
  R.push([]); R.push(['HUMOR (últimos 7 dias)', 'dia', 'energia', 'afeto', 'emoção no herói']);
  Object.keys(S.humor||{}).filter(k=>k>=addDias(S.hoje,-7)).sort().reverse().forEach(k=>{ const h=S.humor[k]; R.push(['', k, h.energia!=null?h.energia:'', h.afeto!=null?h.afeto:'', emocaoDe(h)]); });
  R.push([]); R.push(['HABILIDADES', 'área', 'nome', 'desde']);
  S.habilidades.forEach(x=>R.push(['', x.area, x.nome, x.d||'']));
  R.push([]); R.push(['LINHAS DO AGENTE', 'aplicadas', (S.aplicados||[]).length, 'última', (S.aplicados||[]).slice(-1)[0]||'']);
  (S.agenteErros||[]).forEach(e=>R.push(['ERRO', e.id, 'linha '+(e.linha||''), e.erro]));
  R.push([]); R.push(['ÚLTIMOS REGISTROS', 'dia', 'área', 'texto', 'xp', 'estrelas']);
  S.log.slice(-60).reverse().forEach(e=>R.push(['', e.d, e.area, e.txt, e.xp||0, e.estrelas!=null?e.estrelas:'']));
  return R;
}

/* ---------- atualização do app (service worker) ---------- */
const Versao = {
  reg:null, recarregando:false,
  iniciar(){
    if (!('serviceWorker' in navigator) || !(location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) return;
    navigator.serviceWorker.register('sw.js').then(reg=>{
      this.reg=reg;
      if (reg.waiting && navigator.serviceWorker.controller) this.mostra();
      reg.addEventListener('updatefound', ()=>{ const w=reg.installing; w && w.addEventListener('statechange', ()=>{ if (w.state==='installed' && navigator.serviceWorker.controller) this.mostra(); }); });
      document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) reg.update().catch(()=>{}); });
      setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if (this.recarregando) return; this.recarregando=true; location.reload(); });
  },
  mostra(){ const a=document.getElementById('avisoVersao'); if (a) a.hidden=false; },
  atualizar(){
    if (typeof S!=='undefined'){ rastreia(); Nuvem.salvarLocal(); }
    const w=this.reg && this.reg.waiting;
    if (w) w.postMessage({ tipo:'atualizar' }); else location.reload();
  }
};

/* ===== História: cada dia é uma página, cada mês é um capítulo, num mapa =====
   O jogo escreve sozinho a partir do log (o que a pessoa fez ou deixou de fazer).
   O Mestre pode escrever a dele com o comando "capitulo" (S.capitulos[dia ou mês]); a dele vale no lugar da do jogo.
   Texto curto de propósito: página = até 5 frases, resumo do mês = números + até 3 frases. */

// lugar do reino de cada área, pelo ícone (a área é criada pelo jogador, o ícone é o que dá pra saber)
const LUGAR_ICO = {
  heart:['f','Fonte da Vida'], coin:['m','Cofre do Reino'], sword:['f','Forja'], phone:['f','Torre dos Arautos'], bubble:['m','Porto das Línguas'],
  brush:['m','Ateliê das Cores'], pawn:['m','Salão do Tabuleiro'], house:['m','Lar'], book:['f','Biblioteca Antiga'], star:['m','Campo das Estrelas'],
  scroll:['f','Torre dos Escribas'], skull:['f','Cripta'], chest:['f','Casa do Tesouro'], helm:['m','Quartel'], trophy:['f','Arena'],
  mapa:['f','Estrada Real'], flame:['f','Fornalha'], note:['m','Teatro']
};
function lugar(areaId){ const a=AREA[areaId]; const l=LUGAR_ICO[a && a.ico] || ['m','Campo das Estrelas']; const f=l[0]==='f';
  return { em:(f?'na ':'no ')+l[1], de:(f?'da ':'do ')+l[1], o:(f?'a ':'o ')+l[1] }; }
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MesNome = ym=>{ const [y,m]=ym.split('-').map(Number); return MESES[m-1]+' de '+y; };
const cap1 = s=> s ? s[0].toUpperCase()+s.slice(1) : s;
const artMin = s=> String(s||'').replace(/^(O|A|Os|As) /, m=>m.toLowerCase()); // "enfrentou o Rei", não "enfrentou O Rei"

// sorteio fixo por dia: a mesma página sempre conta a mesma história
function rngDe(txt){ let h=2166136261; for (const ch of String(txt)) { h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function lista(arr, max){ const a=arr.slice(0,max||3); const resto=arr.length-a.length; if (resto>0) a.push(`mais ${resto}`); return a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' e '+a[a.length-1]; }

const HIST_ABRE = {
  lenda:   ['Os bardos vão cantar este dia por muito tempo.', 'O céu do reino tremeu logo cedo: era dia de batalha grande.'],
  gloria:  ['O sol nasceu dourado, e {H} acordou com fome de vitória.', 'Era um daqueles dias em que até o vento torcia por {H}.', 'Os sinos do castelo tocaram cedo: {H} já estava de pé.'],
  vitoria: ['{H} seguiu pela estrada com passo firme.', 'Dia de trabalho honesto nas terras do reino.', '{H} saiu cedo, antes que a preguiça acordasse.'],

  derrota: ['Uma névoa cinza cobriu o reino o dia inteiro.', 'As sombras perceberam: {H} tinha baixado a guarda.', '{H} ficou na taverna, e o reino sentiu falta.'],

const HIST_FECHA = {

  vitoria:['Um passo de cada vez, o reino fica mais forte.', 'A estrada ficou um pouco mais curta.'],

  silencio:['Amanhã a página volta em branco, esperando o herói.']
};
const HIST_TIT = {
  lenda:['{Bc} caiu!','O dia em que {B} caiu'], gloria:['Dia de glória','Tudo em ordem no reino'], vitoria:['Passo firme','A estrada segue','Trabalho honesto'],
  luta:['Na raça','Dia de resistir'], derrota:['Dia de névoa','As sombras avançam'], silencio:['Página em branco'], aberto:['Hoje']
};
const HIST_COR = { lenda:'#b071e0', gloria:'#e7b04a', vitoria:'#7fb35a', luta:'#d98b3a', derrota:'#d0503f', silencio:'#6b6658', aberto:'#ece4cc', futuro:'#3a3428' };

// habilidade que a pessoa já tinha antes do jogo (marcada como inicial ou com data anterior ao save novo) não vira "aprendeu" na história
function habAntiga(h){ return !!(h && (h.inicial || (S.zerado && h.d && h.d < diaLocal(S.zerado)))); }
function analisaDia(d, c){
  c = c || calc();
  const es = (c.porDia[d]||[]).filter(e=>e.tipo!=='petDia');
  const nomeDiaria = e=>{ const m=S.diarias.find(x=>x.id===e.diaria); return (m&&m.nome) || e.txt; };
  const diarias = es.filter(e=>e.tipo==='diaria');
  const feitas = diarias.filter(e=>e.estrelas>0).sort((a,b)=>b.estrelas-a.estrelas);
  const falhas = diarias.filter(e=>!(e.estrelas>0));
  const tarefas = es.filter(e=>e.tipo==='tarefa');
  const extras = es.filter(e=>(e.xp||0)>0 && !['diaria','tarefa','chefao','queda','petReal','marco','bau','bonus'].includes(e.tipo));
  const chefoes = es.filter(e=>e.tipo==='chefao');
  const quedas = es.filter(e=>e.tipo==='queda');
  const habs = (S.habilidades||[]).filter(h=>h.d===d && !habAntiga(h));
  const passo = (c.trilha.hist||[]).find(h=>h.u===d) || null;
  const xp = es.reduce((s,e)=>s+(e.xp||0),0);
  let estado;
  if (d>S.hoje) estado='futuro';
  else if (chefoes.length) estado='lenda';
  else if (d===S.hoje) estado='aberto';
  else if (passo && passo.st==='ok' && !falhas.length && fixasDia().every(m=>feitas.some(e=>e.diaria===m.id))) estado='gloria';
  else if (passo && passo.st==='ok') estado='vitoria';
  else if (feitas.length || tarefas.length || extras.length) estado='luta';
  else if (es.length) estado='derrota';
  else estado='silencio';
  return { d, es, feitas, falhas, tarefas, extras, chefoes, quedas, habs, passo, xp, estado, nomeDiaria,
    marco: !!(passo && passo.st==='ok' && marcoAte(passo.pos)===passo.pos && passo.pos>0) };
}

// página do dia: até 5 frases curtas, na ordem da história
function paginaDia(d, c){
  const A = analisaDia(d, c), r = rngDe(d+'|'+(S.zerado||0)), pick = arr=>arr[Math.floor(r()*arr.length)];
  const H = nomeH(S.herois.ativo) || 'o herói';
  const B = A.chefoes.length ? artMin((A.chefoes[0].txt||'').replace(/^Chefão derrotado:\s*/,'')) : '';
  const fill = s=> s.replace(/\{H\}/g, H).replace(/\{Bc\}/g, cap1(B)).replace(/\{B\}/g, B);
  const meu = (S.capitulos||{})[d];
  const titulo = (meu && meu.titulo) || fill(pick(HIST_TIT[A.estado]||HIST_TIT.silencio));
  if (meu && meu.texto){
    const fr = String(meu.texto).match(/[^.!?…]+[.!?…]*/g) || [meu.texto];
    return { A, titulo, frases: fr.map(s=>s.trim()).filter(Boolean).slice(0,8).map(t=>({ t })), mestre:true };
  }
  const F = []; const add = (ord, pri, t, cls)=>{ if (t) F.push({ ord, pri, t, cls }); };
  add(0, 0, fill(pick(HIST_ABRE[A.estado]||HIST_ABRE.silencio)));
  if (A.chefoes.length) add(4, 1, `${H} enfrentou ${B} e venceu. O reino inteiro ouviu o estrondo!`, 'ouro');
  const n3 = A.feitas.filter(e=>e.estrelas>=3), n2 = A.feitas.filter(e=>e.estrelas===2), n1 = A.feitas.filter(e=>e.estrelas===1);
  if (n3.length) add(1, 2, `${cap1(lugar(n3[0].area).em)}, brilhou em ${lista(n3.map(A.nomeDiaria))}: três estrelas.`, 'ouro');
  if (n2.length) add(2, n3.length?4:2, `${n3.length?'Também cumpriu':'Cumpriu'} ${lista(n2.map(A.nomeDiaria))}${n3.length?'':' '+lugar(n2[0].area).em}.`);
  if (n1.length) add(2.5, 5, `No mínimo, mas fez: ${lista(n1.map(A.nomeDiaria))}.`);
  if (A.tarefas.length || A.extras.length){
    const t = lista([...A.tarefas.map(e=>e.txt), ...A.extras.map(e=>e.txt)]);
    add(3, 6, A.tarefas.length+A.extras.length>1 ? `Pelo caminho, deu conta de ${t}.` : `Pelo caminho, deu conta de: ${t}.`);
  }
  for (const h of A.habs.slice(0,1)) add(3.5, 3, `Aprendeu algo novo: ${h.nome}.`, 'ouro');
  if (A.falhas.length && A.estado!=='aberto'){
    const nf = A.falhas.map(A.nomeDiaria);
    add(5, 3, `Mas ${lista(nf)} ${nf.length>1?'ficaram':'ficou'} pra trás, e as sombras avançaram sobre ${lugar(A.falhas[0].area).o}.`, 'ruim');
  }
  for (const q of A.quedas.slice(0,1)) add(5.5, 4, `${(AREA[q.area]||{}).nome||'Uma área'} ficou abandonada tempo demais e perdeu um nível.`, 'ruim');
  if (A.estado==='aberto'){
    const c2 = c || calc(), falta = Math.max(0, (c2.trilha.precisa||0) - (c2.trilha.feitasHoje||0));
    add(6, 1, falta ? `${falta>1?'Faltam':'Falta'} ${falta} ${falta>1?'diárias':'diária'} pro passo de hoje na trilha.` : `O passo de hoje na trilha já está garantido.`, falta?'':'ouro');
  } else if (A.marco) add(6, 2, `Chegou ao marco ${A.passo.pos} da trilha: tinha um baú esperando no caminho.`, 'ouro');
  else if (A.passo && A.passo.st==='quebra' && A.passo.de>0) add(6, 3, `A trilha quebrou: de ${A.passo.de} passos, voltou pro marco ${A.passo.pos}.`, 'ruim');
  else if (A.passo && A.passo.st==='ok') add(6, 7, `Mais um passo na trilha: ${A.passo.pos}.`);
  if (HIST_FECHA[A.estado]) add(9, 8, pick(HIST_FECHA[A.estado]));
  const frases = F.sort((a,b)=>a.pri-b.pri).slice(0,5).sort((a,b)=>a.ord-b.ord).map(f=>({ t:f.t, cls:f.cls }));
  return { A, titulo, frases };
}

// meses do jogo, do começo até hoje
function mesesDoJogo(){ const out=[]; let ym=inicioJogo().slice(0,7); const fim=S.hoje.slice(0,7); while (ym<=fim && out.length<600){ out.push(ym); const [y,m]=ym.split('-').map(Number); ym = m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'); } return out; }
function diasDoMes(ym){ const [y,m]=ym.split('-').map(Number); const n=new Date(y,m,0).getDate(); const ini=inicioJogo(); const r=[]; for (let i=1;i<=n;i++){ const d=ym+'-'+String(i).padStart(2,'0'); if (d>=ini) r.push(d); } return r; }

function capituloMes(ym, c){
  c = c || calc();
  const meses = mesesDoJogo(), n = meses.indexOf(ym)+1, aberto = ym===S.hoje.slice(0,7);
  const dias = diasDoMes(ym).filter(d=>d<=S.hoje), fechados = dias.filter(d=>d<S.hoje);
  const As = dias.map(d=>analisaDia(d, c));
  const ok = As.filter(a=>a.passo && a.passo.st==='ok').length;
  let seq=0, melhorSeq=0; As.forEach(a=>{ if (a.passo && a.passo.st==='ok'){ seq++; melhorSeq=Math.max(melhorSeq,seq); } else if (a.estado!=='aberto') seq=0; });
  const soma = f=> As.reduce((s,a)=>s+f(a),0);
  const st = { ok, fechados:fechados.length, xp:soma(a=>a.xp), diarias:soma(a=>a.feitas.length), tres:soma(a=>a.feitas.filter(e=>e.estrelas>=3).length),
    tarefas:soma(a=>a.tarefas.length), faltas:soma(a=>a.falhas.length), melhorSeq,
    chefoes:As.flatMap(a=>a.chefoes.map(e=>(e.txt||'').replace(/^Chefão derrotado:\s*/,''))), habs:As.flatMap(a=>a.habs.map(h=>h.nome)) };
  const porArea={}; As.forEach(a=>a.es.forEach(e=>{ if (e.area && (e.xp||0)>0) porArea[e.area]=(porArea[e.area]||0)+e.xp; }));
  const top = Object.entries(porArea).sort((a,b)=>b[1]-a[1])[0];
  const taxa = st.fechados ? ok/st.fechados : (ok?1:0);
  const estado = st.chefoes.length ? 'lenda' : taxa>=0.8 ? 'gloria' : taxa>=0.5 ? 'vitoria' : taxa>=0.25 ? 'luta' : st.fechados ? 'derrota' : 'aberto';
  const r = rngDe(ym+'|'+(S.zerado||0)), pick = arr=>arr[Math.floor(r()*arr.length)];
  const TIT = { lenda:['A Era das Lendas','O Mês do Estrondo'], gloria:['A Era de Ouro','O Mês Dourado'], vitoria:['A Marcha','A Estrada Firme'], luta:['Tempos de Prova','A Travessia'], derrota:['O Inverno','A Longa Névoa'], aberto:['O Despertar'] };
  const meu = (S.capitulos||{})[ym];
  const titulo = (meu && meu.titulo) || (n===1 && aberto ? 'O Despertar' : pick(TIT[estado]));
  const H = nomeH(S.herois.ativo) || 'O herói';
  let frases;
  if (meu && meu.texto) frases = (String(meu.texto).match(/[^.!?…]+[.!?…]*/g)||[meu.texto]).map(s=>s.trim()).filter(Boolean).slice(0,6);
  else {
    frases = [];
    frases.push(aberto ? `${H} já andou ${ok} ${ok===1?'passo':'passos'} na trilha neste capítulo${st.fechados?`, em ${st.fechados} ${st.fechados===1?'dia':'dias'}`:''}.` : `${H} andou ${ok} de ${st.fechados} dias na trilha.`);
    if (st.chefoes.length) frases.push(`Derrubou ${lista(st.chefoes.map(artMin))}. O reino não esquece.`);
    else if (top && AREA[top[0]]) frases.push(`Onde mais cresceu foi ${lugar(top[0]).em} (${AREA[top[0]].nome}, +${num(top[1])} XP).`);
    if (st.faltas >= Math.max(3, st.diarias)) frases.push(`Foram ${st.faltas} faltas: as sombras cobraram caro.`);
    else if (!st.chefoes.length){ const vivo=S.chefoes.find(b=>!S.derrotados.some(x=>x.id===b.id)); if (vivo) frases.push(`${vivo.nome} ainda espera no fim da estrada.`); }
    else if (st.melhorSeq>=3) frases.push(`A melhor sequência foi de ${st.melhorSeq} dias seguidos.`);
  }
  return { ym, n, aberto, titulo, frases: frases.slice(0,3), st, estado };
}

/* ---------- desenho do mapa ---------- */
// caminho em serpentina: 4 por linha, ida e volta; enfeites sorteados por capítulo
function mapaMes(ym, c){
  const dias = diasDoMes(ym), COL=4, W=360, DX=78, X0=63, Y0=58, DY=86;
  const pos = dias.map((d,i)=>{ const row=Math.floor(i/COL), k=i%COL, col=row%2 ? COL-1-k : k; const r=rngDe(d); return { d, x:X0+col*DX + (r()-0.5)*14, y:Y0+row*DY + (r()-0.5)*16 }; });
  const H = Y0 + Math.max(0, Math.ceil(dias.length/COL)-1)*DY + 66;
  let path=''; pos.forEach((p,i)=>{ if (!i){ path+=`M${p.x.toFixed(1)} ${p.y.toFixed(1)}`; return; } const a=pos[i-1]; const mesmaLinha=Math.floor(i/COL)===Math.floor((i-1)/COL);
    if (mesmaLinha) path+=` Q${((a.x+p.x)/2).toFixed(1)} ${((a.y+p.y)/2 + (i%2?12:-12)).toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
    else { const lado = a.x>W/2 ? W-12 : 12; path+=` C${lado} ${a.y.toFixed(1)} ${lado} ${p.y.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`; } });
  // até onde o herói já andou (o resto do caminho fica tracejado)
  const iHoje = pos.findIndex(p=>p.d===S.hoje), ate = iHoje>=0 ? iHoje : (dias[dias.length-1] < S.hoje ? pos.length-1 : -1);
  const r = rngDe('mapa|'+ym); let enfeites='';
  const livre = (x,y)=> pos.every(p=>Math.hypot(p.x-x,p.y-y)>40) && x>14 && x<W-14;
  for (let i=0, n=0; i<220 && n<26; i++){
    const x=r()*W, y=14+r()*(H-24); if (!livre(x,y)) continue; n++; const t=r();
    if (t<0.45) enfeites+=`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><rect x="-1.5" y="2" width="3" height="5" fill="#6b4a2a"/><path d="M0 -9 L7 3 L-7 3Z" fill="#5f8a3e"/><path d="M0 -13 L5 -3 L-5 -3Z" fill="#79a64c"/></g>`;
    else if (t<0.7) enfeites+=`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><path d="M-12 6 L-2 -9 L8 6Z" fill="#9c8a66"/><path d="M-2 -9 L1 -4 L-4 -4Z" fill="#f2ead2"/><path d="M2 6 L9 -3 L16 6Z" fill="#8a7a58"/></g>`;
    else if (t<0.85) enfeites+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(9+r()*8).toFixed(0)}" ry="5" fill="#7fa6b0" opacity=".55"/>`;
    else enfeites+=`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})" fill="#b9a77c"><circle r="2"/><circle cx="5" cy="2" r="1.5"/><circle cx="-4" cy="3" r="1.2"/></g>`;
  }
  return { pos, W, H, path, ate, enfeites, dias };
}

function lidasHist(){ try { return JSON.parse(localStorage.getItem('dl.lidas')||'[]'); } catch(e){ return []; } }
function marcaLida(k){ const l=lidasHist().filter(x=>x!==k); l.push(k); try { localStorage.setItem('dl.lidas', JSON.stringify(l.slice(-150))); } catch(e){} }

let capVendo = null; // mês aberto no mapa
function vHistoria(){
  if (!S.herois.ativo) return `<p class="fraco">Crie o herói pra história começar.</p>`;
  const c = calc(), meses = mesesDoJogo(); if (!capVendo || !meses.includes(capVendo)) capVendo = meses[meses.length-1];
  const cap = capituloMes(capVendo, c), M = mapaMes(capVendo, c), lidas = new Set(lidasHist());
  const h = heroAtivo(), retrato = h ? Shots.hero(heroiV(h.id), eqAtivo()) : '';
  const abas = meses.length>1 ? `<div class="hcaps">${meses.map((ym,i)=>`<button class="btn ${ym===capVendo?'on':''}" data-hcap="${ym}">Cap. ${i+1}<small>${MESES[+ym.slice(5)-1].slice(0,3)}</small></button>`).join('')}</div>` : '';
  // capítulo anterior fechado e ainda não lido: chamada no topo
  const ant = meses.length>1 ? meses[meses.length-2] : null;
  const chamada = ant && !lidas.has('cap:'+ant) ? `<button class="hchamada" data-hresumo="${ant}">${ico('trophy','st')}<span><b>Capítulo ${meses.length-1} fechado!</b> Toque pra ler o resumo de ${MESES[+ant.slice(5)-1]}.</span></button>` : '';
  const nos = M.pos.map((p,i)=>{
    const A = analisaDia(p.d, c), novo = A.estado!=='futuro' && A.estado!=='aberto' && p.d>=addDias(S.hoje,-3) && !lidas.has(p.d);

/* ===== Lógica do jogo e interface ===== */

const areasJogo = ()=> (typeof S!=='undefined' && S && Array.isArray(S.areas)) ? S.areas : [];

function nivelDe(xp){ let L=1, r=Math.max(0,xp); while (r>=custo(L)){ r-=custo(L); L++; } return { n:L, r, p:custo(L) }; }
const dt = s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const iso = d=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const esc = s=> String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// pet e tarefa sem área: o XP soma no nível geral, sem área nenhuma
const areaPet = ()=> AREA.casa ? 'casa' : null;
let calcMemo = null, calcFixo = false;
function calc(){ if (calcFixo){ return calcMemo || (calcMemo = calcConta()); } return calcConta(); }
function calcConta(){
  const area={}, ultima={}; areasJogo().forEach(a=>{ area[a.id]=0; });
  let ganho=0; const heroi={}; const diasDiaria=new Set(); const porDia={};
  for (const e of S.log){
    area[e.area] = (area[e.area]||0) + (e.xp||0);
    ganho += (e.ouro!=null ? e.ouro : (e.xp||0));
    if (e.heroi) heroi[e.heroi] = (heroi[e.heroi]||0) + (e.xp||0);
    if ((e.xp||0)>0 && (!ultima[e.area] || e.d>ultima[e.area])) ultima[e.area]=e.d;
    if (e.tipo==='diaria' && e.estrelas>0) diasDiaria.add(e.d);
    (porDia[e.d] = porDia[e.d] || []).push(e);
  }
  if (S.pets && S.pets.desde && S.pets.possui.length){

      area[areaPet()] = (area[areaPet()]||0) + XP_PET_DIA; ganho += XP_PET_DIA;
      (porDia[d] = porDia[d] || []).push({ d, area:areaPet(), txt:'Companheiro ao seu lado', xp:XP_PET_DIA, tipo:'petDia' });
    }
  }
  // área parada: a cada 7 dias fechados sem XP, cai pro começo do nível de baixo (só XP da área; ouro não muda)
  quedasArea(porDia).forEach(q=>{ area[q.area] = (area[q.area]||0) + q.xp; (porDia[q.d] = porDia[q.d] || []).push(q); });
  const gasto = S.compras.reduce((s,c)=>s+c.preco,0);

  const tr = trilhaDia(porDia);
  return { area, ultima, ouro: ganho-gasto, xpTotal, heroi, seq: tr.pos, melhor: tr.melhor, trilha: tr, porDia, diasDiaria };
}

/* ---------- área parada: queda de nível ----------
   Conta dias FECHADOS sem XP positivo de registro (pet passivo não conta; hoje está aberto e nunca conta).
   Último dia com XP = U. Se U+1..U+7 ficaram vazios, no dia U+8 a área cai pro começo do nível de baixo;
   continua parada, cai de novo em U+15, U+22... Nível 1 não cai. Tudo derivado do log (nada é gravado),
   então registro atrasado que o agente lança depois desfaz a queda sozinho. */
const QUEDA_DIAS = 7;
function inicioNivel(n){ let x=0; for (let L=1; L<n; L++) x+=custo(L); return x; }
function quedasArea(porDia){
  const dias=Object.keys(porDia).filter(Boolean).sort(), out=[];
  areasJogo().forEach(a=>{
    let xp=0, ult=null, caidas=0;
    const checa = ate=>{ if (!ult) return; const tot=Math.floor((diasEntre(ult, ate)-1)/QUEDA_DIAS);
      for (let k=caidas+1; k<=tot; k++){ const lv=nivelDe(xp); if (lv.n<=1) continue; const novo=inicioNivel(lv.n-1), q=novo-xp; xp=novo;
        out.push({ d:addDias(ult, QUEDA_DIAS*k+1), area:a.id, txt:`${a.nome} parada ${QUEDA_DIAS*k} dias: caiu pro nível ${lv.n-1}`, xp:q, tipo:'queda' }); }
      if (tot>caidas) caidas=tot; };
    for (const d of dias){
      if (d>S.hoje) break;
      const es=porDia[d].filter(e=>e.area===a.id); if (!es.length) continue;
      checa(d);
      xp += es.reduce((s,e)=>s+(e.xp||0),0);
      if (es.some(e=>(e.xp||0)>0 && e.tipo!=='petDia')){ ult=d; caidas=0; }
    }
    checa(S.hoje);
  });
  return out;
}
// próxima queda da área (dias até cair), ou null se não está parada ou está no nível 1
function proxQueda(c, id){ const u=c.ultima[id]; if (!u || nivelDe(c.area[id]||0).n<=1) return null; const parado=diasEntre(u, S.hoje);
  const prox=addDias(u, QUEDA_DIAS*(Math.floor(Math.max(0,parado-1)/QUEDA_DIAS)+1)+1); return { parado, em:diasEntre(S.hoje, prox) }; }

/* ---------- trilha (sequência com checkpoints) ----------
   Passo do dia: pelo menos 60% das diárias fixas (semanais ficam fora) feitas, versão mínima vale.
   Dia sem passo: volta pro último marco alcançado (não pro zero). Hoje ainda aberto nunca quebra.
   Marco alcançado pela 1ª vez = 1 baú (id trilha:N, não repete se a trilha voltar e passar de novo). */
const TRILHA_PCT = 0.6;
const MARCOS_BASE = [3,7,14,30,60,100,150,200,250,300,365];
function marcoN(i){ return i<MARCOS_BASE.length ? MARCOS_BASE[i] : 365 + 100*(i-MARCOS_BASE.length+1); }
function marcoAte(pos){ let m=0; for (let i=0; marcoN(i)<=pos; i++) m=marcoN(i); return m; }
function marcoDepois(pos){ let i=0; while (marcoN(i)<=pos) i++; return marcoN(i); }
function percorre(unidades, ehPasso, aberta){
  // unidades: lista em ordem (dias ou semanas); aberta: a última ainda pode ser feita (não quebra)
  let pos=0, melhor=0; const hist=[]; const marcos=[];
  unidades.forEach((u,i)=>{
    const ok = ehPasso(u), ultima = i===unidades.length-1;
    if (ok){ pos++; if (pos>melhor) melhor=pos; if (MARCOS_BASE.includes(pos) || (pos>365 && marcoAte(pos)===pos)) marcos.push(pos); hist.push({ u, st:'ok', pos }); }
    else if (ultima && aberta) hist.push({ u, st:'aberto', pos });
    else { const volta=marcoAte(pos); hist.push({ u, st:'quebra', de:pos, pos:volta }); pos=volta; }
  });
  return { pos, melhor, hist, marcos:[...new Set(marcos)] };
}
function inicioJogo(){ const ds=S.log.map(e=>e.d).filter(Boolean).sort(); return ds[0] || S.hoje; }
function diasDoJogo(){ const r=[]; for (let d=inicioJogo(), n=0; d<=S.hoje && n<3000; d=addDias(d,1), n++) r.push(d); return r; }
function fixasDia(){ return S.diarias.filter(m=>!m.semanal); }
function precisaDia(){ const n=fixasDia().length; return n ? Math.ceil(n*TRILHA_PCT) : 0; }
function feitasNoDia(es){ const ids=new Set(fixasDia().map(m=>m.id)); return new Set((es||[]).filter(e=>e.tipo==='diaria' && e.estrelas>0 && ids.has(e.diaria)).map(e=>e.diaria)).size; }
function trilhaDia(porDia){
  const precisa=precisaDia(); if (!precisa) return Object.assign(percorre([], ()=>false, true), { precisa:0, feitasHoje:0 });
  const r = percorre(diasDoJogo(), d=>feitasNoDia(porDia[d])>=precisa, true);
  return Object.assign(r, { precisa, feitasHoje: feitasNoDia(porDia[S.hoje]) });
}
function trilhaDiaria(m){
  const feito = new Set(S.log.filter(e=>e.diaria===m.id && e.estrelas>0).map(e=>e.d));
  if (!m.semanal) return Object.assign(percorre(diasDoJogo(), d=>feito.has(d), true), { unidade:'dia' });
  const sems=[]; for (let w=semanaDe(inicioJogo()); w<=S.hoje; w=addDias(w,7)) sems.push(w);
  const conta = w=>[...feito].filter(d=>d>=w && d<=addDias(w,6)).length;
  // semana em que o jogo começou pela metade: só conta se bateu a meta (não quebra)
  if (sems.length>1 && conta(sems[0])<m.semanal) sems.shift();
  return Object.assign(percorre(sems, w=>conta(w)>=m.semanal, true), { unidade:'semana', estaSemana: conta(semanaDe(S.hoje)) });
}
function checaMarcos(c){
  const novos = (c.trilha.marcos||[]).filter(m=>!S.bausGanhos.some(b=>b.id==='trilha:'+m));
  if (!novos.length) return;
  novos.forEach(m=>S.bausGanhos.push({ id:'trilha:'+m, d:S.hoje, marco:m }));
  S.baus = Math.max(0, S.bausGanhos.length - S.bausAbertos.length);

}
// desenho da trilha: do último marco até o próximo, uma pedra por passo
function trilhaHTML(t, rotulo){
  const ini=marcoAte(t.pos), fim=marcoDepois(t.pos), aberto = t.hist.length && t.hist[t.hist.length-1].st==='aberto';
  let pedras='';

    const feito = i<=t.pos, prox = !feito && i===t.pos+1, marco = i===fim;
    pedras += `<span class="pedra ${feito?'ok':''} ${prox&&aberto?'agora':''} ${marco?'marco':''}" title="${i}">${marco?ico('chest','pm'):feito?'':`<i>${i}</i>`}</span>`;
  }
  const falta = fim - t.pos;
  return `<div class="trilha"><div class="tcab">${ico('flame','st')}<b>${t.pos}</b><span>${rotulo}</span><span class="fraco">${falta} até o baú do marco ${fim}</span></div>
    <div class="tcaminho">${ini?`<span class="pedra base" title="Marco ${ini}">${ico('mapa','pm')}<i>${ini}</i></span>`:''}${pedras}</div>
    <div class="fraco tnota">${ini?`Falhou um ${t.unidade==='semana'?'semana':'dia'}? Volta pro marco ${ini}, não pro zero.`:`Falhou antes do marco 3? Volta pro começo.`} Recorde: ${t.melhor}.</div></div>`;
}
/* minimapa da História no palco (canto de cima, à direita): pedaço do mapa do mês em volta de hoje; toque abre a aba História */
const Minimapa = {
  chave:'',
  pinta(c){
    let el=document.getElementById('minimapa');
    if (!el){ const palco=document.querySelector('.palco'); if (!palco) return; el=document.createElement('button'); el.id='minimapa'; el.className='minimapa moldura'; el.title='História'; el.setAttribute('aria-label','Abrir o mapa da História'); palco.appendChild(el); this.chave=''; }
    if (!S.herois.ativo || !S.hoje){ el.hidden=true; return; } el.hidden=false;
    const lg=S.log[S.log.length-1];
    const chave=[S.hoje, S.log.length, lg&&lg.id, (S.diarias||[]).length, (S.habilidades||[]).length, S.herois.ativo, JSON.stringify(eqAtivo()||{})].join('|'); if (chave===this.chave) return; this.chave=chave;
    c = c || calc();
    const meses=mesesDoJogo(), ym=meses[meses.length-1], M=mapaMes(ym, c), lidas=new Set(lidasHist());
    // janela quadrada do mapa, centrada em hoje (como minimapa de jogo)
    const iH = M.pos.findIndex(p=>p.d===S.hoje), cen = iH>=0 ? M.pos[iH] : M.pos[M.pos.length-1] || { x:M.W/2, y:M.H/2 };
    const L = Math.min(M.W, Math.max(M.H, 200)), y0 = Math.max(0, Math.min(M.H - L, cen.y - L/2)), x0 = (M.W - L)/2;
    let nos='', eu=null;
    M.pos.forEach(p=>{ if (p.y < y0-20 || p.y > y0+L+20) return; const A=analisaDia(p.d, c);
      if (A.estado==='futuro'){ nos+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" class="fut"/>`; return; }
      const novo = A.estado!=='aberto' && p.d>=addDias(S.hoje,-3) && !lidas.has(p.d);
      nos+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.d===S.hoje?16:13}" fill="${HIST_COR[A.estado]}" class="dia ${p.d===S.hoje?'hoje':''}"/>`+(novo?`<circle cx="${(p.x+10).toFixed(1)}" cy="${(p.y-10).toFixed(1)}" r="5" class="novo"/>`:'');
      if (p.d===S.hoje) eu = p; });
    const done = M.ate>=0 ? `<path d="${M.path}" fill="none" stroke="#5c4a2e" stroke-width="6" stroke-linecap="round" pathLength="1000" stroke-dasharray="${(M.pos.length>1 ? M.ate/(M.pos.length-1) : 1)*1000} 1000"/>` : '';
    const h=heroAtivo(), retrato = h ? Shots.hero(heroiV(h.id), eqAtivo()) : '';
    const pc = v=>v.toFixed(1)+'%';
    el.innerHTML=`<div class="mmArea"><svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${L.toFixed(1)} ${L.toFixed(1)}" aria-hidden="true"><rect x="${x0}" y="${y0}" width="${L}" height="${L}" class="chao"/>${M.enfeites}
      <path d="${M.path}" fill="none" stroke="#8a7350" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 10" opacity=".8"/>${done}${nos}</svg>
      ${eu && retrato ? `<img class="mmEu" src="${retrato}" alt="" style="left:${pc((eu.x-x0)/L*100)};top:${pc((eu.y-y0)/L*100)}">` : ''}</div>
      <span class="mmTxt">${ico('book','st')} Cap. ${meses.length} · ${MESES[+ym.slice(5)-1]}</span>`;
  }
};

/* ---------- festa: som + animação a cada tarefa, missão e chefão ----------
   tarefa = sino (ding) + "+XP" subindo; missão (diária) = fanfarra curta + faixa; chefão = fanfarra épica + faixa grande + tremida.
   Vários do mesmo tipo de uma vez (ex.: o agente mandou 4 diárias) viram uma festa só. */
const Festa = {
  fila:[], ocupado:false,
  add(tipo, txt, o){ this.fila.push(Object.assign({ tipo, txt }, o||{})); if (!this.ocupado) setTimeout(()=>this.prox(), 60); },
  prox(){
    if (this.ocupado || !this.fila.length) return;
    if ($('#jogo').hidden){ return; } // volta a tocar quando o jogo abrir (entrar chama prox)
    const f=this.fila.shift(); const juntos=[f];
    if (f.tipo!=='chefao') while (this.fila.length && this.fila[0].tipo===f.tipo) juntos.push(this.fila.shift());
    this.ocupado=true; const dur = this.toca(f.tipo, juntos);
    setTimeout(()=>{ this.ocupado=false; this.prox(); }, dur);
  },
  toca(tipo, js){
    const n=js.length, f=js[0];
    if (tipo==='tarefa'){
      Som.sfx('ding'); if (n>1) setTimeout(()=>Som.sfx('ding'), 180);
      this.sobe(`+${n*XP_TAREFA*(f.mult||1)} XP`, f.x, f.y); this.faisca(f.x, f.y, 10);
      return 650;
    }
    if (tipo==='missao'){
      Som.sfx('missao'); if (stage) stage.tocaHeroi(false);
      const est = n===1 && f.estrelas ? estrelas(f.estrelas) : '';
      this.faixa(n>1 ? `${n} missões concluídas` : 'Missão concluída', n>1 ? js.map(x=>x.txt).join(' · ') : f.txt, est, 'missao');
      this.confete(28); return 2100;
    }
    if (tipo==='chefao'){
      const b = f.id && S.chefoes.find(x=>x.id===f.id);
      const festa = ()=>{ Som.sfx('chefao'); this.faixa('Chefão derrotado!', f.txt, `<span class="fxp">+${f.xp||300} XP</span>`, 'chefao');
        document.body.classList.add('treme'); setTimeout(()=>document.body.classList.remove('treme'), 600); this.confete(70); setTimeout(()=>this.confete(50), 900); };
      if (stage && b && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
        if (ehMovel()) abreFolha(false); stage.abreArena(b); arenaUI(true, b); stage.onDesmonta = festa;
        setTimeout(()=>stage.derrota(b, ()=>{ stage.fechaArena(); arenaUI(false); }), 700); return 7500;
      }
      festa(); return 3600;
    }
    return 0;
  },
  camada(){ let c=$('#festa'); if (!c){ c=document.createElement('div'); c.id='festa'; c.setAttribute('aria-live','polite'); document.body.appendChild(c); } return c; },
  centro(){ const p=$('#palco3d'); const r=p ? p.getBoundingClientRect() : { left:0, top:0, width:innerWidth, height:innerHeight*0.5 }; return [r.left+r.width/2, r.top+Math.min(r.height*0.45, innerHeight*0.4)]; },
  sobe(txt, x, y){ if (x==null) [x,y]=this.centro(); const e=document.createElement('div'); e.className='fsobe'; e.textContent=txt; e.style.left=x+'px'; e.style.top=y+'px'; this.camada().appendChild(e); setTimeout(()=>e.remove(), 1200); },
  faisca(x, y, n){ if (x==null) [x,y]=this.centro(); const c=this.camada(); for (let i=0;i<n;i++){ const e=document.createElement('i'); e.className='ffai'; const a=i/n*Math.PI*2, d=26+Math.random()*22;
    e.style.left=x+'px'; e.style.top=y+'px'; e.style.setProperty('--dx', Math.cos(a)*d+'px'); e.style.setProperty('--dy', Math.sin(a)*d+'px'); c.appendChild(e); setTimeout(()=>e.remove(), 700); } },
  faixa(tit, sub, extra, cls){ const e=document.createElement('div'); e.className='ffaixa '+cls; e.innerHTML=`<b>${esc(tit)}</b>${sub?`<span>${esc(sub)}</span>`:''}${extra||''}`; this.camada().appendChild(e); setTimeout(()=>e.classList.add('sai'), cls==='chefao'?2900:1600); setTimeout(()=>e.remove(), cls==='chefao'?3500:2100); },
  confete(n){ const c=this.camada(), cores=['#e7b04a','#ffd77a','#ece4cc','#d0503f','#3ac08a','#3a9ad0']; for (let i=0;i<n;i++){ const e=document.createElement('i'); e.className='fconf';
    e.style.left=(Math.random()*100)+'vw'; e.style.background=cores[i%cores.length]; e.style.setProperty('--dx', (Math.random()*80-40)+'px'); e.style.animationDelay=(Math.random()*0.35)+'s'; e.style.animationDuration=(1.3+Math.random()*0.9)+'s'; c.appendChild(e); setTimeout(()=>e.remove(), 2800); } }
};

function vEquip(){
