<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Daily Legends</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a1a">
<meta name="description" content="Daily Legends: o RPG da sua vida real.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Legends">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root{
  /* cor: pedra de castelo à noite (verde-acinzentado do Everpath), pergaminho no texto, vinho dos botões, ouro = XP e moeda */
  --pedra:#151a1a; --painel:#1e2524; --linha:#5c4a2e; --texto:#ece4cc; --fraco:#9c9886; --vinho:#8a2a2e; --ouro:#e7b04a;
  --bom:#7fb35a; --ruim:#d0503f; --raro:#5aa0e0; --epico:#b071e0;
  /* fonte: Cinzel é serifada de inscrição (linha do título do Everpath), medieval e legível; Pixelify Sans é pixel legível pro resto */
  --titulo:'Cinzel', Georgia, serif; --corpo:'Pixelify Sans', system-ui, sans-serif;
  /* layout: herói grande à esquerda no palco do castelo, painel de abas à direita (Dark Souls); no estreito, herói em cima */
  color-scheme: dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
/* cenário numa camada fixa do tamanho da tela: no iPhone, background fixed + cover esticava a imagem pela página inteira (zoom enorme) */
body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; background:var(--pedra) var(--cen, none) center bottom / cover no-repeat; image-rendering:pixelated; }
body{ background:var(--pedra); image-rendering:pixelated; color:var(--texto); font-family:var(--corpo); font-size:15px; line-height:1.35; min-height:100vh; }
img.px{ image-rendering:pixelated; width:16px; height:16px; vertical-align:middle; }
img.vox{ display:block; width:100%; height:auto; image-rendering:auto; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible, label:focus-within{ outline:2px solid var(--ouro); outline-offset:2px; }
[hidden]{ display:none !important; }
.fraco{ color:var(--fraco); font-size:13px; }

/* moldura pixelada */
.moldura{ background:rgba(21,26,26,.9); border:3px solid var(--linha); box-shadow: inset 0 0 0 2px #0009, 0 0 0 2px #0008, 0 8px 0 #0005;
  clip-path: polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px)); }
.btn{ background:var(--vinho); border:0; padding:10px 16px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  box-shadow: inset -3px -3px 0 #0006, inset 3px 3px 0 #ffffff26, 0 0 0 2px #000a; font-weight:600; letter-spacing:.5px; text-shadow:0 2px 0 #0008; }
.btn:hover{ filter:brightness(1.15); } .btn:active{ box-shadow: inset 3px 3px 0 #0006, 0 0 0 2px #000a; transform:translateY(1px); }
.btn.ouro{ background:#b07a1e; } .btn.off{ opacity:.5; }
.btn.pendente{ position:relative; } .btn.pendente::after{ content:''; position:absolute; top:4px; right:4px; width:8px; height:8px; background:var(--ouro); box-shadow:0 0 0 2px #000; }
.bar{ height:10px; background:#0b0e0e; box-shadow: inset 0 0 0 2px #000, 0 0 0 1px var(--linha); flex:1; min-width:40px; position:relative; }
.bar i{ display:block; height:100%; background:linear-gradient(#ffd77a 0 30%, var(--ouro) 30% 75%, #b07a1e 75%); transition:width .4s; }
.bar.vida i{ background:linear-gradient(#ff8a7a 0 30%, var(--ruim) 30% 75%, #8a1f1a 75%); }

/* tela inicial */
#titulo{ min-height:100vh; display:grid; place-items:center; padding:32px 16px; }
#titulo h1{ font-family:var(--titulo); font-weight:400; font-size:clamp(46px, 10vw, 112px); line-height:1; font-weight:900; margin:0 0 24px; text-align:center; color:#dfe8e4; text-shadow:0 4px 0 #0b1010, 0 0 30px #9ab8b080; letter-spacing:2px; }
.menu{ width:min(360px, 100%); padding:24px; display:grid; gap:12px; justify-self:center; }
.menu .btn{ width:100%; font-size:18px; }
.sl2{ display:grid; gap:4px; background:var(--vinho); padding:8px 14px 10px; box-shadow: inset -3px -3px 0 #0006, inset 3px 3px 0 #ffffff26, 0 0 0 2px #000a; text-align:center; font-size:13px; letter-spacing:1px; text-transform:lowercase; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:6px; background:#0b0e0e; box-shadow:0 0 0 2px #0009; margin:8px 0; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:20px; background:var(--texto); box-shadow: inset -2px -2px 0 #9c9886, 0 0 0 2px #000; cursor:pointer; }
input[type=range]::-moz-range-thumb{ width:12px; height:20px; border:0; border-radius:0; background:var(--texto); box-shadow:0 0 0 2px #000; }
.arquivo input{ display:none; }
#tData{ text-align:center; }

/* jogo */
#jogo{ display:grid; grid-template-rows:auto 1fr; min-height:100vh; }
.topo{ display:flex; align-items:center; gap:16px; padding:8px 16px; background:rgba(12,15,15,.88); border-bottom:3px solid var(--linha); flex-wrap:wrap; }
.marca{ font-family:var(--titulo); font-weight:900; font-size:26px; letter-spacing:1px; line-height:1; color:#dfe8e4; margin-right:auto; text-shadow:0 2px 0 #000; }
.stat{ display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; font-size:17px; }
.stat b{ font-weight:600; }
.nivelG{ display:flex; align-items:center; gap:8px; min-width:180px; }
.nivelG .lv{ font-family:var(--titulo); font-weight:700; font-size:24px; line-height:1; color:var(--ouro); }
.nivelG .xpw{ display:grid; gap:2px; flex:1; } .nivelG small{ color:var(--fraco); font-size:12px; }
.ib{ background:none; border:0; padding:6px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:17px; }
.ib img.px{ width:22px; height:22px; }
#btnBau.cheio img{ animation:pula 1s steps(2) infinite; }
@keyframes pula{ 50%{ transform:translateY(-3px); } }
#btnMudo.off{ opacity:.45; }
#btnNuvem{ min-height:40px; padding:6px 12px; font-size:14px; white-space:nowrap; }
#btnNuvem.n-reconectar, #btnNuvem.n-erro{ background:var(--vinho); } #btnNuvem.n-offline{ background:#3a3d3a; } #btnNuvem.n-sync{ opacity:.8; }
#avisoVersao{ position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:40; width:min(420px, calc(100% - 24px)); }
#avisoVersao .btn{ width:100%; background:#b07a1e; }
body.conectando::after{ content:'Conectando ao Google…'; position:fixed; inset:0; display:grid; place-items:center; background:var(--pedra); color:var(--texto); font:16px var(--corpo); z-index:99; }
.topo{ padding-top:max(8px, env(safe-area-inset-top)); padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
#titulo{ padding-top:max(32px, env(safe-area-inset-top)); padding-bottom:max(32px, env(safe-area-inset-bottom)); }
.main{ padding-bottom:max(16px, env(safe-area-inset-bottom)); }
.tConta{ text-align:center; margin:0; }

.main{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:16px; padding:16px; min-height:0; }
.palco{ position:relative; min-height:420px; }
#palco3d{ position:absolute; inset:0; }
#palco3d canvas{ cursor:grab; display:block; }
.placa{ position:absolute; left:8px; bottom:8px; padding:12px 16px; width:min(380px, calc(100% - 16px)); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:end; }
.placa .trocar{ grid-row:1 / span 3; grid-column:2; min-height:40px; padding:6px 12px; font-size:13px; }
.pnome{ font-family:var(--titulo); font-weight:700; font-size:26px; line-height:1; }
.plema{ color:var(--fraco); font-size:13px; margin-bottom:8px; }
.pnv{ display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; } .pnv b{ color:var(--ouro); } .pfr{ font-size:12px; color:var(--fraco); }

.painel{ display:grid; grid-template-rows:auto 1fr; min-height:0; max-height:calc(100vh - 100px); }
#tabs{ display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:4px; padding:8px; background:#0c0f0f; border-bottom:3px solid var(--linha); }
.tab{ background:#1e2524; border:0; padding:8px 2px 6px; display:grid; justify-items:center; gap:4px; font-size:10px; color:var(--fraco); box-shadow: inset 0 0 0 2px #000, inset 3px 3px 0 #ffffff12; min-height:52px; overflow:hidden; }
.tab img{ width:24px; height:24px; image-rendering:pixelated; }
.tab.on{ background:var(--vinho); color:var(--texto); box-shadow: inset 0 0 0 2px #000, inset 3px 3px 0 #ffffff26; }
.tab span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
#conteudo{ padding:16px; overflow-y:auto; min-height:0; }
.sec{ display:flex; align-items:baseline; gap:12px; margin:8px 0 12px; flex-wrap:wrap; }
.sec h3{ font-family:var(--titulo); font-weight:700; font-size:24px; margin:0; line-height:1; margin-right:auto; }
.saldo{ font-size:18px; color:var(--ouro); font-variant-numeric:tabular-nums; }

/* raridade */
.r-comum{ --rc:#8a8676; } .r-raro{ --rc:var(--raro); } .r-epico{ --rc:var(--epico); } .r-lendario{ --rc:var(--ouro); }

/* equipamento */
.equip{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
.equip > *{ min-width:0; }
.slots{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.slot, .cel{ aspect-ratio:1; background:radial-gradient(#2a3231, #141918); border:0; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--rc, #3a3326); padding:6px; position:relative; display:grid; place-items:center; }
.slot{ padding:6px 6px 18px; }
.slot .sl{ position:absolute; bottom:4px; left:0; right:0; font-size:11px; color:var(--fraco); text-align:center; }
.slot.sel, .cel.sel{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro), 0 0 12px #e7b04a55; }
.slot .vazio{ width:40%; aspect-ratio:1; border:2px dashed #3a3326; }
.slot img.vox, .cel img.vox{ width:100%; height:100%; object-fit:contain; }
.cel.nada{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #262b26; }
.cel .eqm{ position:absolute; top:4px; left:4px; background:var(--ouro); color:#1a1408; font-size:10px; font-weight:600; padding:0 4px; }
.inv{ display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:6px; }
.info{ display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center; padding:12px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--rc,#3a3326); align-self:start; }
.info.vazioinfo{ grid-template-columns:1fr; }
.info img.big{ width:96px; height:96px; }
.inome{ font-family:var(--titulo); font-weight:700; font-size:21px; line-height:1; color:var(--rc, var(--texto)); }
.imeta{ color:var(--fraco); font-size:13px; display:flex; gap:10px; margin:4px 0 10px; } .rar{ color:var(--rc); }
.acoes{ display:flex; gap:8px; flex-wrap:wrap; }

/* atributos */
.lista{ display:grid; gap:8px; }
.area{ background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; }
.area summary{ list-style:none; display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"i n v" "b b b"; gap:6px 10px; align-items:center; padding:12px 14px; cursor:pointer; }
.area summary::-webkit-details-marker{ display:none; }
.area .ai{ grid-area:i; width:24px; height:24px; } .anome{ grid-area:n; font-size:17px; font-weight:600; } .anv{ grid-area:v; font-family:var(--titulo); font-weight:700; font-size:20px; color:var(--ouro); line-height:1; }
.abar{ grid-area:b; display:flex; align-items:center; gap:10px; } .afr{ font-size:12px; color:var(--fraco); font-variant-numeric:tabular-nums; white-space:nowrap; }
.alerta{ grid-area:n; justify-self:end; color:var(--ruim); font-size:12px; }
.skills{ display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 14px; }
.skill{ background:#22201a; box-shadow: inset 0 0 0 2px var(--linha); padding:4px 8px; font-size:13px; }

/* missões */
.miss{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; }
.miss .ai{ width:24px; height:24px; } .mn{ font-weight:600; } .mm{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--fraco); }
.ms{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:12px; }
.stars{ display:inline-flex; gap:1px; } .st{ width:14px !important; height:14px !important; }
.pend{ color:var(--fraco); } .falha{ color:var(--ruim); } .sem{ color:var(--texto); font-variant-numeric:tabular-nums; }

/* chefões */
.bosses{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
.boss{ display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; padding:10px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #4a1f1f; position:relative; }
.bimg{ width:110px; height:110px; background:radial-gradient(#3a2222, #120c0c); box-shadow: inset 0 0 0 2px #000; }
.bnome{ font-family:var(--titulo); font-weight:700; font-size:20px; line-height:1; color:#f0c8b8; } .bdesc{ font-size:13px; margin:2px 0 8px; }
.hp{ display:flex; align-items:center; gap:8px; font-size:12px; font-variant-numeric:tabular-nums; } .hp span{ color:var(--ruim); font-weight:600; } .hp b{ font-weight:600; }
.hp .cont{ color:var(--ouro); font-size:16px; }
.bmeta{ font-size:12px; color:var(--fraco); margin-top:2px; }
.fases{ margin:6px 0 0; padding:0; list-style:none; font-size:12px; display:grid; gap:2px; } .fases li::before{ content:'□ '; color:var(--fraco); } .fases li.ok{ color:var(--bom); } .fases li.ok::before{ content:'■ '; }
.brec{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ouro); margin-top:8px; flex-wrap:wrap; }
.boss.morto{ filter:grayscale(.7); } .selo{ position:absolute; top:12px; right:12px; background:var(--vinho); padding:2px 8px; font-size:12px; transform:rotate(4deg); box-shadow:0 0 0 2px #000; }

/* loja */
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.chip{ background:#1e2524; border:0; padding:6px 10px; min-height:36px; font-size:13px; box-shadow: inset 0 0 0 2px #000; }
.chip.on{ background:var(--vinho); }
.lgrid, .hgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); gap:8px; }
.loja, .hcard{ display:grid; gap:4px; justify-items:center; text-align:center; padding:10px 8px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--rc,#2a2620); position:relative; border:0; }
.loja img.vox{ width:84px; height:84px; } .ln{ font-size:13px; font-weight:600; min-height:2.6em; display:grid; place-items:center; } .lr{ font-size:11px; color:var(--rc); }
.loja .btn{ width:100%; min-height:40px; padding:6px; font-size:14px; font-variant-numeric:tabular-nums; }
.tem{ font-size:12px; color:var(--bom); min-height:40px; display:grid; place-items:center; }
.loja.tido{ opacity:.8; }
.loja .prov{ background:none; border:0; padding:0; display:grid; justify-items:center; gap:4px; width:100%; position:relative; }
.loja .prov:hover img.vox{ transform:translateY(-2px); }
.loja.provando{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro), 0 0 14px #e7b04a55; opacity:1; }
.ptag{ position:absolute; top:-4px; right:-2px; background:var(--ouro); color:#1a1408; font-size:10px; font-weight:600; padding:1px 5px; }
.misterio img.vox, .hcard.misterio img{ filter: drop-shadow(0 0 6px #b071e0aa); animation: brilho 2.6s ease-in-out infinite; }
.hcard.misterio img{ filter: drop-shadow(0 0 6px #b071e0aa); }
@keyframes brilho{ 50%{ filter: drop-shadow(0 0 12px #e7b04acc); } }
.misterio .ln, .misterio .hn{ letter-spacing:4px; color:#c9a8f0; }
.tem.trava{ color:var(--fraco); font-size:11px; gap:4px; display:flex; align-items:center; justify-content:center; }
.dica{ margin:-4px 0 10px; }
.cod{ width:100%; background:#0c0f0f; color:var(--texto); border:0; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 3px var(--linha); padding:10px; font:12px/1.4 var(--corpo); word-break:break-all; resize:vertical; }
.gtxt{ padding:0 14px 12px; font-size:14px; line-height:1.5; color:var(--texto); }
.guia .area summary{ grid-template-areas:'n'; grid-template-columns:1fr; } .link{ background:none; border:0; color:var(--ouro); text-decoration:underline; padding:4px; min-height:32px; }
.provabar{ grid-column:1 / -1; display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid #3a3226; font-size:12px; color:var(--ouro); }
.provabar span{ flex:1; } .provabar .btn{ min-height:34px; padding:4px 10px; font-size:13px; }
.hcard img{ width:100%; max-width:120px; aspect-ratio:1; background:radial-gradient(#2a3231, #141918); }
.hcard.bloq img{ filter:brightness(.45) saturate(.6); }
.hcard .cad{ position:absolute; top:40px; left:50%; transform:translateX(-50%); width:28px; height:28px; }
.hcard.ativo{ box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro); }
.hn{ font-family:var(--titulo); font-weight:700; font-size:17px; line-height:1; } .hl{ font-size:11px; color:var(--fraco); min-height:2.4em; }
.hnv{ position:absolute; top:8px; left:8px; background:var(--ouro); color:#1a1408; font-size:11px; font-weight:600; padding:0 5px; }
.hcard .btn{ width:100%; min-height:40px; padding:6px; font-size:14px; }

/* conquistas */
.cgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:8px; }
.conq{ display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center; padding:10px 12px; background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; color:var(--fraco); }
.conq .ci{ width:28px; height:28px; } .conq.ok{ color:var(--texto); box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #7a5a1e; } .cn{ font-weight:600; } .cd{ font-size:12px; }
.conq:not(.ok) .ci{ opacity:.5; }

/* diário */
.dia{ background:#0c0f0f; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #2a2620; padding:10px 14px; margin-bottom:8px; }
.dh{ display:flex; justify-content:space-between; font-family:var(--titulo); font-weight:700; font-size:19px; margin-bottom:4px; } .dh b{ font-weight:400; color:var(--ouro); }
.de{ display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid #2a2620; font-size:14px; }
.de b{ font-variant-numeric:tabular-nums; color:var(--ouro); min-width:3ch; text-align:right; } .neg{ color:var(--ruim) !important; }

/* história: mapa do capítulo e leitura */
.hchamada{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#2a2010; color:var(--texto); border:0; padding:10px 12px; margin-bottom:10px; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro); animation:hpulsa 1.6s ease-in-out infinite; cursor:pointer; font:inherit; }
.hchamada b{ color:var(--ouro); }
.hcaps{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; }
.hcaps .btn{ min-height:40px; padding:4px 12px; font-size:14px; flex:0 0 auto; flex-direction:column; gap:0; line-height:1.1; opacity:.7; } .hcaps .btn small{ font-size:11px; color:#e8dcc0; }
.hcaps .btn.on{ opacity:1; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px var(--ouro); }
.hcab{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:8px; } .hcab h3{ font-family:var(--titulo); font-weight:700; font-size:24px; margin:2px 0; line-height:1.05; color:var(--ouro); }
.hcab .btn{ min-height:38px; padding:4px 12px; font-size:14px; flex:0 0 auto; }

/* celular: tudo numa tela só. Palco cheio, HUD enxuto em cima, barra de seções embaixo; cada seção abre numa folha por cima do palco */
.folhaTopo{ display:none; }
@media (max-width: 860px){
  html:has(#jogo:not([hidden])), body:has(#jogo:not([hidden])){ overflow:hidden; height:100%; overscroll-behavior:none; }
  /* preso na tela: no iPhone a página inteira ainda rolava/quicava junto ao arrastar a barra de seções */
  #jogo{ position:fixed; inset:0; display:flex; flex-direction:column; height:auto; min-height:0; overflow:hidden; overscroll-behavior:none; }
  #tabs{ touch-action:pan-x; overscroll-behavior:contain; }
  #conteudo{ touch-action:pan-y; }
  .topo, .placa, .petbox{ touch-action:none; }
  .topo{ flex-wrap:nowrap; gap:6px; padding:6px 10px; padding-top:max(6px, env(safe-area-inset-top)); }
  .marca{ display:none; }
  .nivelG{ order:0; flex:1 1 auto; flex-basis:auto; min-width:0; gap:6px; }
  .nivelG .lv{ font-size:20px; } .nivelG small{ font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat{ font-size:14px; gap:3px; } .stat img.px{ width:18px !important; height:18px !important; }
  .ib{ min-width:36px; min-height:36px; padding:2px; font-size:14px; } .ib img.px{ width:18px; height:18px; }
  #btnNuvem{ min-height:32px; padding:2px 8px; font-size:12px; }
  .main{ flex:1 1 auto; min-height:0; position:relative; display:block; padding:0; gap:0; }
  .palco{ position:absolute; inset:0; height:auto; display:block; }
  #palco3d{ position:absolute; inset:0; height:auto; min-height:0; }
  .placa{ position:absolute; left:8px; right:8px; bottom:calc(66px + env(safe-area-inset-bottom)); width:auto; padding:6px 10px; gap:2px 10px; }
  .placa .pnome{ font-size:18px; } .placa .plema{ margin-bottom:2px; font-size:11px; } .placa .trocar{ min-height:34px; padding:4px 10px; }
  .petbox{ position:absolute; top:8px; left:8px; right:8px; bottom:auto; width:auto; padding:6px 10px; font-size:13px; z-index:3; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:6px; }
  .petbox div{ flex-wrap:nowrap; } .petbox .btn{ min-height:34px; padding:4px 10px; font-size:12px; flex:0 0 auto; }
  .painel{ position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; max-height:none; z-index:5; clip-path:none; border-width:3px 0 0; }
  #tabs{ order:3; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:6px 8px; padding-bottom:max(6px, env(safe-area-inset-bottom)); border-bottom:0; border-top:3px solid var(--linha); }
  #tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 62px; min-height:50px; padding:6px 2px 4px; font-size:9.5px; } .tab img{ width:20px; height:20px; }
  #jogo:not(.folha) .tab.on{ background:#1e2524; color:var(--fraco); }
  #conteudo, .folhaTopo{ display:none; }
  #jogo.folha .painel{ top:34%; }
  #jogo.folha .folhaTopo{ order:1; display:flex; align-items:center; justify-content:flex-end; position:relative; min-height:30px; padding:0 4px; background:#0c0f0f; border-bottom:2px solid #000; }
  #jogo.folha .folhaTopo::before{ content:''; position:absolute; left:50%; top:12px; width:44px; height:5px; margin-left:-22px; background:var(--linha); }
  #folhaNome{ display:none; } #btnFechaFolha{ min-height:30px; min-width:40px; font-size:16px; color:var(--fraco); }
  #jogo.folha #conteudo{ order:2; display:block; flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:12px; }
  #jogo.folha .placa, #jogo.folha .petbox{ display:none; }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

const DL_VERSAO = "2026.10.13-1120";
const DL_RETRATOS = "e79c724d44";

/* ===== Voxel v2: bonecos esculpidos em meia resolução (voxel = 0,5 do mundo) ===== */
const VS = 0.5;
// pivôs em coordenadas de voxel (canto), x esquerda(-)/direita(+), y cima, z frente(+)
const PIV = { head:[0,44,0], torso:[0,0,0], armL:[-12.5,41,-0.5], armR:[12.5,41,-0.5], legL:[-4,24,0], legR:[4,24,0], costas:[0,0,0] };
// caixa da cabeça
const HX0=-8, HX1=7, HY0=45, HY1=60, HZ0=-7, HZ1=6;

class VModel {
  constructor(){ this.parts = {}; for (const k in PIV) this.parts[k] = new Map(); this.pose = {}; this.hairOrig = new Map(); }
  set(p,x,y,z,c){ if (c) this.parts[p].set(x+','+y+','+z, c); }
  get(p,x,y,z){ return this.parts[p].get(x+','+y+','+z); }
  has(p,x,y,z){ return this.parts[p].has(x+','+y+','+z); }
  del(p,x,y,z){ this.parts[p].delete(x+','+y+','+z); }
  box(p,x0,x1,y0,y1,z0,z1,c){
    for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++) for (let z=z0;z<=z1;z++)
      this.set(p,x,y,z, typeof c==='function' ? c(x,y,z) : c);
  }
  // cabelo: guarda a cor que estava embaixo pra poder tirar depois (elmo, chapéu)
  hair(x,y,z,c){
    if (!c) return; const k=x+','+y+','+z, map=this.parts.head;
    if (!this.hairOrig.has(k)) this.hairOrig.set(k, map.has(k) ? map.get(k) : null);
    map.set(k,c);
  }
  clearHair(f){
    for (const [k,o] of [...this.hairOrig]){
      const [x,y,z]=k.split(',').map(Number); if (!f(x,y,z)) continue;
      if (o) this.parts.head.set(k,o); else this.parts.head.delete(k);
      this.hairOrig.delete(k);
    }
  }
}

const hash3 = (x,y,z)=>{ let h = (x*374761393 + y*668265263 + z*2147483647) | 0; h = (h ^ (h>>>13)) * 1274126177 | 0; return ((h ^ (h>>>16)) >>> 0) / 4294967295; };
function shade(hex, f){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const k = 1+f; r=Math.max(0,Math.min(255,Math.round(r*k))); g=Math.max(0,Math.min(255,Math.round(g*k))); b=Math.max(0,Math.min(255,Math.round(b*k)));
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
const nz = (c,amt,p)=> (x,y,z)=> hash3(x,y,z) > (p||0.8) ? shade(c,-(amt||0.1)) : c;   // cor com leve ruído
const cf = (c)=> typeof c==='function' ? c : ()=>c;

// caixa arredondada: chanfro c nas quinas verticais, topo/base arredondados se rt/rb
function inRB(x,y,z, x0,x1,y0,y1,z0,z1, c, rt, rb){
  if (x<x0||x>x1||y<y0||y>y1||z<z0||z>z1) return false;
  const ex=Math.min(x-x0,x1-x), ez=Math.min(z-z0,z1-z);
  if (ex+ez < c) return false;
  if (rt && y===y1 && (ex<1||ez<1||ex+ez<c+1)) return false;
  if (rb && y===y0 && (ex<1||ez<1||ex+ez<c+1)) return false;
  return true;
}
function rbox(m,p,x0,x1,y0,y1,z0,z1,c,col,rt,rb){
  const f=cf(col);
  for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++) for (let z=z0;z<=z1;z++)
    if (inRB(x,y,z,x0,x1,y0,y1,z0,z1,c,rt,rb)) m.set(p,x,y,z,f(x,y,z));
}
// casca: dilata a peça em x/z dentro da faixa y0..y1 (t voxels); top/bot fecham por cima/baixo
function shell(m,p,y0,y1,t,col,o){
  o=o||{}; const f=cf(col), map=m.parts[p], add=new Map();
  for (const k of map.keys()){
    const [x,y,z]=k.split(',').map(Number);
    if (y<y0||y>y1) continue;
    if (o.src && !o.src(x,y,z)) continue;
    for (let dx=-t;dx<=t;dx++) for (let dz=-t;dz<=t;dz++){
      if (t>1 && Math.abs(dx)===t && Math.abs(dz)===t) continue;
      const nx=x+dx, nzz=z+dz, kk=nx+','+y+','+nzz; if (map.has(kk)) continue;
      add.set(kk,[nx,y,nzz]);
    }
    if (o.top && !map.has(x+','+(y+1)+','+z) && y===y1) for (let d=1;d<=o.top;d++) add.set(x+','+(y+d)+','+z,[x,y+d,z]);
    if (o.bot && !map.has(x+','+(y-1)+','+z) && y===y0) for (let d=1;d<=o.bot;d++) add.set(x+','+(y-d)+','+z,[x,y-d,z]);
  }
  // tampa expandida (a borda dilatada também ganha tampa)
  if (o.top){ for (const [kk,[x,y,z]] of [...add]) if (y===y1) for (let d=1;d<=o.top;d++){ const k2=x+','+(y+d)+','+z; if (!map.has(k2)) add.set(k2,[x,y+d,z]); } }
  for (const [kk,[x,y,z]] of add){ if (o.f && !o.f(x,y,z)) continue; const c=f(x,y,z); if (c) map.set(kk,c); }
}
function paint(m,p,f,col){ const g=cf(col), map=m.parts[p]; for (const k of [...map.keys()]){ const [x,y,z]=k.split(',').map(Number); if (f(x,y,z)){ const c=g(x,y,z,map.get(k)); if (c) map.set(k,c); } } }
// anel oco por faixa de y com meia-largura variável (saia, manto, cauda)
function skirt(m,p,y0,y1,hw,col,open){
  const f=cf(col);
  for (let y=y0;y<=y1;y++){
    const [ax,az] = hw(y), x0=Math.floor(-ax), x1=Math.ceil(ax)-1, z0=Math.floor(-az), z1=Math.ceil(az)-1;
    for (let x=x0;x<=x1;x++) for (let z=z0;z<=z1;z++){
      const ex=Math.min(x-x0,x1-x), ez=Math.min(z-z0,z1-z);
      if (ex+ez<2) continue;
      const border = ex===0||ez===0||(ex+ez===2);
      if (!border) continue;
      if (open && open(x,y,z)) continue;
      m.set(p,x,y,z,f(x,y,z));
    }
  }
}
function frontZ(m,p,x,y){ let b=null; for (let z=-14;z<=14;z++) if (m.has(p,x,y,z)) b=z; return b; }
function backZ(m,p,x,y){ for (let z=-14;z<=14;z++) if (m.has(p,x,y,z)) return z; return null; }
const both = (fn)=>{ fn('armL',-1); fn('armR',1); };     // braço esquerdo/direito (s = lado)
const legs = (fn)=>{ fn('legL',-1); fn('legR',1); };
const ax = (s,x)=> s<0 ? x : -1-x;   // espelha x do lado esquerdo pro direito

/* ---------- corpo ---------- */
// cortes do tronco: [y0,y1, meia-largura x, z0, z1]
function torsoRows(f){
  return f ? [[24,27,8,-3,2],[28,31,6,-3,2],[32,35,7,-4,3],[36,40,8,-4,3],[41,42,7,-3,2]]
           : [[24,27,8,-3,2],[28,31,7,-3,2],[32,35,8,-4,3],[36,40,9,-4,3],[41,42,8,-3,2]];
}
function paintBody(m,h,semClasse){
  const S=h.skin, SD=shade(S,-0.15), f=h.sexo==='f';
  const shirt=h.shirt, sleeve=h.sleeve||shirt, pants=h.pants, boots=h.boots||'#3a2a1c', belt=h.belt||'#4a2e1a';
  const furry = h.raca==='lobo';
  // pernas + botas
  legs((p,s)=>{
    const x0 = s<0 ? -7 : 1, x1 = x0+5;
    rbox(m,p,x0,x1,7,23,-3,2,1,(x,y,z)=> y===7||y===8 ? shade(pants,-0.12) : (y===15&&z===2? shade(pants,-0.1) : nz(pants,0.08,0.85)(x,y,z)));

    rbox(m,p,x0,x1,0,2,4,5,1,(x,y,z)=> y===0 ? shade(boots,-0.35) : boots, true);
  });
  // tronco
  for (const [y0,y1,hw,z0,z1] of torsoRows(f)){
    rbox(m,'torso',-hw,hw-1,y0,y1,z0,z1, y0>=36?2:1, (x,y,z)=>{
      if (y<=27) return nz(pants,0.08)(x,y,z);
      if (y===28) return shade(shirt,-0.14);
      return nz(shirt,0.08,0.85)(x,y,z);
    }, y1===42);
  }
  // decote, pescoço
  rbox(m,'torso',-3,2,43,44,-2,1,0,(x,y,z)=> y===43?SD:S);
  m.box('torso',-2,1,39,40,3,3,S); m.box('torso',-1,0,38,38,3,3,S); m.box('torso',-2,1,41,42,2,2,S);
  // cinto com fivela
  shell(m,'torso',26,27,1,(x,y,z)=> nz(belt,0.12)(x,y,z));
  m.box('torso',-2,1,25,28,4,4,(x,y,z)=> (x>=-1&&x<=0&&y>=26&&y<=27) ? '#6a4a1a' : '#e2b04a');
  // braços
  both((p,s)=>{
    const x0 = s<0 ? -16 : 10, x1 = x0+5;
    const bx0 = s<0 ? -15 : 10, bx1 = bx0+4;
    rbox(m,p,bx0,bx1,28,42,-3,1,1,(x,y,z)=> y===28 ? shade(sleeve,-0.15) : nz(sleeve,0.08,0.85)(x,y,z), true);
    // mão (punho fechado com polegar)
    const hc = furry ? shade(S,-0.05) : S;

function paintHair(m,h){
  if (h.raca==='lobo' || !h.hair) return;
  const c=h.hair, cd=shade(c,-0.2), cl=shade(c,0.12), st=h.cabelo;
  const hc=(x,y,z)=>{ const r=hash3(x,y,z); return r>0.82?cd:(r<0.1?cl:c); };
  const Z=HZ1;
  // volume: caixa externa 1 voxel além da cabeça + tampa
  const vol=(mask, pad)=>{
    pad = pad==null ? 1 : pad;
    for (let x=HX0-pad;x<=HX1+pad;x++) for (let y=44;y<=HY1+pad+1;y++) for (let z=HZ0-pad;z<=HZ1+pad;z++){
      const outer = inRB(x,y,z,HX0-pad,HX1+pad,44,HY1+pad,HZ0-pad,HZ1+pad,3,true) || (y===HY1+pad+1 && inRB(x,y,z,HX0+2,HX1-2,y,y,HZ0+2,HZ1-2,2));
      if (!outer) continue;
      const inside = inRB(x,y,z,HX0+1,HX1-1,45,HY1-1,HZ0+1,HZ1-1,2);
      if (inside) continue;
      if (!mask(x,y,z)) continue;
      m.hair(x,y,z,hc(x,y,z));
    }
  };
  const side=(x)=> x<=HX0||x>=HX1;
  const curto=(x,y,z)=>{
    const outX = x<HX0||x>HX1;
    if (outX && z>=-1 && z<=1 && y>=49 && y<=53) return false;   // orelha
    if (y>=58) return true;
    if (z>=Z && y>=57 && x>=-7 && x<=6) return true;               // franja
    if (z>=Z && y===56 && x>=-7 && x<=6 && hash3(x,7,3)>0.6) return true;
    if (z<=-1 && y>=48) return true;                                 // nuca
    if (side(x) && z<=2 && y>=54) return true;
    if (side(x) && z<=2 && z>=1 && y>=48) return true;              // costeleta
    return false;
  };
  if (st==='raspado' || st==='moicano'){
    paint(m,'head',(x,y,z)=> (y>=57) || (z<=-1&&y>=49) || ((x<=HX0||x>=HX1)&&z<=1&&y>=54), (x,y,z)=> hash3(x,y,z)>0.5? shade(c,0.05): cd);
    if (st==='moicano') for (let z=HZ0;z<=HZ1-1;z++) for (let y=HY1+1;y<=HY1+4;y++) for (let x=-1;x<=0;x++){ if (y>HY1+2 && (z+40)%3===0) continue; m.hair(x,y,z, y===HY1+4?cl:hc(x,y,z)); }
    return;
  }
  if (st==='afro'){
    for (let x=-12;x<=11;x++) for (let y=46;y<=67;y++) for (let z=-12;z<=9;z++){
      const dx=(x+0.5)/11.5, dy=(y-57)/10, dz=(z+1.5)/10.5;
      const r=dx*dx+dy*dy+dz*dz; if (r>1 - hash3(x,y,z)*0.06) continue;
      if (inRB(x,y,z,HX0+1,HX1-1,45,HY1-1,HZ0+1,HZ1-1,2)) continue;
      if (z>=HZ1-1 && y<57 && x>=HX0 && x<=HX1) continue;   // rosto
      if (y<51 && z>-3) continue;
      if (r<0.75 && !(z>=HZ1-1)) { if (m.has('head',x,y,z)) {} }
      m.hair(x,y,z, hash3(x,y,z)>0.55? c : cd);
    }
    return;
  }
  if (st==='cacheado'){
    vol(curto);
    for (let x=HX0-2;x<=HX1+2;x++) for (let y=50;y<=HY1+3;y++) for (let z=HZ0-2;z<=HZ1;z++){
      if (m.has('head',x,y,z)) continue;
      const near = m.hairOrig.has((x+1)+','+y+','+z)||m.hairOrig.has((x-1)+','+y+','+z)||m.hairOrig.has(x+','+(y-1)+','+z)||m.hairOrig.has(x+','+y+','+(z+1))||m.hairOrig.has(x+','+y+','+(z-1));
      if (near && hash3(x,y,z)>0.55 && !(z>=HZ1-1 && y<58)) m.hair(x,y,z, hash3(z,x,y)>0.5?c:cl);
    }
    return;
  }
  vol(curto);
  if (st==='longo' || st==='trancas'){
    // cortina de trás até o meio das costas + mechas nos lados
    for (let x=HX0-1;x<=HX1+1;x++) for (let y=36;y<=50;y++) for (let z=HZ0-1;z<=HZ0;z++){
      const ex=Math.min(x-(HX0-1),(HX1+1)-x); if (y<40 && ex<1) continue; if (y<38 && (x+y)%3===0) continue;
      const tr = st==='trancas' ? (((x+40)%3===2) ? cd : ((y+x)%2? c : cl)) : hc(x,y,z);
      m.hair(x,y,z,tr);
    }
    for (const s of [-1,1]){ const x = s<0? HX0-1 : HX1+1; for (let y=40;y<=53;y++) for (let z=0;z<=3;z++){ if (y<43 && z===3) continue; if (z>=2 && y>=49) continue; m.hair(x,y,z, st==='trancas' ? (y%2?c:cd) : hc(x,y,z)); } }
    if (st==='trancas') for (const x of [HX0-1,HX1+1]) for (let y=36;y<=39;y++) m.hair(x,y,1, y===36? '#e2b04a' : (y%2?c:cd));
  }
  if (st==='rabo'){
    m.box('head',-1,0,53,55,HZ0-2,HZ0-2,'#7a1f24');
    for (let y=38;y<=54;y++){ const w = y>50?1:(y>42?1:0); for (let x=-1-w;x<=w;x++) for (let z=HZ0-4;z<=HZ0-2;z++){ if (y<=52 && z===HZ0-2) continue; if (y<44 && (x===-1-w||x===w) && z===HZ0-4) continue; m.hair(x,y,z, y%3===0?cd:hc(x,y,z)); } }
  }
  if (st==='coque'){
    for (let x=-4;x<=3;x++) for (let y=HY1+1;y<=HY1+7;y++) for (let z=-6;z<=1;z++){ const dx=(x+0.5)/4, dy=(y-HY1-4)/3.5, dz=(z+2.5)/4; if (dx*dx+dy*dy+dz*dz<=1) m.hair(x,y,z,hc(x,y,z)); }

  }
}

function buildVModel(h, equip, opts){

  const eq = equip || {};

  let antes = null; const guarda = ()=>{ antes = { L:new Map(m.parts.armL), R:new Map(m.parts.armR) }; };
  for (const s of order){
    if (s==='arma') guarda();
    const id = eq[s]; if (!id) continue; const it = ITEM[id]; if (!it) continue;
    const cor = Object.assign({}, it.c, (opts.cor||{})[id]||{});
    P[it.p](m, cor);
  }
  if (!eq.arma && h.arma && WEAPONS[h.arma]) WEAPONS[h.arma](m);

  for (const L of ['L','R']){ const arm=m.parts['arm'+L], ant=antes[L], sep=new Map(); arm.forEach((c,k)=>{ if (ant.get(k)!==c) sep.set(k,c); }); sep.forEach((c,k)=>{ if (ant.has(k)) arm.set(k, ant.get(k)); else arm.delete(k); }); m.parts['arma'+L]=sep; }
  m.pose.armR = (eq.arma ? ITEM[eq.arma].c.k : h.arma);
  { const id = eq.arma || h.arma, c = eq.arma ? ITEM[eq.arma].c : null;
    const base = { marteloBase:'hammer', machadoBase:'axe', lanca:'spear', varinha:'wand', pincelBase:'brush' };
    m.arma = { id, k: c ? c.k : (base[id] ? 'pole' : id), kind: c ? (c.kind||'') : (base[id]||''), small: id==='marteloBase' || id==='varinha' || id==='maca' }; }
  estilizar(m,h,opts.leve);

}

      if (y<PERNA_Y0) novo.set(k,c);

    m.parts[p] = novo;
  }

  { id:'pLacinho', slot:'pcabeca', nome:'Lacinho', rar:'comum', preco:50, c:{a:'#e05a9a'} },
  { id:'pColeira', slot:'ppescoco', nome:'Coleira de Couro', rar:'comum', preco:60, c:{a:'#7a3a1e'} },
  { id:'pCachecol', slot:'ppescoco', nome:'Cachecol de Lã', rar:'raro', preco:140, c:{a:'#c0392b', b:'#f2efe6'} },
  { id:'pChapeu', slot:'pcabeca', nome:'Chapéu de Festa', rar:'raro', preco:160, c:{a:'#3a7ad0', b:'#e7b04a'} },
  { id:'pElmo', slot:'pcabeca', nome:'Elminho de Cavaleiro', rar:'epico', preco:380, c:{a:'#9aa3a8'} },
  { id:'pCoroa', slot:'pcabeca', nome:'Coroinha Real', rar:'epico', preco:420, c:{a:'#e7b04a'} }

const PET_ITEM = Object.fromEntries(PET_ITENS.map(i=>[i.id,i]));
// âncoras: topo da cabeça (x,y,z) e anel do pescoço (centro, raio, eixo)
const PET_ANC = {
  cachorro:{ top:[-0.5,19,7], neck:{c:[-0.5,11,5.5], r:4.6, ax:'y'} },
  gato:{ top:[-0.5,17,6], neck:{c:[-0.5,9,4], r:4.2, ax:'y'} },
  passaro:{ top:[0,19,2], neck:{c:[0,12,1.5], r:3.9, ax:'y'} },
  peixe:{ top:[0,19,1], neck:{c:[0,14,3], r:4.2, ax:'z'} }
};
function ellip(m,cx,cy,cz,rx,ry,rz,col){ const f=cf(col); for (let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx);x++) for (let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry);y++) for (let z=Math.floor(cz-rz-1);z<=Math.ceil(cz+rz);z++){ const dx=(x+0.5-cx)/rx, dy=(y+0.5-cy)/ry, dz=(z+0.5-cz)/rz; if (dx*dx+dy*dy+dz*dz<=1) m.set('torso',x,y,z,f(x,y,z)); } }
function paintPet(m,tipo,cor){
  const c=cor, cd=shade(c,-0.22), cl=shade(c,0.18), T='torso';
  const fur=(x,y,z)=> hash3(x,y,z)>0.82? cd : c;
  const eyes=(xs,y,z,iris)=>{ for (const x of xs){ m.set(T,x,y,z,iris||'#141414'); m.set(T,x,y+1,z,'#141414'); } m.set(T,xs[0],y+1,z,'#ffffff'); m.set(T,xs[xs.length-1],y+1,z,'#ffffff'); };
  if (tipo==='cachorro'){
    rbox(m,T,-4,3,6,12,-8,5,1,fur,true);
    m.box(T,-3,2,6,7,-5,3,(x,y,z)=> shade(c,0.12));
    for (const [x0,z0] of [[-4,-8],[2,-8],[-4,3],[2,3]]) rbox(m,T,x0,x0+1,0,6,z0,z0+2,0,(x,y,z)=> y<=1? cl : c);
    rbox(m,T,-4,3,11,18,4,10,1,fur,true);
    rbox(m,T,-2,1,11,14,10,13,1,(x,y,z)=> shade(c,0.15),true);
    m.box(T,-1,0,14,14,13,13,'#141414'); m.box(T,-1,0,13,13,14,14,'#141414');
    m.box(T,-1,0,11,11,13,13,'#a83a3a');
    eyes([-3,-2],15,11); eyes([1,2],15,11);
    for (const x of [-5,4]) m.box(T,x,x,12,17,5,8,(xx,y,z)=> y===12? shade(cd,-0.1) : cd);
    for (let y=11;y<=16;y++) m.set(T,-1+Math.round((y-11)/3),y,-9-(y>13?1:0),fur(0,y,0)); m.set(T,0,17,-11,cl);
  }
  if (tipo==='gato'){
    rbox(m,T,-3,2,5,10,-6,4,1,fur,true);
    for (const [x0,z0] of [[-3,-6],[1,-6],[-3,2],[1,2]]) m.box(T,x0,x0+1,0,5,z0,z0+1,(x,y)=> y<=1? cl : c);
    rbox(m,T,-4,3,9,16,3,9,2,fur,true);
    for (const s of [-1,1]){ const x0 = s<0? -4 : 1; m.box(T,x0,x0+2,17,17,4,6,c); m.box(T,x0+(s<0?0:1),x0+(s<0?1:2),18,18,5,6,c); m.set(T, s<0? x0 : x0+2, 19,5,c); m.set(T,x0+1,17,7,'#e8a0a8'); }
    eyes([-3,-2],12,10,'#5ac05a'); eyes([1,2],12,10,'#5ac05a');
    m.box(T,-1,0,11,11,10,10,'#e88a9a'); m.box(T,-1,0,10,10,10,10,shade(c,0.15));
    for (const x of [-5,4]) for (const y of [10,11]) m.set(T,x,y,9,'#f2efe6');
    for (let i=0;i<12;i++){ const y=6+i, z=-7-Math.round(Math.sin(i/11*Math.PI)*2), x=i>8? (i-8) : 0; m.box(T,x-1,x,y,y,z,z, i>9? cl : c); }
  }
  if (tipo==='passaro'){
    ellip(m,0,9,0,4.2,4.8,4.6,(x,y,z)=> y<8 && z>0 ? cl : fur(x,y,z));
    ellip(m,0,15,2,3.4,3.4,3.4,fur);
    m.box(T,-1,0,14,15,5,6,'#e8a03a'); m.box(T,-1,0,14,14,7,7,'#c8801a');
    eyes([-3],15,4); eyes([2],15,4);
    for (const x of [-5,4]) for (let y=6;y<=12;y++) for (let z=-4;z<=2;z++){ if (y>11 && z<-2) continue; if ((y-6)+(2-z)>10) continue; m.set(T,x,y,z, (z+y)%3===0? shade(cd,-0.1) : cd); }
    for (let y=5;y<=9;y++) m.box(T,-2+(y>7?1:0),1-(y>7?1:0),y,y,-5-(y-5),-5-(y-5),cd);
    for (const x of [-2,1]) { m.box(T,x,x,0,4,0,0,'#e8a03a'); m.box(T,x-1,x+1,0,0,1,2,'#e8a03a'); }
    m.box(T,-1,0,18,19,1,2,cd);
  }
  if (tipo==='peixe'){
    ellip(m,0,14,0,2.6,4.2,6.2,(x,y,z)=> y<12? cl : fur(x,y,z));
    for (let z=-6;z>=-11;z--){ const h=Math.round((-6-z)*0.9)+1; for (let y=14-h;y<=13+h;y++) m.set(T,-1,y,z,(y+z)%2? cd : c); m.set(T,0,13,z,cd); }
    for (let z=-3;z<=2;z++){ const h=Math.max(0,3-Math.abs(z+1)); for (let y=18;y<=18+h;y++) m.set(T,-1,y,z,cd); m.set(T,0,18,z,cd); }
    for (const s of [-1,1]){ const x = s<0? -3 : 2; m.set(T,x,15,3,'#141414'); m.set(T,x,16,3,'#ffffff'); m.box(T, s<0? -4 : 3, s<0? -4 : 3, 12,13,0,1,cd); }
    m.box(T,-1,0,13,13,6,6,'#a83a3a');
  }
}
function paintPetItem(m,tipo,it){
  const A=PET_ANC[tipo], c=it.c, T='torso';
  const ring=(col)=>{ const n=A.neck, [cx,cy,cz]=n.c; const f=cf(col);
    for (let a=-8;a<=8;a++) for (let b=-8;b<=8;b++) for (let w=0;w<=1;w++){
      if (n.ax==='y'){ const x=Math.floor(cx)+a, z=Math.floor(cz)+b, y=cy+w, d=Math.hypot(x+0.5-cx-0.5,z+0.5-cz); if (d>=n.r-0.6 && d<=n.r+0.4) m.set(T,x,y,z,f(x,y,z)); }
      else { const x=Math.floor(cx)+a, y=Math.floor(cy)+b, z=Math.floor(cz)+w, d=Math.hypot(x+0.5-cx,y+0.5-cy); if (d>=n.r-0.6 && d<=n.r+0.4) m.set(T,x,y,z,f(x,y,z)); }
    } };
  const [tx,ty,tz]=A.top, X=Math.floor(tx+0.5), Z=Math.round(tz);
  if (it.id==='pColeira'){ ring(c.a); const n=A.neck; if (n.ax==='y') m.set(T,Math.floor(n.c[0]+0.5),n.c[1]-1,Math.floor(n.c[2]+n.r),'#e7c03a'); else m.set(T,0,n.c[1]-Math.round(n.r),n.c[2]+1,'#e7c03a'); }
  if (it.id==='pCachecol'){ ring((x,y,z)=> (x+z+y)%2? c.a : c.b); const n=A.neck; if (n.ax==='y') { const x=Math.floor(n.c[0]+0.5)+2, z=Math.floor(n.c[2]+n.r); for (let y=n.c[1]-3;y<n.c[1];y++) m.set(T,x,y,z,(y%2)? c.a : c.b); } }
  if (it.id==='pLacinho'){ m.set(T,X,ty,Z,shade(c.a,-0.2)); m.box(T,X-2,X-1,ty,ty+1,Z,Z,c.a); m.box(T,X+1,X+2,ty,ty+1,Z,Z,c.a); }
  if (it.id==='pChapeu'){ for (let i=0;i<7;i++){ const r=2.6-i*0.38; for (let x=X-3;x<=X+3;x++) for (let z=Z-3;z<=Z+3;z++) if (Math.hypot(x-X,z-Z)<=r) m.set(T,x,ty+i,z, (i%2)? c.b : c.a); } m.set(T,X,ty+7,Z,'#f2efe6'); }
  if (it.id==='pElmo'){ for (let x=X-3;x<=X+3;x++) for (let z=Z-3;z<=Z+3;z++) for (let y=ty-1;y<=ty+2;y++){ const d=Math.hypot(x-X,z-Z); if (d<=3.2 && (y<ty+2 || d<=2.2)) m.set(T,x,y,z, y===ty-1? shade(c.a,-0.2) : c.a); } m.box(T,X,X,ty+3,ty+5,Z-1,Z+1,'#c0392b'); }
  if (it.id==='pCoroa'){ for (let x=X-2;x<=X+2;x++) for (let z=Z-2;z<=Z+2;z++){ if (Math.abs(x-X)<2 && Math.abs(z-Z)<2) continue; m.set(T,x,ty,z,c.a); if ((x+z)%2===0) m.set(T,x,ty+1,z,shade(c.a,0.2)); } m.set(T,X,ty+1,Z+2,'#c0392b'); }
}
// partes móveis de cada pet (pra animar): head = cabeça, armL/armR = rabo ou asas, legL/legR = patas, nadadeiras ou cauda
// pivôs em voxel; a posição parada não muda com o pivô (só o giro)
// cachorro e gato: 4 patas soltas (pFL frente-esq, pFR frente-dir, pBL trás-esq, pBR trás-dir) e cauda; pássaro: asas, cauda e 2 pés
const PET_PIV = {
  cachorro:{ head:[-0.5,12,5], cauda:[0,12,-8.5], pFL:[-3.5,6,4], pFR:[2.5,6,4], pBL:[-3.5,6,-7], pBR:[2.5,6,-7] },
  gato:{ head:[-0.5,10,4], cauda:[0,7,-6.5], pFL:[-2.5,5,2.5], pFR:[1.5,5,2.5], pBL:[-2.5,5,-5.5], pBR:[1.5,5,-5.5] },
  passaro:{ head:[0,12,1.5], armL:[-4.5,11.5,-1], armR:[4.5,11.5,-1], cauda:[0,7.5,-4.5], pFL:[-2,4.5,0.5], pFR:[1,4.5,0.5] },
  peixe:{ cauda:[0,14,-5.5], legL:[-3.5,13,0.5], legR:[3,13,0.5] }
};
function parteDoPet(tipo,x,y,z){
  if (tipo==='cachorro'){ if (z<=-9) return 'cauda'; if (y<=5) return (z>=0 ? 'pF' : 'pB')+(x<0 ? 'L' : 'R'); if (z>=4 && y>=11) return 'head'; }
  if (tipo==='gato'){ if (z<=-7) return 'cauda'; if (y<=4) return (z>=0 ? 'pF' : 'pB')+(x<0 ? 'L' : 'R'); if (z>=3 && y>=9) return 'head'; }
  if (tipo==='passaro'){ if (x<=-5) return 'armL'; if (x>=4) return 'armR'; if (y>=13 && z>=-1) return 'head'; if (z<=-5 && y>=5 && y<=9) return 'cauda'; if (y<=4) return x<0 ? 'pFL' : 'pFR'; }
  if (tipo==='peixe'){ if (z<=-6) return 'cauda'; if (x<=-4 && y<=13) return 'legL'; if (x>=3 && y<=13) return 'legR'; }
  return 'torso';
}
function buildPetVModel(p, extra){
  const corpo=new VModel(); paintPet(corpo,p.tipo,p.cor||PET[p.tipo].cores[0]);
  const m=new VModel(); m.pet=p.tipo; m.petInfo=p; for (const k in PET_PIV[p.tipo]) if (!m.parts[k]) m.parts[k]=new Map();
  corpo.parts.torso.forEach((c,k)=>{ const [x,y,z]=k.split(',').map(Number); m.parts[parteDoPet(p.tipo,x,y,z)].set(k,c); });
  const eq=Object.assign({}, p.equip||{}, extra||{});
  for (const s of ['ppescoco','pcabeca']) if (eq[s] && PET_ITEM[eq[s]]){
    const it=new VModel(); paintPetItem(it,p.tipo,PET_ITEM[eq[s]]);
    const parte = s==='pcabeca' && PET_PIV[p.tipo].head ? 'head' : 'torso';
    it.parts.torso.forEach((c,k)=>{ for (const q in m.parts) m.parts[q].delete(k); m.parts[parte].set(k,c); });
  }
  return m;
}
function buildPetItemVModel(it){
  const base=new VModel(); paintPet(base,'cachorro','#8a8f96');
  const m=new VModel(); paintPet(m,'cachorro','#8a8f96'); paintPetItem(m,'cachorro',it);
  const out=new VModel(); m.parts.torso.forEach((c,k)=>{ if (base.parts.torso.get(k)!==c) out.parts.torso.set(k,c); });
  return out;
}

/* ===== Render 3D (three.js): malha de voxels com oclusão ambiente por vértice ===== */
let MAT, MAT_SIL;
function initThree(){ MAT = new THREE.MeshLambertMaterial({ vertexColors:true }); }

const FACES = [
  { n:[1,0,0], u:[0,1,0], w:[0,0,1] }, { n:[-1,0,0], u:[0,1,0], w:[0,0,1] },
  { n:[0,1,0], u:[0,0,1], w:[1,0,0] }, { n:[0,-1,0], u:[0,0,1], w:[1,0,0] },
  { n:[0,0,1], u:[1,0,0], w:[0,1,0] }, { n:[0,0,-1], u:[1,0,0], w:[0,1,0] }
];
FACES.forEach(f=>{ const c=[f.u[1]*f.w[2]-f.u[2]*f.w[1], f.u[2]*f.w[0]-f.u[0]*f.w[2], f.u[0]*f.w[1]-f.u[1]*f.w[0]]; f.flip = (c[0]*f.n[0]+c[1]*f.n[1]+c[2]*f.n[2]) < 0; });
const AOL = [0.38, 0.6, 0.82, 1.0];
const colCache = {};
function rgbOf(hex){ if (colCache[hex]) return colCache[hex]; const c=new THREE.Color(hex); return colCache[hex]=[c.r,c.g,c.b]; }

// chave numérica do bloco (x,y,z entre -512 e 511): vizinho = soma, sem montar texto. Era o que mais pesava pra montar o boneco.
const PK = (x,y,z)=> (x*1024 + y)*1024 + z;
const PK_X = 1048576, PK_Y = 1024;
const _occN = new WeakMap();
function setNum(set){ let n = _occN.get(set); if (n) return n; n = new Set(); for (const k of set.keys()){ const a=k.indexOf(','), b=k.indexOf(',',a+1); n.add(PK(+k.slice(0,a), +k.slice(a+1,b), +k.slice(b+1))); } _occN.set(set, n); return n; }
FACES.forEach(f=>{ f.nk = f.n[0]*PK_X + f.n[1]*PK_Y + f.n[2]; f.uk = f.u[0]*PK_X + f.u[1]*PK_Y + f.u[2]; f.wk = f.w[0]*PK_X + f.w[1]*PK_Y + f.w[2]; });
const CANTOS = [[-1,-1],[1,-1],[1,1],[-1,1]];
function meshPart(map, occ, pv, sc, sil){
  const pos=[], nor=[], col=[], idx=[];
  const occN = setNum(occ), mapN = setNum(map);
  const ao=[0,0,0,0];
  map.forEach((c,k)=>{
    const a1=k.indexOf(','), b1=k.indexOf(',',a1+1), x=+k.slice(0,a1), y=+k.slice(a1+1,b1), z=+k.slice(b1+1), me=PK(x,y,z);
    const base = sil ? [0.07,0.065,0.09] : rgbOf(c);
    const j = sil ? 1 : 0.95 + hash3(x,y,z)*0.1;
    for (const f of FACES){
      const nb = me + f.nk;
      if (mapN.has(nb)) continue;
      const v0=pos.length/3;
      for (let q=0;q<4;q++){ const su=CANTOS[q][0], sw=CANTOS[q][1];
        const s1 = occN.has(nb + f.uk*su) ? 1:0;
        const s2 = occN.has(nb + f.wk*sw) ? 1:0;
        const cc = occN.has(nb + f.uk*su + f.wk*sw) ? 1:0;
        const a = (s1&&s2) ? 0 : 3-(s1+s2+cc); ao[q]=a;
        const px = x+0.5 + f.n[0]*0.5 + f.u[0]*0.5*su + f.w[0]*0.5*sw;
        const py = y+0.5 + f.n[1]*0.5 + f.u[1]*0.5*su + f.w[1]*0.5*sw;
        const pz = z+0.5 + f.n[2]*0.5 + f.u[2]*0.5*su + f.w[2]*0.5*sw;
        pos.push((px-pv[0])*sc, (py-pv[1])*sc, (pz-pv[2])*sc); nor.push(f.n[0],f.n[1],f.n[2]);
        const l = AOL[a]*j; col.push(base[0]*l, base[1]*l, base[2]*l);
      }
      const q = (ao[0]+ao[2] < ao[1]+ao[3]) ? [1,2,3,1,3,0] : [0,1,2,0,2,3];
      if (f.flip) idx.push(v0+q[0],v0+q[2],v0+q[1], v0+q[3],v0+q[5],v0+q[4]);
      else idx.push(v0+q[0],v0+q[1],v0+q[2], v0+q[3],v0+q[4],v0+q[5]);
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(pos.length/3 > 65000 ? new THREE.Uint32BufferAttribute(idx,1) : new THREE.Uint16BufferAttribute(idx,1));
  return g;
}
let MAT_ARMA = null;
function buildMesh(vm, o){
  o = o || {};
  const RES = vm.res || 1, sc = o.scale || VS/RES;
  const g = new THREE.Group(); const parts = {};
  const occ = new Set(); for (const name in vm.parts) if (name!=='armaL' && name!=='armaR') for (const k of vm.parts[name].keys()) occ.add(k);
  const malha = (map, pv)=>{ const mesh = new THREE.Mesh(meshPart(map, occ, pv, sc, o.sil), MAT); mesh.castShadow = true; mesh.receiveShadow = true; return mesh; };
  const sobra = 0;
  for (const name in vm.parts){
    if (name==='armaL' || name==='armaR') continue;   // arma segurada: vai junto com o antebraço
    const map = vm.parts[name], pv = o.pivot0 ? ((o.piv && o.piv[name]) || [0,0,0]) : ((vm.piv && vm.piv[name]) || PIV[name] || [0,0,0]);
    const pg = new THREE.Group(); pg.position.set(pv[0]*sc, pv[1]*sc, pv[2]*sc); pg.userData.base = [pv[0]*sc, pv[1]*sc, pv[2]*sc];
    if (!o.pivot0 && (name==='armL' || name==='armR')){
      // cotovelo: o que fica abaixo dele (antebraço, mão, luva) e a arma viram uma peça filha que dobra
      const lado = name==='armL' ? 'L' : 'R', cy = pv[1]-7*RES, fv = [pv[0], cy, pv[2]];
      const cima = new Map(), baixo = new Map();
      map.forEach((c,k)=>{ const y = +k.split(',')[1]; if (y>=cy-sobra) cima.set(k,c); if (y<cy+sobra) baixo.set(k,c); });
      const arma = vm.parts['arma'+lado];
      if (cima.size) pg.add(malha(cima, pv));
      const fg = new THREE.Group(); fg.position.set((fv[0]-pv[0])*sc, (fv[1]-pv[1])*sc, (fv[2]-pv[2])*sc); fg.userData.base = [fg.position.x, fg.position.y, fg.position.z]; fg.userData.piv = fv;
      if (baixo.size) fg.add(malha(baixo, fv));
      if (arma && arma.size){
        // arma: peça própria presa no punho (gira em volta do cabo dentro da mão, conforme a pegada de cada arma)
        let hy = 1e9; map.forEach((c,k)=>{ const y = +k.split(',')[1]; if (y<hy) hy = y; });
        const sx = name==='armL' ? -1 : 1, punho = [ (sx>0 ? GX+1 : -12.5) * RES, hy + 3*RES, (GZ+1)*RES ];
        if (!MAT_ARMA){ MAT_ARMA = MAT.clone(); MAT_ARMA.polygonOffset = true; MAT_ARMA.polygonOffsetFactor = 1; MAT_ARMA.polygonOffsetUnits = 2; }
        const ao = new Set(arma.keys()), mesh = new THREE.Mesh(meshPart(arma, ao, punho, sc, o.sil), o.sil ? MAT : MAT_ARMA);
        mesh.castShadow = true; mesh.receiveShadow = true;
        const pq = new THREE.Group(); pq.position.set((punho[0]-fv[0])*sc, (punho[1]-fv[1])*sc, (punho[2]-fv[2])*sc); pq.add(mesh);
        let y0 = 1e9, y1 = -1e9; arma.forEach((c,k)=>{ const y = +k.split(',')[1]; if (y<y0) y0 = y; if (y>y1) y1 = y; });
        // cabo: ponta de baixo (y0) e de cima (y1) em relação ao punho; desliza = quanto subir pra mão pegar no fim do cabo
        pq.userData = { mesh, baixo:(y0-punho[1])*sc, cima:(y1+1-punho[1])*sc, desliza:(punho[1] - (y0 + 3*RES))*sc };
        fg.add(pq); parts['pega'+lado] = pq;
      }

function platform(tema){
  const P = PLAT[tema] || PLAT.castelo;
  const vm = new VModel(); const R=23;
  for (let x=-R;x<=R;x++) for (let z=-R;z<=R;z++){
    const r = Math.hypot(x+0.5,z+0.5); if (r>R) continue;
    let top;
    if (P.tipo==='lajes'){
      // lajotas: grade irregular com rejunte
      const gx = Math.floor((x+100 + (Math.floor((z+100)/5)%2)*3)/6), gz = Math.floor((z+100)/5);
      const rej = ((x+100 + (Math.floor((z+100)/5)%2)*3)%6===0) || ((z+100)%5===0);
      top = rej ? P.rej : P.top[Math.floor(hash3(gx,1,gz)*4)];
      if (!rej && hash3(x,9,z)>0.9) top = shade(top,0.08);
      if (P.musgo && hash3(gx,5,gz)>P.musgo[1] && !rej && hash3(x,3,z)>0.55) top = P.musgo[0];
    } else {
      // chão natural: manchas suaves
      const m = hash3(Math.floor((x+100)/3),7,Math.floor((z+100)/3))*0.6 + hash3(x,8,z)*0.4;
      top = P.top[Math.min(3, Math.floor(m*4))];
    }
    if (r > R-2) top = P.borda;
    vm.set('torso',x,-1,z,top); vm.set('torso',x,-2,z, r>R-2? P.ladoB : P.lado);
    if (r>R-3){ vm.set('torso',x,-3,z,P.fundo[0]); vm.set('torso',x,-4,z,P.fundo[1]); }
    if (r>R-1.2 && hash3(x,2,z)>0.6) vm.set('torso',x,0,z,P.seixo);
  }
  for (let i=0;i<10;i++){ const a=i/10*Math.PI*2+0.4, x=Math.round(Math.cos(a)*19), z=Math.round(Math.sin(a)*19); if (hash3(i,1,2)>0.4){ vm.set('torso',x,0,z,P.aro[0]); vm.set('torso',x+1,0,z,P.aro[1]); } }
  // enfeites: [cor, quantidade, altura extra]; longe do centro pra não entrar no herói
  let k=0; P.enf.forEach(([cor,n,alt])=>{ for (let i=0;i<n;i++,k++){ const a=hash3(k,4,4)*Math.PI*2, rr=7+hash3(k,5,5)*13, x=Math.round(Math.cos(a)*rr), z=Math.round(Math.sin(a)*rr);
    vm.set('torso',x,0,z,cor); for (let y=1;y<=(alt||0);y++) vm.set('torso',x,y,z, y===alt && alt>1 ? shade(cor,0.15) : cor); } });
  enfeitaPlat(vm, tema||'castelo', R);
  return buildMesh(vm, { pivot0:true });
}
/* enfeites 3D da plataforma por cenário (estilo novo): ficam no fundo e nas laterais, longe do herói e dos pets */
function enfeitaPlat(vm, tema, R){

  // base de pedra irregular por baixo (ilha flutuante)
  const P = PLAT[tema] || PLAT.castelo;
  for (let x=-R;x<=R;x++) for (let z=-R;z<=R;z++){ const r=Math.hypot(x+0.5,z+0.5); if (r>R-1) continue;
    const fundo = Math.floor((1-r/R)*9 + hash3(Math.floor(x/3),3,Math.floor(z/3))*4); for (let y=-5;y>=-4-fundo;y--) S(x,y,z, hash3(x,y,z)>0.75 ? shade(P.fundo[1],-0.1) : (y%3===0 ? P.fundo[1] : P.fundo[0])); }
  const H=(i,k)=>hash3(i,k,77);

  const flor=(x,z,c)=>{ for (let y=0;y<3;y++) S(x,y,z,'#3a7a3a'); S(x,3,z,'#f2e04a'); S(x+1,3,z,c); S(x-1,3,z,c); S(x,3,z+1,c); S(x,3,z-1,c); S(x,4,z,c); };
  const cogu=(x,z,c)=>{ for (let y=0;y<3;y++) S(x,y,z,'#efe6d0'); for (let dx=-2;dx<=2;dx++) for (let dz=-2;dz<=2;dz++){ if (Math.abs(dx)+Math.abs(dz)>3) continue; S(x+dx,3,z+dz, (dx+dz)%3===0 && Math.abs(dx)<2 ? '#f6f0e0' : c); if (Math.abs(dx)+Math.abs(dz)<=1) S(x+dx,4,z+dz,c); } };
  const cristal=(x,z,h,c)=>{ for (let y=0;y<h;y++){ const w = y<h-3 ? 1 : 0; for (let dx=-w;dx<=0;dx++) for (let dz=-w;dz<=0;dz++) S(x+dx+Math.round(y*0.15),y,z+dz, dx===0 ? shade(c,0.25) : c); } };
  const pinheiro=(x,z,h,c,neve)=>{ for (let y=0;y<3;y++) S(x,y,z,'#4a3020'); for (let y=3;y<h;y++){ const w=Math.max(0,Math.round((h-y)*0.45)); for (let dx=-w;dx<=w;dx++) for (let dz=-w;dz<=w;dz++){ if (Math.abs(dx)+Math.abs(dz)>w) continue; S(x+dx,y,z+dz, neve && (Math.abs(dx)+Math.abs(dz)===w) && y%3===0 ? '#f2f5fc' : (hash3(dx,y,dz)>0.6 ? shade(c,0.12) : c)); } } };
  const cacto=(x,z)=>{ const c='#4a8a3a'; for (let y=0;y<11;y++) for (let dx=0;dx<=1;dx++) S(x+dx,y,z, (y+dx)%3===0 ? '#6aa84a' : c); for (let y=4;y<8;y++) S(x-2,y,z,c); S(x-1,4,z,c); for (let y=6;y<10;y++) S(x+3,y,z,c); S(x+2,6,z,c); S(x,11,z,'#f07ab0'); };
  const tocha=(x,z)=>{ for (let y=0;y<10;y++) S(x,y,z, y%4===0 ? '#3a2414' : '#6a4524'); S(x,10,z,'#8a8f92'); S(x+1,10,z,'#8a8f92'); S(x-1,10,z,'#8a8f92'); S(x,11,z,'#e8572a'); S(x,12,z,'#ffb43a'); S(x,13,z,'#fff07a'); S(x+1,11,z,'#ffb43a'); S(x-1,11,z,'#e8572a'); };
  const lanterna=(x,z)=>{ const p='#9a968a', e='#7a766a'; for (let dx=-1;dx<=1;dx++) for (let dz=-1;dz<=1;dz++) S(x+dx,0,z+dz,e); for (let y=1;y<5;y++) S(x,y,z,p);
    for (let dx=-1;dx<=1;dx++) for (let dz=-1;dz<=1;dz++){ S(x+dx,5,z+dz,p); S(x+dx,6,z+dz,(dx===0||dz===0)?'#ffd77a':p); S(x+dx,7,z+dz,p); } for (let dx=-2;dx<=2;dx++) for (let dz=-2;dz<=2;dz++) S(x+dx,8,z+dz,e); S(x,9,z,e); };
  const barril=(x,z)=>{ for (let y=0;y<6;y++) for (let dx=-1;dx<=1;dx++) for (let dz=-1;dz<=1;dz++){ if (Math.abs(dx)+Math.abs(dz)>1 && (y===0||y===5)) continue; S(x+dx,y,z+dz, (y===1||y===4) ? '#4a4a4e' : (hash3(dx,y,dz)>0.6?'#7a5232':'#8a6040')); } };
  const caixa=(x,z)=>{ for (let y=0;y<4;y++) for (let dx=0;dx<4;dx++) for (let dz=0;dz<4;dz++) S(x+dx,y,z+dz, (dx===0||dx===3||y===0||y===3) && (dz===0||dz===3||y===0||y===3) ? '#5a3a22' : '#a07a4a'); };
  const poste=(x,z)=>{ for (let y=0;y<14;y++) S(x,y,z,'#2a2a2e'); S(x+1,13,z,'#2a2a2e'); S(x+2,13,z,'#2a2a2e'); S(x+2,12,z,'#ffd77a'); S(x+2,11,z,'#ffb43a'); };
  const toco=(x,z)=>{ for (let y=0;y<3;y++) for (let dx=-1;dx<=1;dx++) for (let dz=-1;dz<=1;dz++) S(x+dx,y,z+dz, y===2 && dx===0 && dz===0 ? '#c8a070' : (y===2 ? '#a07a4a' : '#5a3a22')); };

  const estrela=(x,z)=>{ S(x,0,z,'#e8743a'); for (const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]]) S(x+dx,0,z+dz,'#e8743a'); };

  if (tema==='floresta'){ cogu(...k(2),'#d84a3a'); cogu(...k(9),'#c0392b'); toco(...k(6)); pinheiro(...k(12),15,'#2f5a30'); [0,4,7,11,13].forEach(i=>tufo(...k(i),'#3a6a2c')); flor(...k(5),'#f0e0c0'); }

  if (tema==='vulcao'){ cristal(...k(2),9,'#2a2428'); cristal(...k(8),7,'#3a3034'); cristal(...k(12),5,'#2a2428'); lava(...k(5)); lava(...k(10)); pedra(...k(0),1,'#4a4240'); }

function kf(t, pts){

  for (let i=1;i<pts.length;i++) if (t<=pts[i][0]){ const a=pts[i-1], b=pts[i], u=(t-a[0])/((b[0]-a[0])||1); return a[1]+(b[1]-a[1])*suave(u); }
  return pts[pts.length-1][1];
}

  // enquadra herói + pet inteiros em qualquer ângulo de giro, com qualquer item, em qualquer tela:
  // testa a distância da câmera (busca binária) projetando um cilindro que envolve tudo, e centraliza na faixa livre do palco
  resize(){
    const w = this.el.clientWidth||300, h = this.el.clientHeight||300;
    if (this.renderer.domElement.parentNode){ this.renderer.setSize(w,h,false); this.renderer.domElement.style.width='100%'; this.renderer.domElement.style.height='100%'; }
    const cam = this.camera; cam.aspect = w/h; cam.clearViewOffset();
    const hb = this.hb || { y0:0, y1:32, r:10 }, pb = this.pb;
    const y0 = Math.min(hb.y0, pb ? pb.y0 : 0), y1 = Math.max(hb.y1, pb ? pb.y1 : 0), R = Math.max(hb.r, pb ? pb.r : 0, 8);
    // faixa livre (em NDC, -1..1): margem de 5% e, no layout largo, sem ficar atrás da placa do nome
    let yb = -0.92, yt = 0.92;
    const pl = this.livre ? this.livre(w,h) : null;
    const mx = (pl && typeof pl==='object' && pl.mx) || 0.92;   // celular: herói menor, sobra espaço pro minimapa
    if (pl!=null && typeof pl==='object'){ if (pl.yb!=null) yb = Math.max(yb, pl.yb); if (pl.yt!=null) yt = Math.min(yt, pl.yt); if (yt-yb < 0.5) yt = Math.min(0.92, yb+0.5); }
    else if (pl!=null) yb = Math.max(yb, pl);
    const cy = (y0+y1)/2, pitch = 0.1;
    const pts = []; for (let i=0;i<24;i++){ const a=i/24*Math.PI*2; pts.push([Math.cos(a)*R, y0, Math.sin(a)*R], [Math.cos(a)*R, y1, Math.sin(a)*R]); }
    pts.push([0,y1,0],[0,y0,0]);
    const v = new THREE.Vector3();
    const poe = d=>{ cam.position.set(0, cy + Math.sin(pitch)*d, Math.cos(pitch)*d); cam.lookAt(0, cy, 0); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true); };
    const mede = ()=>{ let ax=0, lo=9, hi=-9; for (const p of pts){ v.set(p[0],p[1],p[2]).project(cam); ax=Math.max(ax,Math.abs(v.x)); lo=Math.min(lo,v.y); hi=Math.max(hi,v.y); } return { ax, lo, hi }; };
    let a = R*1.2+2, z = 4000;
    for (let k=0;k<32;k++){ const d=(a+z)/2; poe(d); const m=mede(); if (m.ax<=mx && (m.hi-m.lo)<=(yt-yb)) z=d; else a=d; }
    if (pl && typeof pl==='object' && pl.longe) z *= pl.longe;   // celular: câmera mais longe = herói menor
    poe(z); const m = mede();
    // desloca a imagem pra centralizar o conteúdo na faixa livre (setViewOffset move em pixels; 1 NDC = h/2 px)
    const off = Math.round((((yt+yb)/2) - ((m.hi+m.lo)/2)) * h/2);
    cam.setViewOffset(w, h, 0, off, w, h); cam.updateProjectionMatrix();
    this.fit = { d:z, off, R, y0, y1, yb, yt };
  }
  frame(t){
    const s = (t-this.t0)/1000, dt = Math.min(0.05, Math.max(0, (t-this.ult)/1000)); this.ult = t;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!this.drag && t > this.autoT && !reduce) this.yaw += 0.0035;
    this.root.rotation.y = this.yaw; this.plat.rotation.y = this.yaw;
    // de vez em quando, sozinho e sem som: o herói ou um pet faz a sua graça
    if (false){ // sozinho, só andar: golpe e brincadeira dos pets só no toque
      this.proxSozinho = t + 16000 + Math.random()*14000;
      const n = this.pets.length; const k = Math.floor(Math.random()*(n+2));
      if (k<n) this.tocaPet(k, false); else if (this.model) this.tocaHeroi(false);
    }
    const a = this.anim; if (a){ a.ant = a.t; a.t += dt; }
    if (this.model && !reduce){
      this.poseHeroi(s, dt, a);
      this.posePets(s, dt, a);
    } else if (a && a.t > 2) this.anim = null;
    this.animaFx(dt);
    this.renderer.render(this.scene, this.camera);
  }
}

/* pegada de cada arma: arma de cabo (martelo, machado, lança, cajado...) fica atravessada no punho, como na mão de verdade.
   parado: cabo comprido em pé ao lado do corpo; arma curta apontando pra frente e um pouco pra baixo, mão no fim do cabo.
   no golpe: a cabeça da arma vai na frente (segue a linha do braço), mão no fim do cabo. Espadas e adagas já saem da mão em linha. */
function pegaDaArma(a){
  if (!a || a.k!=='pole') return null;
  const kd = a.kind, giro = kd==='hammer' ? Math.PI/2 : (kd==='axe' || kd==='halberd' || kd==='scythe') ? -Math.PI/2 : 0;
  const reto = kd==='spear' || kd==='trident' || kd==='orb' || kd==='king' || kd==='wand' || kd==='brush';
  return { giro, parado: a.small ? { r: Math.PI/2 + 0.55, s: 1 } : { r: 0, s: 0 }, golpe: { r: reto ? Math.PI : Math.PI - 0.35, s: 1 } };
}

/* renderizador de ícones e retratos, com cache */
const Shots = {
  r:null, cache:{},
  init(){
    this.r = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
    this.r.setSize(160,160); this.scene = new THREE.Scene(); addLights(this.scene);
    this.cam = new THREE.OrthographicCamera(-10,10,10,-10,0.1,500);
    const toque = ()=>{ this.ultToque = performance.now(); };
    ['pointerdown','keydown','wheel'].forEach(ev=>window.addEventListener(ev, toque, { capture:true, passive:true }));
    this.abreDB();
  },
  // pede um retrato: devolve o pronto ou um marcador; o desenho sai em segundo plano (um por vez) e troca a imagem sozinho.
  // Desenhar trava a tela um tiquinho (a placa de vídeo tem que entregar a imagem), então:
  //  - o que já foi desenhado fica guardado no aparelho (IndexedDB) e volta na hora nas próximas vezes;
  //  - a fila espera o jogador parar de clicar e só desenha nos intervalos livres.
  fila:[], rodando:false, ultToque:0,
  // retrato vai pra tela como endereço curto (blob:), não como o PNG inteiro em texto (34 KB cada): a aba Heróis montava ~700 KB de HTML.
  // E já nasce e fica guardado como arquivo (Blob): nada de converter texto em imagem ao abrir a aba (isso travava o boneco).
  shot(key, vm, frame, sil){
    if (this.cache[key]) return this.cache[key];
    if (!this.r) return '';
    const ph = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==#'+encodeURIComponent(key);
    if (!this.fila.some(x=>x.key===key)) this.fila.push({ key, vm, frame, sil, ph });
    this.agenda(); return ph;
  },
  troca(ph, url){ document.querySelectorAll('img').forEach(im=>{ if (im.getAttribute('src')===ph) im.src = url; }); },
  agenda(){
    if (this.rodando || !this.carregado) return; this.rodando = true;
    const livre = (fn)=> window.requestIdleCallback ? requestIdleCallback(fn, { timeout:600 }) : setTimeout(fn, 30);
    const passo = ()=>{
      if (!this.fila.length){ this.rodando = false; return; }
      // clicou agora há pouco: deixa a interface responder primeiro
      if (performance.now() - this.ultToque < 450){ setTimeout(()=>livre(passo), 150); return; }
      const j = this.fila.shift();
      const segue = url=>{ if (url) this.troca(j.ph, url); setTimeout(()=>livre(passo), 40); };
      if (this.cache[j.key]) return segue(this.cache[j.key]);
      try { this.desenha(j.key, typeof j.vm==='function' ? j.vm() : j.vm, j.frame, j.sil, segue); } catch(e){ console.error(e); segue(''); } };
    setTimeout(()=>livre(passo), 60);
  },
  // guardados no aparelho: chave = versão dos modelos + retrato
  db:null, carregado:false,
  abreDB(){
    const ver = typeof DL_RETRATOS!=='undefined' ? DL_RETRATOS : 'dev';
    const fim = ()=>{ this.carregado = true; this.fila = this.fila.filter(j=>{ if (this.cache[j.key]){ this.troca(j.ph, this.cache[j.key]); return false; } return true; }); this.agenda(); };
    try {
      if (!window.indexedDB) return fim();
      const rq = indexedDB.open('dl-retratos', 1);
      rq.onupgradeneeded = ()=> rq.result.createObjectStore('r');
      rq.onerror = fim;
      rq.onsuccess = ()=>{ const db = this.db = rq.result; const st = db.transaction('r','readwrite').objectStore('r');
        const cur = st.openCursor(); const t0 = Date.now();
        cur.onsuccess = ()=>{ const c = cur.result; if (!c){ fim(); return; }
          const k = String(c.key), i = k.indexOf('|');
          if (k.slice(0,i)===ver){ const v=c.value, nm=k.slice(i+1); if (!this.cache[nm] && v) this.cache[nm] = (typeof Blob!=='undefined' && v instanceof Blob) ? URL.createObjectURL(v) : v; } else c.delete();
          c.continue(); };
        cur.onerror = fim; setTimeout(()=>{ if (!this.carregado) fim(); }, 4000); };
    } catch(e){ fim(); }
  },
  guarda(key, url){ if (!this.db || !url) return; try { const ver = typeof DL_RETRATOS!=='undefined' ? DL_RETRATOS : 'dev'; this.db.transaction('r','readwrite').objectStore('r').put(url, ver+'|'+key); } catch(e){} },
  desenha(key, vm, frame, sil, fim){
    const g = buildMesh(vm, { sil, leve: true, so: frame==='busto' ? ['torso','head','armL','armR'] : null }); const b = cellBounds(vm);
    let cx=(b.mn[0]+b.mx[0])/2, cy=(b.mn[1]+b.mx[1])/2, cz=(b.mn[2]+b.mx[2])/2;
    let size = Math.max(b.mx[0]-b.mn[0], b.mx[1]-b.mn[1], b.mx[2]-b.mn[2])*0.62 + 1;
    if (frame==='busto'){ cy = 25.2 + (vm.piv ? (vm.piv.head[1]/(vm.res||1)-PIV.head[1])*VS : 0); size = 10; cx = 0; cz = 0; }
    if (frame==='arma') size = Math.max(b.mx[1]-b.mn[1], b.mx[0]-b.mn[0])*0.42 + 1.5;
    const piv = new THREE.Group(); piv.add(g); g.position.set(-cx,-cy,-cz); piv.rotation.y = frame==='busto' ? 0.42 : -0.6; piv.rotation.x = frame==='busto' ? 0 : 0.18;
    if (frame==='arma'){ piv.rotation.set(0.15,-0.5,-0.72); }
    this.scene.add(piv);
    const c=this.cam; c.left=-size; c.right=size; c.top=size; c.bottom=-size; c.position.set(0,frame==='busto'?3:6,100); c.lookAt(0,0,0); c.updateProjectionMatrix();
    this.r.render(this.scene, c);
    this.scene.remove(piv); disposeGroup(g);
    const cv = this.r.domElement;
    const comoTexto = ()=>{ const u = cv.toDataURL('image/png'); this.cache[key] = u; this.guarda(key, u); return u; };
    if (fim && cv.toBlob){ cv.toBlob(b=>{ if (!b) return fim(comoTexto()); const u = URL.createObjectURL(b); this.cache[key] = u; this.guarda(key, b); fim(u); }, 'image/png'); return; }
    const u = comoTexto(); if (fim) fim(u); return u;
  },
  item(it, sil){ return this.shot('i:'+it.id+(sil?':s':''), ()=>buildItemVModel(it), it.slot==='arma' && !['alaude','arco','adagas','baquetas','besta','escudo'].includes(it.c.k) ? 'arma' : null, sil); },
  hero(h, eq, sil){ return this.shot('h:'+h.id+':'+h.skin+':'+JSON.stringify(eq||{})+(sil?':s':''), ()=>buildVModel(h, eq, { leve:true }), 'busto', sil); },
  pet(p, extra, sil){ return this.shot('p:'+p.tipo+':'+(p.cor||'')+':'+JSON.stringify(Object.assign({},p.equip||{},extra||{}))+(sil?':s':''), ()=>buildPetVModel(p, extra), null, sil); },
  petItem(it){ return this.shot('pi:'+it.id, ()=>buildPetItemVModel(it), null); },
  heroFull(h, eq){ return this.shot('hf:'+h.id+':'+h.skin+':'+JSON.stringify(eq||{}), ()=>buildVModel(h, eq, { leve:true })); },
  boss(b){ const ks=Object.keys(BOSS_VISUAL); const vis = BOSS_VISUAL[b.visual] ? b.visual : ks[parseInt(hashTxt(String(b.id||b.nome)),36)%ks.length]; b={...b, visual:vis}; const v = BOSS_VISUAL[vis]; const eq={}; v.eq.forEach(id=>eq[ITEM[id].slot]=id); return this.shot('b:'+b.visual, ()=>buildVModel(Object.assign({sexo:'m'},v.h), eq, {cor:v.cor, leve:true})); }
};

/* ---------- golpe de cada arma ----------
   famílias com parâmetros; hit = momentos em que a arma acerta (na arena, o chefão sente o golpe) */
function aCima(o){ // golpe de cima pra baixo
  const T=o.t||1.3, h=T*0.4;
  return { dur:T, hit:[h], perto:true, pose(t,p,m,b,st){
    p.armR.rotation.x = kf(t,[[0,b],[h*0.7,o.alto||-2.6],[h,o.baixo||-0.2],[T*0.75,o.baixo||-0.2],[T,b]]);
    if (o.duas){ p.armL.rotation.x = p.armR.rotation.x*0.85; p.armL.rotation.z = kf(t,[[0,-0.04],[h*0.7,0.35],[T,-0.04]]); }
    m.position.y = o.pulo ? kf(t,[[0,0],[h*0.3,-0.5],[h*0.75,o.pulo],[h,0],[T,0]]) : 0;
    m.position.z = kf(t,[[0,0],[h*0.7,-0.4],[h,o.avanco||1.4],[T*0.8,o.avanco||1.4],[T,0]]);
    m.rotation.x = kf(t,[[0,0],[h*0.7,-0.12],[h,0.22],[T*0.8,0.1],[T,0]]);
    p.legL.rotation.x = kf(t,[[0,0],[h,-0.45],[T*0.8,-0.45],[T,0]]); p.legR.rotation.x = kf(t,[[0,0],[h,0.3],[T*0.8,0.3],[T,0]]);
    if (o.rastro && t<h && t>h*0.5 && st.cada(0.025)) st.brilho('ponta', o.rastro, 2);
    if (st.uma(h)){ (o.fx||['corte']).forEach(f=>st.fxArma(f)); }
    if (o.vezes>1) for (let k=1;k<o.vezes;k++){ const hh=h+k*0.28; if (st.uma(hh)) (o.fx||['corte']).forEach(f=>st.fxArma(f)); }
  } };
}
function aEstocada(o){ // estocadas pra frente
  const n=o.n||1, T=0.5+n*0.32;
  const hits=[]; for (let k=0;k<n;k++) hits.push(0.42+k*0.32);
  return { dur:T, hit:hits, perto:true, pose(t,p,m,b,st){
    const fase = t<0.3 ? t/0.3 : 1, k = Math.min(n-1, Math.max(0, Math.floor((t-0.3)/0.32))), u = (t-0.3-k*0.32)/0.32;

(function(){

    m.rotation.y = e*0.95; p.head.rotation.set(-0.04*e, -e*0.82, 0.04*e); p.torso.rotation.set(0, 0, 0);
    p.legL.rotation.x = -0.18*e; p.legR.rotation.x = 0.16*e; if (p.shinL) p.shinL.rotation.x = 0.12*e; if (p.shinR) p.shinR.rotation.x = 0.1*e;
  }
  // e: postura; eR: mão direita indo pra corda; u: puxada; rc: recuo depois de soltar
  function ikArco(st, e, eR, u, rc){
    if (e < 0.01) return;
    const ax = st.eixos(), p = st.model.userData.parts; st.model.updateMatrixWorld(true);

    const alvoL = SL.clone().add(ax.frente.clone().multiplyScalar(20)).add(ax.cima.clone().multiplyScalar(1.2));
    st.ikBraco('L', lerpV(st.mao('L'), alvoL, e), ax.cima.clone().negate().add(ax.dir.clone().multiplyScalar(-0.3)));
    if (eR < 0.01) return;

    const ate = grip.clone().sub(cab).dot(ax.frente) - 1.2;
    const ancora = grip.clone().sub(ax.frente.clone().multiplyScalar(ate)).add(ax.cima.clone().multiplyScalar(0.6));
    const corda = grip.clone().sub(ax.frente.clone().multiplyScalar(2.6));
    let alvo = lerpV(corda, ancora, u);
    if (rc > 0) alvo = alvo.add(ax.frente.clone().multiplyScalar(-1.6*rc)).add(ax.dir.clone().multiplyScalar(0.8*rc));
    const polo = ax.dir.clone().add(ax.cima.clone().multiplyScalar(0.35)).add(ax.frente.clone().multiplyScalar(-0.6));
    st.ikBraco('R', lerpV(st.mao('R'), alvo, eR), polo);

    ik(t,p,m,st){ ikArco(st, kf(t,[[0,0],[0.3,1],[1.4,1],[1.75,0]]), kf(t,[[0.08,0],[0.36,1],[1.4,1],[1.7,0]]), t<0.98 ? kf(t,[[0.38,0],[0.85,1]]) : 0, kf(t,[[0.98,0],[1.06,1],[1.35,1],[1.6,0]])); } };
  // arco da loja: vários tiros seguidos

    return { dur:T+0.35, hit:hits.map(x=>x+0.12), longe:true, arco:true, rosto:'mira',
      nock:t=> fase(t).nock,
      pose(t,p,m,b,st){ poseArco(kf(t,[[0,0],[0.3,1],[T,1],[T+0.35,0]]), p, m); hits.forEach(hh=>{ if (st.uma(hh)) st.soltaFlecha(); }); },
      ik(t,p,m,st){ const fz = fase(t), ult = hits[hits.length-1]; let rc = 0; hits.forEach(hh=>{ rc = Math.max(rc, kf(t,[[hh,0],[hh+0.07,1],[hh+0.25,0.4],[hh+0.45,0]])); });
        ikArco(st, kf(t,[[0,0],[0.3,1],[T,1],[T+0.35,0]]), kf(t,[[0.1,0],[0.4,1],[T,1],[T+0.3,0]]), fz.u, rc); } };
  }

  function ikAlaude(st, e, t, rapido){

    const ax = st.eixos(); st.model.updateMatrixWorld(true);
    const braco = c.localToWorld(new V3(2.15, 27.6, -2.6)), boca = c.localToWorld(new V3(-1.0, 20.2, -3.9));
    const dedilha = boca.add(ax.cima.clone().multiplyScalar(Math.sin(t*(rapido?40:26))*0.7));
    st.ikBraco('L', lerpV(st.mao('L'), braco, e), ax.cima.clone().negate().add(ax.dir.clone().multiplyScalar(-0.8)));

  for (const k in ANIM_ARMA){ const d = ANIM_ARMA[k]; if (!d.rosto) d.rosto = d.longe ? 'mira' : 'grito'; }

/* ===== Humor: o jogador escolhe como está no botão do canto do palco (ou o agente manda, tipo "humor"), e o herói fica assim o dia todo.
   Balão com emoji em cima do ombro, ritmo do passo (corre, pula, arrasta o pé), cabeça baixa e lágrimas.
   S.humor[dia] = { energia:-3..3, afeto:-3..3, emocao, em }. Vale o de hoje; sem o de hoje, o de ontem. ===== */
const EMOCOES = {
  feliz:   { nome:'Feliz',     emoji:'😄', cara:'😄' },
  calmo:   { nome:'De boa',    emoji:'😌', cara:'😌' },
  agitado: { nome:'Elétrico',  emoji:'⚡', cara:'🤪' },
  cansado: { nome:'Cansado',   emoji:'💤', cara:'😴' },
  triste:  { nome:'Triste',    emoji:'😢', cara:'😢' },
  ansioso: { nome:'Ansioso',   emoji:'😰', cara:'😰' },
  raiva:   { nome:'Puto',      emoji:'💢', cara:'😡' }
};
// sem emoção escrita, sai dos números (energia e afeto de -3 a +3)
function emocaoDe(h){
  if (!h) return null;
  if (h.emocao && EMOCOES[h.emocao]) return h.emocao;
  const e = Number(h.energia)||0, a = Number(h.afeto)||0;
  if (a <= -2) return 'triste';
  if (e >= 2) return 'agitado';
  if (e <= -2) return 'cansado';
  if (a <= -1 && e <= -1) return 'triste';
  if (a >= 1) return 'feliz';
  return 'calmo';
}
function humorAtual(){
  // vale só o dia: amanhã ele pergunta de novo
  const H = (typeof S!=='undefined' && S.humor) || {}, hoje = hojeReal();
  const dia = H[hoje] ? hoje : null; if (!dia) return null;
  const h = H[dia], emo = emocaoDe(h);
  return { dia, emo, energia:Number(h.energia)||0, afeto:Number(h.afeto)||0, hoje: dia===hoje };
}

(function(){
  const P = Stage.prototype;

  // ritmo do passo por emoção (multiplica o jeito de andar da classe)
  const PASSO = {
    agitado: { freq:1.9, passo:1.3, bracos:1.5, quica:1.6 },
    feliz:   { freq:1.15, quica:1.5, bracos:1.15 },
    raiva:   { freq:1.25, passo:1.15, bracos:1.4, quica:0.8 },
    ansioso: { freq:1.35, passo:0.8, bracos:0.7 },
    cansado: { freq:0.55, passo:0.7, bracos:0.5, quica:0.35 },
    triste:  { freq:0.7, passo:0.75, bracos:0.45, quica:0.5 },
    calmo:   {}
  };
  P.passoHumor = function(E){
    const m = this.humor && PASSO[this.humor.emo]; if (!m) return E;
    const o = Object.assign({}, E); for (const k in m) o[k] = (o[k]||0) * m[k]; return o;
  };
  // por cima da pose de andar: cabeça baixa, pulinhos, tremidinha
  P.poseHumor = function(s, dt, a){
    const h = this.humor; if (!h || !this.model || this.cena || this.arena || (a && a.alvo==='heroi')) return;
    const p = this.model.userData.parts, m = this.model, wk = this.andar==null ? 1 : this.andar;
    if (h.emo==='triste' || h.emo==='cansado'){
      p.head.rotation.x += (h.emo==='triste' ? 0.32 : 0.22);
      p.armL.rotation.z += 0.05; p.armR.rotation.z -= 0.05;
      if (p.torso) p.torso.rotation.x += 0.06;
    }
    if (h.emo==='agitado'){
      // pulinho a cada ~1,6 s
      const ciclo = 1.6, t = s % ciclo, dur = 0.42;
      if (t < dur){ const k = t/dur; m.position.y += Math.sin(k*Math.PI) * 3.2 * wk; p.legL.rotation.x -= Math.sin(k*Math.PI)*0.5; p.legR.rotation.x -= Math.sin(k*Math.PI)*0.5; }
    }
    if (h.emo==='feliz'){ p.head.rotation.z += Math.sin(s*3.2)*0.08; }
    if (h.emo==='raiva'){ p.head.rotation.x += 0.12; m.rotation.x += 0.05; }
    if (h.emo==='ansioso'){ m.position.x += Math.sin(s*47)*0.12; p.head.rotation.y += Math.sin(s*1.7)*0.25; }
    if (h.emo==='triste') this.lagrimas(dt);
  };
  // rosto (no modelo que tem rosto): expressão do humor quando não tem animação
  P.rostoHumor = function(){
    const h = this.humor; if (!h) return null;

  };

  /* ---------- lágrimas: gotinhas azuis que caem dos olhos ---------- */
  const V = new THREE.Vector3();
  P.lagrimas = function(dt){
    const p = this.model.userData.parts; if (!p.head) return;
    this.lagT = (this.lagT||0) - dt; if (this.lagT > 0) return; this.lagT = 0.28 + Math.random()*0.2;
    const lado = (this.lagLado = -(this.lagLado||1));
    this.model.updateMatrixWorld(true);
    const hb = this.hb || { y1:32 }, hy = (p.head.userData.base||[0,hb.y1-8,0])[1];
    V.set(lado*2.2, hy + 5.6, 4.9); this.model.localToWorld(V); this.root.worldToLocal(V);
    if (!this.fxMat.lagrima) this.fxMat.lagrima = new THREE.MeshBasicMaterial({ color:0x6fc3ff, transparent:true, opacity:0.95 });
    const g = new THREE.Mesh(this.fxGeo, this.fxMat.lagrima); g.position.copy(V); g.scale.setScalar(0.75);
    this.fxG.add(g);
    this.fx.push({ m:g, vel:new THREE.Vector3(lado*0.6, 1.2, 1.4), vida:1.0, total:1.0, tam:0.75, grav:16, gira:0 });
  };

  /* ---------- balão com emoji, do lado da cabeça (fica parado na tela, o palco gira por baixo) ---------- */
  function texturaBalao(emoji){
    // alta resolução e suavizado: emoji nítido, nada de quadriculado
    const W = 256, H = 236, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const bolha = ()=>{ g.beginPath(); const x=10, y=8, w=W-20, h=H-56, r=46;
      g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r); g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      g.lineTo(x+86,y+h); g.lineTo(x+34,y+h+40); g.lineTo(x+52,y+h); g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); };
    g.save(); g.translate(0,6); bolha(); g.fillStyle='rgba(0,0,0,0.35)'; g.fill(); g.restore();
    bolha(); g.fillStyle='#fbf6ea'; g.fill(); g.lineWidth=8; g.strokeStyle='#1a1d1f'; g.stroke();
    g.font = '128px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, W/2, 8 + (H-56)/2 + 8);
    const t = new THREE.CanvasTexture(cv); t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
    if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
    return t;
  }
  P.setHumor = function(h){
    const emo = h && h.emo, mostra = emo && emo!=='calmo';
    this.humor = h || null;
    if (this.balao && this.balao.userData.emo !== emo){ this.scene.remove(this.balao); this.balao.material.map.dispose(); this.balao.material.dispose(); this.balao = null; }
    if (mostra && !this.balao){
      const mat = new THREE.SpriteMaterial({ map:texturaBalao(EMOCOES[emo].emoji), transparent:true, depthTest:false });
      this.balao = new THREE.Sprite(mat); this.balao.renderOrder = 10; this.balao.userData.emo = emo; this.balao.scale.set(0.001,0.001,1);

  P.balaoPasso = function(dt, a){
    const b = this.balao; if (!b) return;
    const h = this.humor, longo = h && (h.emo==='triste' || h.emo==='cansado');

      else if (t < vis - 0.2) k = 1;
      else if (t < vis) k = (vis - t)/0.2;

    const tam = 7.2;
    b.visible = k > 0.01;
    b.scale.set(tam*256/236*k, tam*k, 1);
    b.position.set(Math.min(hb.r*0.55, 7) + tam*0.45, hb.y1 - 2.6 - tam*0.15 + Math.sin(this.balaoT*2.4)*0.25, 0);
  };

  // liga tudo na pose do herói
  const pose0 = P.poseHeroi;
  P.poseHeroi = function(s, dt, a){
    pose0.call(this, s, dt, a);
    this.poseHumor(s, dt, a);
    this.balaoPasso(dt, a);
